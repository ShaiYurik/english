<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מסע האנגלית</title>
<meta name="theme-color" content="#0a1a29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מסע האנגלית">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&family=Alegreya:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — a sea chart map of islands as levels, chart-paper cards for exercises, rope-and-brass details. Single committed dark-sea look. */
:root{
  color-scheme: dark;
  --abyss:#0a1a29; --sea:#10304a; --sea2:#174260; --swell:#22587c;
  --chart:#eef2ea; --chart2:#dfe7dc; --ink:#0f2233; --ink2:#41586b;
  --brass:#d6a64a; --brass2:#f0cf86; --signal:#e2553b; --kelp:#2f8a63; --kelp2:#d7efe2; --redsoft:#f8ddd6;
  --foam:#d9e7ee; --muted:#86a2b6;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-en:"Alegreya",Georgia,"Times New Roman",serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--abyss);color:var(--foam);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% 0%, var(--sea) 0%, var(--abyss) 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--abyss)}
[hidden]{display:none!important}
img{max-width:100%}
#app{max-width:560px;margin:0 auto;padding-block:12px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--brass2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:12px}
.brand h1{font-size:24px;color:var(--chart)}
.brand small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.4px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok{background:#4fd18f}.sync.wait{background:var(--brass2)}.sync.off{background:var(--signal)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--swell);background:var(--sea);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="false"]{opacity:.55}

.voyage{background:var(--sea);border:1px solid var(--swell);border-radius:var(--r);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.voyage .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.voyage .lbl{font-family:var(--f-display);font-size:16px;color:var(--chart)}
.voyage .num{font-variant-numeric:tabular-nums;color:var(--brass2);font-weight:700}
.track{position:relative;height:30px}
.track .line{position:absolute;inset:14px 0 auto;height:0;border-top:2px dashed var(--swell)}
.track .done{position:absolute;top:13px;right:0;height:4px;background:var(--brass);border-radius:2px;transition:width .6s}
.track .ship{position:absolute;top:0;width:30px;height:30px;transform:translateX(50%);transition:right .6s}
.track .port{position:absolute;left:-4px;top:6px;width:18px;height:18px}
.streak{font-size:13px;color:var(--muted)}

.map{background:var(--sea);border-radius:var(--r);overflow:hidden;border:1px solid var(--swell)}
.map svg{display:block;width:100%;height:auto}
.isl{cursor:pointer}
.isl:focus{outline:none}
.isl:focus-visible .ring{stroke:var(--brass2);stroke-width:3}
.maphint{font-size:13px;color:var(--muted);text-align:center;margin:0}

.card{background:var(--chart);color:var(--ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px -18px #000}
.card h2{font-size:22px;color:var(--ink)}
.card p{margin:0}
.sub{color:var(--ink2);font-size:14px}
.back{align-self:flex-start;background:none;border:0;color:var(--foam);display:flex;align-items:center;gap:6px;padding:4px 0;font-weight:600}
.back svg{width:18px;height:18px}
.ihead{display:flex;flex-direction:column;gap:4px}
.ihead .eyebrow{font-size:12px;letter-spacing:1.2px;color:var(--brass2);text-transform:uppercase}
.ihead h2{font-size:28px;color:var(--chart)}
.ihead p{color:var(--muted);margin:0}

.stations{display:grid;gap:10px}
.station{display:flex;align-items:center;gap:14px;text-align:start;background:var(--chart);color:var(--ink);border:0;border-radius:var(--r);padding:14px 16px}
.station .ic{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sea);color:var(--brass2)}
.station .ic svg{width:24px;height:24px}
.station .tx{flex:1;min-width:0}
.station b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.station span{font-size:14px;color:var(--ink2)}
.station .mark{font-size:13px;font-weight:700;color:var(--kelp);white-space:nowrap}

.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:16px;background:var(--sea);color:var(--chart);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.red{background:var(--signal);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink2)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.flash{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.flash .word{font-family:var(--f-en);font-size:44px;font-weight:700;color:var(--ink);line-height:1.1;overflow-wrap:anywhere}
.flash .he{font-size:22px;font-weight:700;color:var(--sea2)}
.flash .ex{font-family:var(--f-en);font-size:19px;color:var(--ink2);direction:ltr}
.speak{width:56px;height:56px;border-radius:50%;border:0;background:var(--sea);color:var(--brass2);display:grid;place-items:center}
.speak svg{width:26px;height:26px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--chart2)}
.dots i.on{background:var(--brass)}

.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chart2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .4s}
.prompt{font-size:20px;font-weight:700;line-height:1.35}
.prompt .en{font-size:30px}
.gap{font-family:var(--f-en);font-size:22px;direction:ltr;text-align:left;line-height:1.5;background:var(--chart2);padding:12px 14px;border-radius:10px}
.gap u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 22px}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--chart2);background:#fff;color:var(--ink);border-radius:12px;padding:13px 16px;font-size:18px;text-align:start;font-weight:600}
.opt.en{font-family:var(--f-en);text-align:left;font-size:21px}
.opt.ok{background:var(--kelp2);border-color:var(--kelp)}
.opt.bad{background:var(--redsoft);border-color:var(--signal)}
.opt[disabled]{cursor:default}
.fb{font-weight:700;min-height:24px}
.fb.ok{color:var(--kelp)} .fb.bad{color:var(--signal)}

.read{font-family:var(--f-en);direction:ltr;text-align:left;font-size:21px;line-height:1.75}
.read .w{cursor:pointer;border-radius:4px;padding:0 1px}
.read .w:hover,.read .w.hl{background:var(--brass2)}
.story{font-size:19px;line-height:1.8}
.tip{font-size:13px;color:var(--ink2)}
.qblock{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--chart2)}
.qblock .q{font-family:var(--f-en);direction:ltr;text-align:left;font-weight:700;font-size:18px}

.result{align-items:center;text-align:center}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:42px;height:42px}
.big{font-family:var(--f-display);font-size:40px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--f-en);background:var(--redsoft);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:15px;direction:ltr}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:13px;color:var(--ink2)}
.log{display:flex;flex-direction:column}
.logrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--chart2)}
.logrow:last-child{border-bottom:0}
.logrow .d{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sea2);min-width:58px}
.logrow .m{min-width:0;font-size:14px;color:var(--ink2)}
.logrow .s{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chart2);color:var(--ink)}
.pill.ok{background:var(--kelp2);color:var(--kelp)} .pill.warn{background:var(--redsoft);color:#a53a24}
form.f{display:grid;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
.f input,.f textarea{font:inherit;font-size:16px;border:1.5px solid var(--chart2);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);min-width:0;width:100%}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.wtag{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 6px 4px 12px;font-size:15px}
.wtag .en{font-weight:700}
.wtag button{border:0;background:var(--chart2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--ink)}
.empty{font-size:14px;color:var(--ink2);background:var(--chart2);border-radius:10px;padding:12px}
.zitem{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.zitem .zt{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.zitem a{color:var(--sea2);font-weight:700}
.report{white-space:pre-wrap;font-size:14px;background:#fff;border-radius:10px;padding:12px;color:var(--ink);max-height:240px;overflow:auto}

/* recorder */
.recpanel{background:var(--ink);color:var(--chart);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.recdot{width:96px;height:96px;border-radius:50%;background:var(--signal);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(226,85,59,.6);animation:pulse 1.6s infinite}
.recdot svg{width:40px;height:40px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,85,59,.55)}70%{box-shadow:0 0 0 22px rgba(226,85,59,0)}100%{box-shadow:0 0 0 0 rgba(226,85,59,0)}}
.rectime{font-family:var(--f-display);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.level{width:100%;max-width:280px;height:10px;border-radius:5px;background:#24384a;overflow:hidden}
.level i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd18f,#f0cf86,#e2553b);transition:width .1s}
.recmeta{font-size:14px;color:var(--muted)}
.recfloat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--signal);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px -10px #000}
.recfloat i{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* camera */
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 10px;border-radius:var(--r);background:var(--sea);color:var(--chart);font-weight:700;cursor:pointer;text-align:center}
.shoot label.main{background:var(--brass);color:var(--ink)}
.shoot svg{width:34px;height:34px}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--chart2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;inset:auto 4px 4px auto;font-size:11px;font-weight:800;padding:2px 6px;border-radius:999px;background:#fff;color:var(--ink)}
.thumb span.ok{background:var(--kelp2);color:var(--kelp)}
.thumb span.err{background:var(--redsoft);color:#a53a24}
.thumb button{position:absolute;inset:4px auto auto 4px;border:0;width:26px;height:26px;border-radius:50%;background:rgba(15,34,51,.75);color:#fff;display:grid;place-items:center}

/* book games */
.pic{font-size:72px;text-align:center;line-height:1.2;padding:6px 0}
.opt.sel{background:var(--chart2);border-color:var(--sea2)}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfb{text-align:center;font-family:var(--f-body);font-size:17px}
.fixbox{background:var(--kelp2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fixbox .en{font-size:20px;direction:ltr;text-align:left;align-self:stretch}
.cargo{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--sea);color:var(--chart);border-radius:14px;padding:18px;font-size:30px;font-weight:700}
.speak.sm{width:42px;height:42px}.speak.sm svg{width:20px;height:20px}
.boats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.boatbtn{border:2px solid var(--chart2);background:#fff;color:var(--ink);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.boatbtn svg{width:30px;height:30px;color:var(--sea2)}
.boatbtn b{font-size:16px;overflow-wrap:anywhere}.boatbtn span{font-size:12px;color:var(--ink2)}
.boatbtn.ok{background:var(--kelp2);border-color:var(--kelp)}.boatbtn.bad{background:var(--redsoft);border-color:var(--signal)}
.memo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:4/3;max-width:100%;border:0;border-radius:12px;background:var(--sea);color:var(--brass2);display:grid;place-items:center;font-size:18px;font-weight:700;padding:4px;transition:transform .2s}
.mcard .back-face{font-size:26px;opacity:.8}
.mcard.open{background:#fff;color:var(--ink);border:2px solid var(--chart2);transform:rotateY(0)}
.mcard.done{background:var(--kelp2);border-color:var(--kelp)}
.mcard .en{overflow-wrap:anywhere}
.olist{display:grid;gap:8px}
.ordr{display:flex;gap:10px;align-items:flex-start;font-size:18px}
.ordr .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--chart2);display:grid;place-items:center;font-family:var(--f-body);font-size:14px}
.ordr.ok .num{background:var(--kelp);color:#fff}
.spellq{display:flex;align-items:center;justify-content:center;gap:14px;font-size:24px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr}
.slot{width:38px;height:46px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-size:28px;font-weight:700;text-transform:lowercase}
.slot.ok{color:var(--kelp);border-color:var(--kelp)}.slot.bad{color:var(--signal);border-color:var(--signal)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tile{width:46px;height:50px;border:0;border-radius:10px;background:var(--brass);color:var(--ink);font-size:26px;font-weight:700;box-shadow:0 3px 0 #a87d27}
.tile[disabled]{opacity:.25;box-shadow:none}
.kara .w.hl{background:var(--brass2);box-shadow:0 0 0 2px var(--brass2)}
.kp{margin:0 0 12px}
.gloss{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gloss .sub{width:100%;margin:0}
.r2 .w.good{background:var(--kelp2);color:var(--kelp)}.r2 .w.miss{background:var(--redsoft);color:#a53a24}
.exam{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--chart);background:var(--sea2);border-radius:10px;padding:6px 10px}
.exam b{color:var(--brass2);font-variant-numeric:tabular-nums}
/* captain's report & full reading */
.conquer{text-align:center;align-items:center;background:linear-gradient(180deg,var(--brass2),var(--chart) 55%)}
.conquer h2{font-size:28px}.flagrow{font-size:34px;letter-spacing:6px}
.report-box{display:grid;gap:8px;width:100%;text-align:start}
.reprow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar{height:8px;background:var(--chart2);border-radius:4px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:4px}
.rbar i.top{background:var(--kelp)}.rbar i.good{background:var(--brass)}.rbar i.low{background:var(--signal)}
.rl{font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.rl.top{color:var(--kelp)}.rl.good{color:#9a6f14}.rl.low{color:var(--signal)}.rl.none{color:var(--ink2)}
.tips{display:grid;gap:6px;width:100%;text-align:start;background:#fff;border-radius:12px;padding:10px 12px;font-size:15px}
.tips p{margin:0}
button.chip{border:0;cursor:pointer}
.rtp{margin:0 0 12px;padding:6px 8px;border-radius:10px;transition:background .3s}
.rtp.cur{background:#fff;box-shadow:0 0 0 2px var(--brass)}
.rtp.next{opacity:.45}
.rt .w.good{color:var(--kelp);background:var(--kelp2)}.rt .w.miss{color:#a53a24;background:var(--redsoft)}
.rtctl{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--chart);padding:8px 0}
.rfb{display:grid;gap:6px;text-align:start;width:100%;background:#fff;border-radius:12px;padding:12px;font-size:16px}
.rfb p{margin:0}
/* timetable & exams */
.nextex{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sea);border:1px solid var(--swell);border-radius:var(--r);padding:14px;color:var(--chart);text-align:center}
.nextex b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--brass2)}
.nextex span{font-size:14px;color:var(--muted)}
.nextex.eng{border-color:var(--brass)}
.daychips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dchip{border:1.5px solid var(--chart2);background:#fff;border-radius:10px;padding:8px 2px;font-weight:700;font-size:14px;color:var(--ink);position:relative}
.dchip.on{background:var(--sea);color:var(--chart);border-color:var(--sea)}
.dchip.today::after{content:"";position:absolute;top:4px;inset-inline-end:4px;width:6px;height:6px;border-radius:50%;background:var(--signal)}
.ttable{display:grid;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;border:1.5px solid transparent}

/* ============ CONNECTION ============ */
const API='https://script.google.com/macros/s/AKfycbxLlbEJozfMjmGyQZeeJm0lXCW-NhjTsNaQ7UPCaaQ8qAqmo_yee2h7FEY4LW1IIXWJ4g/exec';
const LS={get(k,d){try{const v=localStorage.getItem('voy:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('voy:'+k,JSON.stringify(v))}catch(e){}}};
let KEY=LS.get('key','');
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
// בדפדפן משאירים את המפתח בכתובת, כדי ש"הוסף למסך הבית" באייפון ישמור אותו גם לאפליקציה
function readKey(){const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);if(m){KEY=m[1];LS.set('key',KEY);if(STANDALONE)history.replaceState(null,'',location.pathname+location.search);return true}return false}
function keyFromText(t){const m=String(t||'').match(/k=([A-Za-z0-9_-]{10,})/)||String(t||'').trim().match(/^([A-Za-z0-9_-]{10,})$/);return m?m[1]:''}
readKey();
addEventListener('hashchange',()=>{if(readKey()){S.badKey=false;loadAll()}});

async function apiGet(){const r=await fetch(API+'?key='+encodeURIComponent(KEY),{cache:'no-store'});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');return j}
async function apiPost(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,...body})});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');return j}

/* outbox: latest version of each state doc, sent when online */
let outbox=LS.get('outbox',{});let flushing=false,flushTimer=null;
function enqueue(id,body){outbox[id]=body;LS.set('outbox',outbox);setSync();clearTimeout(flushTimer);flushTimer=setTimeout(flush,1500)}
async function flush(){
  if(flushing||!KEY)return;flushing=true;
  try{
    for(const id of Object.keys(outbox)){
      const body=outbox[id];
      try{await apiPost(body);if(outbox[id]===body){delete outbox[id];LS.set('outbox',outbox)}}
      catch(e){console.warn('sync',e);
        if(/not allowed|bad state/.test(e.message)){delete outbox[id];LS.set('outbox',outbox);continue}
        if(/bad key/.test(e.message)){S.badKey=true}break}
    }
  }finally{flushing=false;setSync()}
}
setInterval(()=>{flush();flushUploads()},60000);
addEventListener('online',()=>{flush();flushUploads()});

/* upload queue in IndexedDB, so a recording is never lost */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('voyage',1);r.onupgradeneeded=()=>r.result.createObjectStore('up',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('up',mode);const st=t.objectStore('up');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  put(o){return this.tx('readwrite',s=>s.put(o))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  all(){return this.tx('readonly',s=>s.getAll())}
};
let upBusy=false;const upStatus={};
function blobToB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
async function queueUpload(item){try{await IDB.put(item)}catch(e){console.warn(e)}upStatus[item.id]='wait';flushUploads()}
async function flushUploads(){
  if(upBusy||!KEY)return;upBusy=true;
  try{
    let items=[];try{items=await IDB.all()}catch(e){}
    for(const it of items){
      upStatus[it.id]='up';refreshUploadUI();
      try{
        const b64=await blobToB64(it.blob);
        const res=await apiPost({action:it.kind==='rec'?'uploadRec':'uploadPhoto',b64,mime:it.blob.type,...it.meta});
        await IDB.del(it.id);upStatus[it.id]='ok';
        if(it.kind==='rec')onRecUploaded(it,res.file);
        if(it.kind==='photo'){S.pendingPhotos=(S.pendingPhotos||0)+1;cache()}
      }catch(e){
        console.warn('upload',e);upStatus[it.id]='err';
        if(/גדול|מגבלה|מקום|רק תמונות/.test(e.message)){await IDB.del(it.id);toast(e.message)}
        break;
      }
      refreshUploadUI();
    }
  }finally{upBusy=false;refreshUploadUI();setSync()}
}

/* ============ UTIL ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');

/* ============ STATE ============ */
const S={
  progress:{unlocked:1,best:{},xp:0}, session:null, sessions:[], classWords:[], zoom:[], lessons:[], pendingPhotos:0,
  role:LS.get('role','child'), scheduleState:null,calDay:null,editLesson:null,tab:LS.get('role','child')==='parent'?'parent':'map', screen:{name:'map'}, sound:LS.get('sound',true), loaded:false, online:null, badKey:false,
  activeSec:0, lastInput:Date.now(), shots:[]

function newSession(){return {date:today(),minutes:0,activities:[],missed:[],readOk:0,readHelp:0,updatedAt:Date.now()}}
function cache(){LS.set('cache',{schedule:S.scheduleState,progress:S.progress,sessions:[S.session,...S.sessions.filter(s=>s.date!==S.session.date)].slice(0,40),classwords:S.classWords,zoom:S.zoom,lessons:S.lessons,pendingPhotos:S.pendingPhotos})}
const isParent=()=>S.role==='parent';
function setRole(r){
  r=r==='parent'?'parent':'child';
  if(r===S.role)return;
  S.role=r;LS.set('role',r);
  if(r==='parent'){S.tab='parent'}else if(S.tab==='parent'){S.tab='map'}
}
function saveSession(){if(isParent())return;S.session.updatedAt=Date.now();enqueue('session:'+S.session.date,{action:'saveSession',data:JSON.parse(JSON.stringify(S.session))});cache()}
function saveState(name){if(isParent()&&name==='progress')return;const data={progress:S.progress,classwords:S.classWords,zoom:S.zoom,schedule:S.scheduleState}[name];enqueue('state:'+name,{action:'saveState',name,data:JSON.parse(JSON.stringify(data))});cache()}

function applyState(st,fromServer){
  if(!st)return;
  const pend=k=>fromServer&&outbox['state:'+k];
  if(st.progress&&!pend('progress')){
    const p={unlocked:1,best:{},xp:0,...st.progress};
    if(fromServer&&S.progress){p.unlocked=Math.max(p.unlocked,S.progress.unlocked||1);p.xp=Math.max(p.xp||0,S.progress.xp||0);
      for(const [k,v] of Object.entries(S.progress.best||{})){const b=p.best[k]||(p.best[k]={});for(const [kk,vv] of Object.entries(v)){b[kk]=typeof vv==='number'?Math.max(b[kk]||0,vv):(b[kk]||vv)}}}
    S.progress=p;
  }
  if(st.classwords&&!pend('classwords'))S.classWords=st.classwords;
  if(st.zoom&&!pend('zoom'))S.zoom=st.zoom;
  if(st.schedule!==undefined&&st.schedule&&!pend('schedule'))S.scheduleState=st.schedule;
  if(st.lessons)S.lessons=st.lessons;
  if(typeof st.pendingPhotos==='number')S.pendingPhotos=st.pendingPhotos;
  if(st.sessions){
    const t=today();const remoteToday=st.sessions.find(s=>s&&s.date===t);
    S.sessions=st.sessions.filter(s=>s&&s.date!==t).sort((a,b)=>b.date.localeCompare(a.date));
    const local=S.session&&S.session.date===t?S.session:null;
    let cur=local;
    if(fromServer&&isParent())cur=remoteToday?{...newSession(),...remoteToday}:newSession();
    else if(remoteToday&&(!local||(remoteToday.minutes||0)>(local.minutes||0)||((remoteToday.activities||[]).length>(local.activities||[]).length)))cur={...newSession(),...remoteToday};
    S.session=cur||newSession();
    S.activeSec=Math.max(S.activeSec,(S.session.minutes||0)*60);
  }
}
async function loadAll(){
  const c=LS.get('cache',null);
  if(c)applyState(c,false);
  if(!S.session||S.session.date!==today())S.session=newSession();
  S.activeSec=(S.session.minutes||0)*60;
  S.loaded=true;render();

function islandRatio(i){const st=stationsOf(i).filter(s=>s.scored);if(!st.length)return 1;const b=S.progress.best[i.id]||{};return st.filter(s=>(b[s.k]||0)>=70).length/st.length}

function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function buildVocabQuiz(i,n=10){
  const words=i.words;const pool=[];allIslands().forEach(x=>pool.push(...x.words));
  const order=shuffle([...shuffle(words),...shuffle(words)]).slice(0,Math.min(n,words.length*2));
  return order.map((w,k)=>{
    const others=shuffle(words.filter(x=>x.en!==w.en));
    let guard=0;while(others.length<3&&guard++<50){const r=pool[Math.floor(Math.random()*pool.length)];if(r&&r.en!==w.en&&r.he!==w.he&&!others.some(o=>o.en===r.en))others.push(r)}
    const distract=others.slice(0,3);
    const form=w.form||w.en;
    const re=new RegExp('\\b'+reEsc(form)+'\\b','i');
    const canGap=w.ex&&re.test(w.ex);
    const types=['en2he','he2en','listen'];if(canGap)types.push('gap','gap');
    const t=types[(k+Math.floor(Math.random()*types.length))%types.length];
    if(t==='en2he') return {t,word:w.en,prompt:`מה הפירוש של <span class="en">${esc(w.en)}</span>?`,say:w.en,opts:shuffle([w,...distract]).map(x=>x.he),ans:w.he,en:false};
    if(t==='he2en') return {t,word:w.en,prompt:`איך אומרים באנגלית: <b>${esc(w.he)}</b>?`,opts:shuffle([w,...distract]).map(x=>x.en),ans:w.en,en:true};
    if(t==='listen') return {t,word:w.en,prompt:'הקשב ובחר את המילה ששמעת',say:w.en,autoSay:true,opts:shuffle([w,...distract]).map(x=>x.en),ans:w.en,en:true};
    return {t:'gap',word:w.en,prompt:'השלם את המשפט',gap:esc(w.ex).replace(new RegExp('\\b'+reEsc(esc(form))+'\\b','i'),'<u></u>'),say:w.ex,opts:shuffle([w,...distract]).map(x=>x.form||x.en),ans:form,en:true};
  });
}

function finishActivity(kind,title,correct,total,missed,extra){
  const i=islandById(S.screen.id);const id=i.id;const pct=total?Math.round(correct/total*100):100;
  const ratioBefore=islandRatio(i);
  S.session.activities.push({kind,island:id,islandName:i.name,title,correct,total,at:Date.now()});
  if(missed&&missed.length)S.session.missed=[...new Set([...S.session.missed,...missed])].slice(-60);
  saveSession();
  const b=S.progress.best[id]||(S.progress.best[id]={});
  if(kind==='learn')b.learn=true;else if(kind==='story')b.story=true;else if(kind==='read')b.read=true;else if(kind!=='drill')b[kind]=Math.max(b[kind]||0,pct);
  if(missed&&missed.length)b.missed=[...new Set([...missed,...(b.missed||[])])].slice(0,24);
  if(kind==='readtext'&&extra){b.readHist=[...(b.readHist||[]),{pct,wpm:extra.wpm,d:today()}].slice(-6)}
  const ratioAfter=islandRatio(i);const hasScored=stationsOf(i).some(x=>x.scored);
  const islandDone=!hasScored?null:(ratioAfter>=1&&ratioBefore<1)?'full':(ratioAfter>=.5&&ratioBefore<.5)?'pass':null;
  if(i.kind==='book'){const list=bookIslands();const k=list.findIndex(x=>x.id===id);const nx=list[k+1];
    if(nx&&!S.progress.best['_open_'+nx.id]&&isUnlocked({...nx,kind:'book'})){S.progress.best['_open_'+nx.id]={y:1};var bookUnlocked=nx.name}}
  S.progress.xp+=correct*10+(kind==='learn'?20:0);
  let unlocked=(typeof bookUnlocked!=='undefined'&&bookUnlocked)||null;const idx=ISLANDS.findIndex(x=>x.id===id);
  if(kind==='quiz'&&pct>=70&&idx>-1&&idx+1===S.progress.unlocked&&idx+1<ISLANDS.length){S.progress.unlocked++;unlocked=ISLANDS[idx+1].name}
  saveState('progress');
  const retry=kind==='learn'||kind==='drill'?null:kind==='read'?'readaloud':kind;
  S.screen={name:'result',id,kind,title,correct,total,missed,unlocked,retry,islandDone,extra};
  if(unlocked||islandDone){sfx.horn();setTimeout(()=>sfx.win(),700)}else if(pct>=70)sfx.win();
  render();scrollTo({top:0});
}

const isLatin=s=>/[A-Za-z]/.test(s)&&!/[֐-׿]/.test(s);
const enSpan=s=>isLatin(s)?`<span class="en">${esc(s)}</span>`:esc(s);
function sentencesOf(text){return String(text).replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z"])/).map(x=>x.trim()).filter(Boolean)}
function readItems(i){
  let out=[];
  if(i.text)i.text.paras.forEach(p=>sentencesOf(p.replace(/^[A-Z][a-z]+( [A-Z][a-z]+)?:\s+/,'').replace(/^(The Classroom|The Teacher|Books and Notebooks)\.\s+/,'')).forEach(s=>out.push(s)));
  (i.dialogues||[]).forEach(d=>d.forEach(l=>out.push(l.replace(/^[A-Za-z]+:\s*/,''))));
  (i.games||[]).forEach(g=>{if(g.kind==='order')g.items.forEach(it=>it.forEach(s=>out.push(s)))});
  (i.words||[]).forEach(w=>{if(w.ex)out.push(w.ex)});
  (i.mistakes||[]).forEach(m=>out.push(m.correct));
  return [...new Set(out)].filter(s=>{const n=s.split(' ').length;return n>=3&&n<=18});
}
const SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
const readSR=()=>!!SRClass;

function buildGame(i,n){
  const g=i.games[n];
  if(['mc','fill','odd','pic'].includes(g.kind)){
    let items;
    if(g.kind==='mc')items=g.items.map(it=>({q:it.q,o:it.o,a:Array.isArray(it.a)?it.a:[it.a],why:it.why,say:it.q}));
    else if(g.kind==='fill')items=shuffle(g.items).map(it=>({q:it.t,gap:true,o:shuffle(it.o),a:null,ans:it.a,say:it.t.replace('___',it.a)}));
    else if(g.kind==='odd')items=shuffle(g.items).map(it=>({q:'איזו מילה לא שייכת?',o:shuffle(it.o),ans:it.a}));
    else{const all=g.items.map(x=>x[1]);items=shuffle(g.items).map(([e,w])=>({pic:e,q:'מה בתמונה?',o:shuffle([w,...shuffle(all.filter(x=>x!==w)).slice(0,3)]),ans:w,say:w}))}
    items.forEach(it=>{if(it.ans!=null)it.a=[it.o.indexOf(it.ans)]});
    return {name:'game',kind:'mc',id:i.id,n,title:g.title,items,idx:0,correct:0,picked:[],answered:false,missed:[]};
  }
  if(g.kind==='tf')return {name:'game',kind:'tf',id:i.id,n,title:g.title,items:g.items,idx:0,correct:0,answered:false,missed:[]};
  if(g.kind==='sort'){const words=[];g.groups.forEach((gr,gi)=>gr.words.forEach(w=>words.push({w,gi})));return {name:'game',kind:'sort',id:i.id,n,title:g.title,groups:g.groups,items:shuffle(words),idx:0,correct:0,answered:false,missed:[]}}
  if(g.kind==='pairs'){const cards=[];shuffle(g.pairs).slice(0,6).forEach((p,pi)=>{cards.push({t:p[0],p:pi});cards.push({t:p[1],p:pi})});return {name:'game',kind:'pairs',id:i.id,n,title:g.title,cards:shuffle(cards).map((c,k)=>({...c,k,open:false,done:false})),first:null,lock:false,mistakes:0,found:0,total:cards.length/2}}
  if(g.kind==='order')return {name:'game',kind:'order',id:i.id,n,title:g.title,items:g.items,idx:0,shuf:shuffle(g.items[0].map((s,k)=>({s,k}))),next:0,err:0,correct:0,missed:[]};
}

let kTimer=null,kRun=0;
function kHighlight(n){document.querySelectorAll('.kara .w.hl').forEach(x=>x.classList.remove('hl'));const el=document.getElementById('kw'+n);if(el){el.classList.add('hl');el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function kPlay(){
  if(!('speechSynthesis' in window)){toast('הטלפון לא תומך בהקראה');return}
  const sc=S.screen;const i=islandById(sc.id);const paras=i.text.paras;
  hush();clearTimeout(kTimer);const run=++kRun;const rate=sc.slow?.6:.85;
  let base=0;const offsets=paras.map(p=>{const o=base;base+=p.split(' ').length;return o});
  const playPara=pi=>{
    if(run!==kRun||pi>=paras.length){kHighlight(-1);return}
    const words=paras[pi].split(' ');const starts=[];let c=0;words.forEach(w=>{starts.push(c);c+=w.length+1});
    const u=new SpeechSynthesisUtterance(paras[pi]);u.lang='en-US';u.rate=rate;if(enVoice)u.voice=enVoice;
    let gotB=false,wk=0;
    u.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;clearTimeout(kTimer);let k=0;while(k+1<starts.length&&starts[k+1]<=e.charIndex)k++;kHighlight(offsets[pi]+k)};
    const step=()=>{if(gotB||run!==kRun)return;if(wk<words.length){kHighlight(offsets[pi]+wk);wk++;kTimer=setTimeout(step,(300+words[wk-1].length*55)/rate)}};
    u.onstart=()=>{kTimer=setTimeout(step,120)};
    u.onend=()=>{clearTimeout(kTimer);setTimeout(()=>playPara(pi+1),250)};
    speechSynthesis.speak(u);
  };
  playPara(0);
}

/* read aloud with speech recognition */
function buildRead2(i){return {name:'read2',id:i.id,items:shuffle(readItems(i)).slice(0,6),idx:0,correct:0,res:null,listening:false,missed:[]}}
const normW=w=>w.toLowerCase().replace(/[^a-z0-9']/g,'').replace(/'/g,'');
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,x)=>[x,...Array(n).fill(0)]);for(let y=1;y<=n;y++)d[0][y]=y;for(let x=1;x<=m;x++)for(let y=1;y<=n;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));return d[m][n]}
const NUMW={'1':'one','2':'two','3':'three','10':'ten','11':'eleven','12':'twelve','14':'fourteen','15':'fifteen','27':'twentyseven'};
function matchWords(target,heard){
  const T=target.split(' ').map(normW).filter(Boolean);const H=heard.split(/\s+/).map(normW).filter(Boolean).map(w=>NUMW[w]||w);
  let p=0;return T.map(t=>{for(let k=p;k<Math.min(H.length,p+4);k++){const h=H[k];if(h===t||(t.length>=4&&lev(h,t)<=1)||(NUMW[t]&&NUMW[t]===h)){p=k+1;return true}}return false});
}
function viewRead2(){
  const sc=S.screen;const i=islandById(sc.id);const s=sc.items[sc.idx];const words=s.split(' ');
  const res=sc.res;const pct=res?Math.round(res.filter(Boolean).length/res.length*100):null;
  return gameHead({...sc,title:'קוראת בקול'},i,sc.items.length,sc.idx)+`
  <p>${readSR()?'<b>1.</b> לוחצים על המיקרופון וקוראים את המשפט בקול. <b>2.</b> מילים בירוק נקראו נכון, מילים באדום כדאי לנסות שוב.':'קראי את המשפט בקול, ואז השווי להקראה.'}</p>
  <div class="read r2">${words.map((w,k)=>`<span class="w ${res?(res[k]?'good':'miss'):''}" data-act="sayw" data-text="${esc(w.replace(/[^A-Za-z'-]/g,''))}">${esc(w)}</span>`).join(' ')}</div>
  <div class="btns">
    <button class="btn ghost small" data-act="say" data-text="${esc(s)}">${I.speaker} הקראה</button>
    <button class="btn ghost small" data-act="saySlow" data-text="${esc(s)}">לאט</button>
    ${readSR()?`<button class="btn ${sc.listening?'red':'brass'}" data-act="srGo">${I.mic2} ${sc.listening?'מקשיב…':res?'לנסות שוב':'אני קוראת'}</button>`:''}
  </div>
  ${sc.heard?`<p class="sub">הטלפון שמע: <span class="en">${esc(sc.heard)}</span></p>`:''}
  ${pct!=null?`<p class="fb ${pct>=80?'ok':'bad'}">${pct>=80?'קריאה מצוינת!':'עוד ניסיון אחד?'} ${pct}% מהמילים</p>`:''}
  ${readSR()?(res?`<div class="btns"><button class="btn brass" data-act="r2Next">${sc.idx===sc.items.length-1?'לתוצאות':'הבא'}</button></div>`:''):
    `<div class="btns"><button class="btn brass" data-act="r2Self" data-v="1">קראתי נכון</button><button class="btn ghost" data-act="r2Self" data-v="0">נעזרתי בהקראה</button></div>`}
  </section>`;
}
let SR=null;
function srGo(){
  const sc=S.screen;if(sc.listening){try{SR&&SR.stop()}catch(e){}return}
  hush();
  try{SR=new SRClass()}catch(e){toast('הזיהוי הקולי לא זמין בטלפון הזה');return}
  SR.lang='en-US';SR.interimResults=false;SR.maxAlternatives=5;SR.continuous=false;
  const target=sc.items[sc.idx];let got=false;
  SR.onresult=e=>{got=true;let best=null,bestN=-1,bestT='';const r=e.results[0];for(let k=0;k<r.length;k++){const m=matchWords(target,r[k].transcript);const n=m.filter(Boolean).length;if(n>bestN){bestN=n;best=m;bestT=r[k].transcript}}
    const prev=sc.res?sc.res.filter(Boolean).length:-1;if(!sc.res||bestN>=prev){sc.res=best;sc.heard=bestT}
    const pct=sc.res.filter(Boolean).length/sc.res.length;pct>=.8?sfx.ok():sfx.bad()};
  SR.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('צריך לאשר גישה למיקרופון');else if(e.error==='no-speech')toast('לא שמעתי. נסי לדבר קרוב יותר לטלפון');};
  SR.onend=()=>{sc.listening=false;if(S.screen===sc)render()};
  try{SR.start();sc.listening=true;sc.heard='';render()}catch(e){toast('לא הצלחתי להפעיל את המיקרופון')}
}

/* ============ CAPTAIN'S REPORT (feedback per island) ============ */
function islandReportHTML(i){
  const b=S.progress.best[i.id]||{};const st=stationsOf(i).filter(s=>s.scored);
  const lvl=v=>v==null?['עוד לא','none']:v>=90?['מצוין','top']:v>=70?['טוב','good']:['לחזור','low'];
  const rows=st.map(s=>{const v=b[s.k];const [t,c]=lvl(v);return `<div class="reprow"><span class="rn">${esc(s.t)}</span><span class="rbar"><i class="${c}" style="width:${v||0}%"></i></span><span class="rl ${c}">${v!=null?v+'%':''} ${t}</span></div>`}).join('');
  const strong=st.filter(s=>(b[s.k]||0)>=90).map(s=>s.t);
  const weak=st.filter(s=>b[s.k]!=null&&b[s.k]<70);
  const todo=st.filter(s=>b[s.k]==null);
  const tips=[];
  if(strong.length)tips.push(`<b>חזקה ב:</b> ${strong.map(esc).join(', ')}.`);
  if(weak.some(s=>s.k==='quiz'))tips.push('במשחק המילים: לעבור שוב על "כרטיסיות מילים" עם ההקראה, ואז לשחק שוב.');
  if(weak.some(s=>s.k==='spell'))tips.push('האיות עוד מבלבל. שווה לשחק שוב ב"בונים מילה", ולהקשיב למילה לפני שבונים.');
  if(weak.some(s=>s.k==='readaloud'||s.k==='readtext'))tips.push('בקריאה בקול כדאי קודם לשמוע את הטקסט ב"קוראים יחד", ואז לקרוא שוב לאט.');
  if(weak.some(s=>/^g\d/.test(s.k)&&['tf','mc'].includes((i.games[+s.k.slice(1)]||{}).kind)))tips.push('בשאלות על הטקסט: לחזור לטקסט ולחפש את המשפט שעונה בדיוק על השאלה.');
  if(weak.some(s=>/^g\d/.test(s.k)&&(i.games[+s.k.slice(1)]||{}).kind==='sort'))tips.push('במיון: שם עצם הוא דבר או אדם, פועל הוא משהו שעושים, ותואר מתאר איך משהו.');
  if(!weak.length&&!todo.length)tips.push('כל התחנות הושלמו. אפשר להפליג לאי הבא!');
  else if(todo.length)tips.push(`נשארו תחנות: ${todo.map(s=>esc(s.t)).join(', ')}.`);
  const words=(b.missed||[]).filter(w=>w.split(' ').length<=3).slice(0,12);
  const hist=b.readHist||[];
  return `<div class="report-box">${rows}</div>
  ${hist.length?`<p class="sub">קריאה בקול לאורך זמן: ${hist.map(h=>`<b>${h.pct}%</b>`).join(' ← ')}</p>`:''}
  ${words.length?`<p class="sub">מילים שהתבלבלה בהן (לחיצה משמיעה):</p><div class="chips">${words.map(w=>`<button class="chip" data-act="say" data-text="${esc(w)}">${esc(w)}</button>`).join('')}</div>`:''}
  <div class="tips">${tips.map(t=>`<p>${t}</p>`).join('')}</div>`;
}

  const m=matchWords(sc.__para,heard);m.forEach((ok,k)=>{const el=document.getElementById(`rw${pi}_${k}`);if(el){el.classList.toggle('good',ok)}});return m;

function rtGo(){
  const sc=S.screen;const i=islandById(sc.id);const pi=sc.pi;const para=i.text.paras[pi];
  hush();sc.__para=para;
  let finals='',t0=0,t1=0,restarts=0,stopReq=false,best=null;
  const start=()=>{
    try{RT=new SRClass()}catch(e){toast('הזיהוי הקולי לא זמין בטלפון הזה');return}
    RT.lang='en-US';RT.continuous=true;RT.interimResults=true;RT.maxAlternatives=1;
    RT.onresult=e=>{
      const now=Date.now();if(!t0)t0=now;t1=now;
      let interim='';for(let k=e.resultIndex;k<e.results.length;k++){const tr=e.results[k][0].transcript;if(e.results[k].isFinal)finals+=' '+tr;else interim+=' '+tr}

    };

    RT.onend=()=>{
      if(!stopReq&&restarts<6&&S.screen===sc){restarts++;start();return}
      sc.listening=false;

const SMALLW=new Set(['a','an','the','is','are','i','to','of','and','in','on','at','it','he','she','we','they','you','my','his','her','for','with','but','so','be','was','do']);
function rtFinish(){
  const sc=S.screen;const i=islandById(sc.id);const paras=i.text.paras;
  let total=0,ok=0,ms=0;const missed=[];
  paras.forEach((p,pi)=>{const words=rtWords(p);const r=sc.res[pi];if(!r)return;total+=words.length;ok+=r.filter(Boolean).length;ms+=sc.ms[pi]||0;
    r.forEach((g,k)=>{const w=words[k].replace(/[^A-Za-z'-]/g,'');if(!g&&w.length>=3&&!SMALLW.has(w.toLowerCase()))missed.push(w)})});
  if(!total){toast('עוד לא קראת אף פסקה');return}
  const wpm=ms>3000?Math.round(ok/(ms/60000)):null;
  const prev=((S.progress.best[i.id]||{}).readHist||[]).slice(-1)[0]||null;
  const pct=Math.round(ok/total*100);
  S.session.readOk+=ok>=total*.8?1:0;
  finishActivity('readtext',`קריאת אנסין: ${i.text.title}${wpm?` · ${wpm} מילים לדקה`:''}`,ok,total,[...new Set(missed)],{wpm,prev,pct,read:sc.res.filter(Boolean).length,paras:paras.length});
}

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1800;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.85));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}
async function addShots(files){

    const blob=await compress(f);
    S.shots.push({id:uid('p'),blob,url:URL.createObjectURL(blob),status:'new'});

  sfx.shutter();render();
}

function sessSummary(s){const acts=s.activities||[];const q=acts.filter(a=>a.total&&a.kind!=='read');const c=q.reduce((n,a)=>n+a.correct,0),t=q.reduce((n,a)=>n+a.total,0);return {acts,pct:t?Math.round(c/t*100):null}}
function buildReport(){
  const s=S.session;const {acts,pct}=sessSummary(s);
  const lines=[`דוח יומי · מסע האנגלית · ${fmtDate(s.date)}`,`זמן תרגול: ${s.minutes} מתוך ${GOAL_MIN} דקות`];
  if(pct!=null)lines.push(`הצלחה בתרגילים: ${pct}%`);
  if(s.readOk+s.readHelp)lines.push(`קריאה בקול: ${s.readOk} משפטים לבד, ${s.readHelp} עם עזרה`);
  if(acts.length){lines.push('','מה נעשה:');acts.forEach(a=>lines.push(`• ${a.islandName} · ${a.title}${a.total&&a.kind!=='read'?` · ${a.correct}/${a.total}`:''}`))}
  else lines.push('','עוד לא תרגלו היום.');
  if(s.missed.length)lines.push('',`מילים לחזרה: ${s.missed.slice(-12).join(', ')}`);
  return lines.join('\n');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;const sc=S.screen;
  if(a!=='answer')sfx.tap();
  switch(a){
    case 'sound':S.sound=!S.sound;LS.set('sound',S.sound);render();break;
    case 'relinkCancel':S.relink=false;render();break;
    /* book games */
    case 'gAns':{if(sc.answered)break;const q=sc.items[sc.idx];const k=+el.dataset.k;
      if(q.a.length>1){if(sc.picked.includes(k)){sc.picked=sc.picked.filter(x=>x!==k);render();break}sc.picked.push(k);if(sc.picked.length<q.a.length){render();break}}
      else sc.picked=[k];
      sc.answered=true;sc.wasOk=q.a.every(x=>sc.picked.includes(x));
      if(sc.wasOk){sc.correct++;sfx.ok();if(q.gap&&q.say)setTimeout(()=>say(q.say),350)}else{sfx.bad();sc.missed.push(q.ans||q.o[q.a[0]])}
      render();break;}
    case 'tfAns':{if(sc.answered)break;const q=sc.items[sc.idx];sc.pick=el.dataset.v==='1';sc.answered=true;sc.wasOk=sc.pick===q.t;
      if(sc.wasOk){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(q.s)}
      render();if(q.fix)setTimeout(()=>say(q.fix),400);break;}
    case 'sortAns':{if(sc.answered)break;const q=sc.items[sc.idx];sc.pick=+el.dataset.g;sc.answered=true;sc.wasOk=sc.pick===q.gi;
      if(sc.wasOk){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(q.w)}render();break;}
    case 'gNext':{sc.answered=false;sc.picked=[];sc.pick=null;
      const total=sc.items.length;if(sc.idx<total-1){sc.idx++;render()}else gameDone(sc,sc.correct,total,sc.missed);break;}
    case 'memo':{if(sc.lock)break;const c=sc.cards[+el.dataset.k];if(c.open||c.done)break;c.open=true;sfx.flip();say(c.t);
      if(sc.first==null){sc.first=c.k;render();break}
      const f=sc.cards[sc.first];sc.first=null;
      if(f.p===c.p){f.done=c.done=true;sc.found++;setTimeout(()=>sfx.ok(),250);render();
        if(sc.found===sc.total)setTimeout(()=>gameDone(sc,sc.total,sc.total+sc.mistakes,[]),900)}
      else{sc.mistakes++;sc.lock=true;render();setTimeout(()=>{f.open=c.open=false;sc.lock=false;if(S.screen===sc)render()},1000)}
      break;}
    case 'ordTap':{const k=+el.dataset.k;if(k===sc.next){sc.next++;sfx.ok();sc.flash=null}else{sc.err++;sfx.bad();sc.flash=k;setTimeout(()=>{if(S.screen===sc){sc.flash=null;render()}},600)}
      if(sc.next>=sc.shuf.length&&!sc.err)sc.correct++;
      render();break;}
    case 'ordNext':{if(sc.err)sc.missed.push(sc.items[sc.idx][0]);
      if(sc.idx<sc.items.length-1){sc.idx++;sc.shuf=shuffle(sc.items[sc.idx].map((s,k)=>({s,k})));sc.next=0;sc.err=0;render()}
      else gameDone(sc,sc.correct,sc.items.length,sc.missed);break;}
    case 'spTile':{const t=sc.tiles[+el.dataset.k];if(t.used)break;t.used=true;sc.built.push(t);sfx.tap();
      const w=sc.items[sc.idx];if(sc.built.length===w.en.length){sc.checked=true;sc.ok=sc.built.map(x=>x.ch).join('')===w.en.toLowerCase();
        if(sc.ok){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(w.en)}say(w.en)}
      render();break;}
    case 'spBack':{const t=sc.built.pop();if(t)t.used=false;render();break;}
    case 'spNext':{if(sc.idx<sc.items.length-1){sc.idx++;Object.assign(sc,spellState(sc.items[sc.idx]));render();say(sc.items[sc.idx].en)}else finishActivity('spell','בונים מילה',sc.correct,sc.items.length,sc.missed);break;}
    case 'kPlay':kPlay();break;
    case 'kSpeed':sc.slow=!sc.slow;kRun++;hush();render();break;
    case 'kStop':kRun++;clearTimeout(kTimer);hush();kHighlight(-1);break;
    case 'kDone':{kRun++;hush();const i=islandById(sc.id);finishActivity('story','קוראים יחד: '+i.text.title,1,1,[]);break;}
    case 'srGo':srGo();break;
    case 'calDay':S.calDay=+el.dataset.k;S.editLesson=null;render();break;
    case 'lsEdit':if(isParent()){S.editLesson=+el.dataset.k;render()}break;
    case 'lsCancel':S.editLesson=null;render();break;
    case 'exDel':{if(!isParent())break;const c=editableSchedule();c.exams=c.exams.filter(e=>e.id!==el.dataset.id);saveSchedule();toast('המבחן נמחק');break;}
    case 'rtGo':rtGo();break;
    case 'rtStop':sc.stop&&sc.stop();break;
    case 'rtNext':{const i=islandById(sc.id);if(sc.pi<i.text.paras.length-1){sc.pi++;render();const el=document.getElementById('rtp'+sc.pi);el&&el.scrollIntoView({block:'center',behavior:'smooth'})}else rtFinish();break;}
    case 'drill':{const r=sc;const words=[...new Set(r.missed||[])].slice(0,10);if(!words.length)break;S.screen={name:'read2',id:r.id,items:words,idx:0,correct:0,res:null,listening:false,missed:[],drill:true};render();scrollTo({top:0});break;}
    case 'r2Next':case 'r2Self':{
      let ok;if(a==='r2Self')ok=el.dataset.v==='1';else{const r=sc.res||[];ok=r.length&&r.filter(Boolean).length/r.length>=.8}
      if(ok){sc.correct++;S.session.readOk++}else{S.session.readHelp++;sc.missed.push(sc.items[sc.idx].split(' ').slice(0,4).join(' ')+'…')}
      if(sc.idx<sc.items.length-1){sc.idx++;sc.res=null;sc.heard='';render()}else finishActivity(sc.drill?'drill':'readaloud',sc.drill?'תרגול מילים קשות':'קוראת בקול',sc.correct,sc.items.length,[]);break;}
    case 'tab':S.tab=el.dataset.tab;if(S.tab==='map'&&!['map','island'].includes(S.screen.name))S.screen={name:'map'};hush();render();scrollTo({top:0});break;
    case 'home':S.screen={name:'map'};S.tab='map';hush();render();break;
    case 'locked':sfx.bad();toast('האי עדיין נעול. 70% במשחק המילים של האי הקודם יפתחו אותו');break;
    case 'island':S.tab='map';S.screen={name:'island',id:el.dataset.id};hush();render();scrollTo({top:0});break;
    case 'station':{
      const id=el.dataset.id,k=el.dataset.k,i=islandById(id);if(!i)break;
      kRun++;clearTimeout(kTimer);
      if(k==='story'){S.screen={name:'karaoke',id,slow:false}}
      else if(k==='spell'){const sp=buildSpell(i);S.screen=sp;setTimeout(()=>{if(S.screen===sp)say(sp.items[0].en)},350)}
      else if(/^g\d+$/.test(k)){S.screen=buildGame(i,+k.slice(1))}
      else if(k==='readtext'){S.screen={name:'readtext',id,pi:0,res:[],heard:[],ms:[],listening:false}}
      else if(k==='readaloud'){const r=buildRead2(i);if(!r.items.length){toast('אין משפטים באי הזה');break}S.screen=r}
      else if(k==='learn'){S.screen={name:'learn',id,idx:0};say(i.words[0].en)}
      else if(k==='quiz'){S.screen={name:'quiz',id,idx:0,qs:buildVocabQuiz(i),correct:0,missed:[]}}
      else if(k==='sounds'){S.screen={name:'sounds',id,idx:0,qs:buildSoundQuiz(),correct:0,missed:[]}}
      else if(k==='fix'){S.screen={name:'fix',id,idx:0,qs:buildFixQuiz(i),correct:0,missed:[]}}
      else if(k==='readaloud'){const items=shuffle([...i.words.filter(w=>w.ex).map(w=>w.ex),...(i.mistakes||[]).map(m=>m.correct)]).slice(0,5);if(!items.length){toast('אין משפטים באי הזה');break}S.screen={name:'readaloud',id,idx:0,items,ok:0,help:0}}
      else if(k==='unseen'){S.screen={name:'unseen',id,answers:[],checked:false}}
      render();scrollTo({top:0});
      const q=S.screen.qs&&S.screen.qs[0];if(q&&q.autoSay)setTimeout(()=>say(q.say),350);
      break;}
    case 'say':say(el.dataset.text);break;
    case 'saySlow':say(el.dataset.text,.6);break;
    case 'stopSay':hush();break;
    case 'sayw':{const t=el.dataset.text;if(t){document.querySelectorAll('.w.hl').forEach(x=>x.classList.remove('hl'));el.classList.add('hl');say(t,.75)}break;}
    case 'learnNext':{const i=islandById(sc.id);sfx.flip();if(sc.idx<i.words.length-1){sc.idx++;render();say(i.words[sc.idx].en)}else finishActivity('learn','כרטיסיות מילים',i.words.length,i.words.length,[]);break;}
    case 'learnPrev':if(sc.idx>0){sc.idx--;sfx.flip();render();say(islandById(sc.id).words[sc.idx].en)}break;
    case 'answer':{if(sc.answered)break;const q=sc.qs[sc.idx];sc.picked=q.opts[+el.dataset.k];sc.answered=true;
      if(sc.picked===q.ans){sc.correct++;sfx.ok()}else{sc.missed.push(q.word);sfx.bad()}
      render();if((q.t==='gap'||q.t==='fix')&&sc.picked===q.ans)setTimeout(()=>say(q.say),400);break;}
    case 'nextQ':{sc.answered=false;sc.picked=null;
      if(sc.idx<sc.qs.length-1){sc.idx++;render();const q=sc.qs[sc.idx];if(q.autoSay)setTimeout(()=>say(q.say),300)}
      else{const kind=sc.name==='quiz'?'quiz':sc.name;finishActivity(kind,{quiz:'משחק מילים',sounds:'מה שמעת?',fix:'מתקנים טעויות'}[kind],sc.correct,sc.qs.length,sc.missed)}break;}
    case 'readMark':{if(el.dataset.v==='ok'){sc.ok++;S.session.readOk++;sfx.ok()}else{sc.help++;S.session.readHelp++}
      if(sc.idx<sc.items.length-1){sc.idx++;render()}else finishActivity('read','קריאה בקול',sc.ok,sc.items.length,[]);break;}
    case 'uAns':sc.answers[+el.dataset.q]=+el.dataset.o;render();break;
    case 'uCheck':{const st=islandById(sc.id).story;if(sc.answers.filter(x=>x!=null).length<st.qs.length){toast('יש לענות על כל השאלות');break}
      sc.checked=true;const c=st.qs.filter((q,k)=>sc.answers[k]===q.a).length;sc.correct=c;c===st.qs.length?sfx.ok():sfx.bad();render();break;}
    case 'uDone':{const st=islandById(sc.id).story;finishActivity('unseen','אנסין: '+st.title,sc.correct,st.qs.length,[]);break;}
    case 'copyRep':{const txt=buildReport();const sel=()=>{const r=$('#rep');const g=getSelection();const rg=document.createRange();rg.selectNodeContents(r);g.removeAllRanges();g.addRange(rg);toast('הטקסט מסומן, אפשר להעתיק')};
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('הדוח הועתק')).catch(sel);else sel();break;}
    case 'delWord':{const id=el.dataset.id;S.classWords=S.classWords.filter(w=>w.id!==id);saveState('classwords');render();break;}
    case 'delZoom':{const id=el.dataset.id;S.zoom=S.zoom.filter(z=>z.id!==id);saveState('zoom');render();break;}
    case 'recStart':startRecording(el.dataset.id);break;
    case 'recStop':stopRecording(false);break;
    case 'delShot':{const s=S.shots.find(x=>x.id===el.dataset.id);if(s)URL.revokeObjectURL(s.url);S.shots=S.shots.filter(x=>x.id!==el.dataset.id);render();break;}
    case 'reqProcess':{el.disabled=true;apiPost({action:'requestProcess',note:''}).then(()=>{sfx.ok();toast('הבקשה נשלחה לאבא במייל')}).catch(err=>{toast(err.message||'לא הצלחתי לשלוח, נסי שוב');el.disabled=false});break;}
  }
});

  }
  if(f.dataset.form==='lesson'){
    const k=+f.dataset.k;const c=editableSchedule();const di=S.calDay!=null?S.calDay:(new Date().getDay()<=4?new Date().getDay():0);
    while(c.days.length<=di)c.days.push({d:DAY_NAMES[c.days.length],l:[]});
    const subj=$('#lsS').value.trim();c.days[di].l[k]=subj?{s:subj,t:$('#lsT').value.trim(),r:$('#lsR').value.trim()}:null;
    S.editLesson=null;saveSchedule();toast('השיעור עודכן');return;
  }
  if(f.dataset.form==='word'){
    const en=$('#wEn').value.trim(),he=$('#wHe').value.trim(),ex=$('#wEx').value.trim();if(!en||!he)return;
    S.classWords.push({id:uid('w'),en,he,ex,added:Date.now()});saveState('classwords');sfx.ok();toast('המילה נוספה');render();
  }else if(f.dataset.form==='zoom'){
    const z={id:uid('z'),date:$('#zDate').value,time:$('#zTime').value,teacher:$('#zTeacher').value.trim(),link:$('#zLink').value.trim(),done:false,notes:'',recs:[]};
    if(!z.date)return;S.zoom.push(z);saveState('zoom');sfx.ok();toast('השיעור נשמר');render();
  }else if(f.dataset.form==='znotes'){
    const z=S.zoom.find(x=>x.id===f.dataset.id);if(!z)return;z.notes=(f.querySelector('input').value||'').trim();if(!z.notes)return;saveState('zoom');toast('נשמר');render();
  }else if(f.dataset.form==='shots'){
    const note=($('#shotNote')?.value||'').trim();
    S.shots.filter(s=>s.status==='new').forEach(s=>{s.status='wait';queueUpload({id:s.id,kind:'photo',blob:s.blob,meta:{note}})});
    sfx.ok();toast('הצילומים נשלחים לדרייב');render();
  }
});

/* ============ START ============ */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
loadAll();
</script>
</body>
</html>
