<style>
/* Layout: one-column phone app — a sea chart map of islands as levels, chart-paper cards for exercises, rope-and-brass details. Single committed dark-sea look. */
:root{
  color-scheme: dark;
  --abyss:#0a1a29; --sea:#10304a; --sea2:#174260; --swell:#22587c;
  --chart:#eef2ea; --chart2:#dfe7dc; --ink:#0f2233; --ink2:#41586b;
  --brass:#d6a64a; --brass2:#f0cf86; --signal:#e2553b; --kelp:#2f8a63; --kelp2:#d7efe2; --redsoft:#f8ddd6;
  --foam:#d9e7ee; --muted:#86a2b6;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-en:"Alegreya",Georgia,"Times New Roman",serif;
  --r:14px;
}
:root[data-theme="tennis"]{
  --abyss:#0b2147; --sea:#1d56a8; --sea2:#2766c0; --swell:#3d7fd8;
  --chart:#f6f8f1; --chart2:#e6eddc; --ink:#13213a; --ink2:#44546c;
  --brass:#cfe83a; --brass2:#ecf98f; --signal:#e0663a; --kelp:#2f9e5b; --kelp2:#dcf2e3; --redsoft:#fbe0d4;
  --foam:#e4ecf7; --muted:#9db3d1;
}
:root[data-theme="desert"]{
  --abyss:#3a2414; --sea:#8a5a2b; --sea2:#a86d36; --swell:#c28a4a;
  --chart:#fbf3e4; --chart2:#f1e2c6; --ink:#3a2414; --ink2:#6e4e2f;
  --brass:#f2a93b; --brass2:#ffd78a; --signal:#d8572a; --kelp:#2f8a63; --kelp2:#dcefe0; --redsoft:#f8dccd;
  --foam:#fff3dd; --muted:#e0c49a;
}
:root[data-theme="desert"] body{background-image:linear-gradient(180deg,#f0b35a 0%,#a86d36 35%,#3a2414 80%)}
:root[data-lang="ar"] .en{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;direction:rtl;unicode-bidi:isolate}
:root[data-lang="ar"] .read,:root[data-lang="ar"] .opt.en,:root[data-lang="ar"] .qblock .q{direction:rtl;text-align:right}
:root[data-lang="ar"] .flash .word{font-size:64px}
.tr{color:var(--ink2);font-size:18px;margin-top:-4px}
.worldsw .refbtn{background:var(--chart);color:var(--ink);border-color:var(--chart)}
.refgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.refcell{border:0;background:var(--chart2);border-radius:10px;padding:6px 2px;display:grid;justify-items:center;gap:0;font:inherit;color:var(--ink)}
.refcell .ar{font-family:"Noto Naskh Arabic",serif;font-size:34px;line-height:1.2}
.refcell .he{font-weight:800;font-size:18px}.refcell small{color:var(--ink2);font-size:11px}
.refcell .forms{font-family:"Noto Naskh Arabic",serif;font-size:15px;direction:rtl;color:var(--ink2)}
.reftabs{display:flex;gap:6px;justify-content:center}.reftabs button{font:inherit;font-weight:800;border-radius:999px;border:1px solid var(--swell);padding:6px 14px;background:transparent;color:var(--ink)}.reftabs button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass)}
.numrow{display:grid;grid-template-columns:52px 40px 1fr 1fr;align-items:center;gap:8px;border:0;background:var(--chart2);border-radius:10px;padding:6px 10px;font:inherit;color:var(--ink);width:100%;text-align:start}
.numrow .ar{font-family:"Noto Naskh Arabic",serif;font-size:28px}
:root[data-theme="tennis"] body{background-image:linear-gradient(180deg,#1d56a8 0%,#0b2147 75%)}
*{box-sizing:border-box}
html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--abyss);color:var(--foam);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% 0%, var(--sea) 0%, var(--abyss) 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--abyss)}
[hidden]{display:none!important}
img{max-width:100%}
#app{max-width:560px;margin:0 auto;padding-block:12px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--brass2);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:12px}
.brand h1{font-size:22px;color:var(--chart)}
.brand small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.4px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok{background:#4fd18f}.sync.wait{background:var(--brass2)}.sync.off{background:var(--signal)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--swell);background:var(--sea);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="false"]{opacity:.55}

.voyage{background:var(--sea);border:1px solid var(--swell);border-radius:var(--r);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.voyage .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.voyage .lbl{font-family:var(--f-display);font-size:16px;color:var(--chart)}
.voyage .num{font-variant-numeric:tabular-nums;color:var(--brass2);font-weight:700}
.track{position:relative;height:30px}
.track .line{position:absolute;inset:14px 0 auto;height:0;border-top:2px dashed var(--swell)}
.track .done{position:absolute;top:13px;right:0;height:4px;background:var(--brass);border-radius:2px;transition:width .6s}
.track .ship{position:absolute;top:0;width:30px;height:30px;transform:translateX(50%);transition:right .6s}
.track .port{position:absolute;left:-4px;top:6px;width:18px;height:18px}
.streak{font-size:13px;color:var(--muted)}

.map{background:var(--sea);border-radius:var(--r);overflow:hidden;border:1px solid var(--swell)}
.map svg{display:block;width:100%;height:auto}
.isl{cursor:pointer}
.isl .glow{animation:glow 1.6s ease-in-out infinite;transform-origin:0 4px}
@keyframes glow{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
.isl .spark{animation:twinkle 1.4s ease-in-out infinite}
.isl .spark.b{animation-delay:.45s}.isl .spark.c{animation-delay:.9s}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.fleetcard{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--swell);background:linear-gradient(135deg,var(--sea),var(--abyss));color:var(--foam);border-radius:var(--r);padding:8px 12px;font:inherit;text-align:start}
.fleetcard .ft{display:grid;gap:2px;flex:1}.fleetcard .ft b{color:var(--brass2);font-size:17px}.fleetcard small{color:var(--muted);font-weight:600}
.fdots{display:flex;gap:5px;margin-top:2px}.fdots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--brass);display:block}.fdots i.on{background:var(--brass)}
.flv{font-weight:800;color:var(--brass);font-size:14px}
.boatbox{text-align:center;max-height:86vh;overflow:auto}.boatbox p{color:var(--ink);text-align:start}
.bpop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;display:flex;justify-content:center}.bpop svg{max-width:100%}
.confetti{font-size:34px;animation:pop .5s ease-out}
.bm{align-items:center;padding-bottom:16px}
.fleetgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fitem{display:grid;justify-items:center;gap:0;background:var(--chart2);border-radius:10px;padding:4px 2px;font-size:11px;color:var(--ink)}
.fitem svg{width:100%;height:auto}.fitem small{color:var(--ink2)}
.fitem.lock svg{filter:grayscale(1) brightness(.35);opacity:.6}.fitem.cur{outline:3px solid var(--brass);background:#fff6dc}
.newbanner{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:start;background:linear-gradient(135deg,#f0c35e,#e2553b);color:#1a1206;border-radius:var(--r);padding:12px 14px;font:inherit;font-weight:700;box-shadow:0 10px 24px -14px #000;animation:pop .4s ease-out}
.newbanner .gift{font-size:32px;animation:bobg 1.2s ease-in-out infinite}
@keyframes bobg{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
.newbanner small{display:block;font-weight:600;opacity:.85}
.newbanner.late{background:linear-gradient(135deg,#9fd3ff,#5f9be0);color:#0b1c2b}
.newbanner .go{margin-inline-start:auto;background:#1a1206;color:#f0c35e;border-radius:999px;padding:8px 14px;white-space:nowrap}
.zbadge{display:inline-flex;align-items:center;gap:6px;background:#dcebff;color:#1d4f8a;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.zstat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.isl:focus{outline:none}
.isl:focus-visible .ring{stroke:var(--brass2);stroke-width:3}
.maphint{font-size:13px;color:var(--muted);text-align:center;margin:0}

.card{background:var(--chart);color:var(--ink);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px -18px #000}
.card h2{font-size:22px;color:var(--ink)}
.card p{margin:0}
.sub{color:var(--ink2);font-size:14px}
.back{align-self:flex-start;position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:4;background:var(--abyss);border:1px solid var(--swell);color:var(--foam);display:flex;align-items:center;gap:6px;padding:8px 14px 8px 16px;min-height:44px;border-radius:999px;font-weight:700;box-shadow:0 6px 16px -10px #000}
.back svg{width:18px;height:18px}
.cfwrap{position:fixed;inset:0;z-index:30;background:rgba(6,18,30,.62);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px))}
.cfbox{background:var(--chart);color:var(--ink);border-radius:18px;padding:18px;max-width:420px;width:100%;display:grid;gap:12px;box-shadow:0 20px 40px -16px #000}
.cfbox h3{margin:0;font-size:20px}.cfbox p{margin:0;color:var(--ink2)}
.hearrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hearrow .lbl{font-size:14px;color:var(--ink2);font-weight:700}
.the{color:var(--ink2);font-size:15px;margin-top:2px}
.misslist{display:grid;gap:8px}
.back svg{width:18px;height:18px}
.ihead{display:flex;flex-direction:column;gap:4px}
.ihead .eyebrow{font-size:12px;letter-spacing:1.2px;color:var(--brass2);text-transform:uppercase}
.ihead h2{font-size:28px;color:var(--chart)}
.ihead p{color:var(--muted);margin:0}

.stations{display:grid;gap:10px}
.station{display:flex;align-items:center;gap:14px;text-align:start;background:var(--chart);color:var(--ink);border:0;border-radius:var(--r);padding:14px 16px}
.station .ic{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sea);color:var(--brass2)}
.station .ic svg{width:24px;height:24px}
.station .tx{flex:1;min-width:0}
.station b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.station span{font-size:14px;color:var(--ink2)}
.station .mark{font-size:13px;font-weight:700;color:var(--kelp);white-space:nowrap}

.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:16px;background:var(--sea);color:var(--chart);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.red{background:var(--signal);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink2)}
.btn.small{padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

.flash{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:10px 0}
.flash .word{font-family:var(--f-en);font-size:54px;font-weight:700;color:var(--ink);line-height:1.1;overflow-wrap:anywhere}
.flash .he{font-size:22px;font-weight:700;color:var(--sea2)}
.flash .ex{font-family:var(--f-en);font-size:24px;color:var(--ink2);direction:ltr}
.speak{width:56px;height:56px;border-radius:50%;border:0;background:var(--sea);color:var(--brass2);display:grid;place-items:center}
.speak svg{width:26px;height:26px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--chart2)}
.dots i.on{background:var(--brass)}

.qtop{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--chart2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .4s}
.prompt{font-size:20px;font-weight:700;line-height:1.35}
.prompt>.en:only-child{font-size:26px}
.prompt .en{font-size:34px}
.gap{font-family:var(--f-en);font-size:27px;direction:ltr;text-align:left;line-height:1.5;background:var(--chart2);padding:12px 14px;border-radius:10px}
.gap u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 22px}
.opts{display:grid;gap:10px}
.opt{border:1.5px solid var(--chart2);background:#fff;color:var(--ink);border-radius:12px;padding:13px 16px;font-size:18px;text-align:start;font-weight:600}
.opt.en{font-family:var(--f-en);text-align:left;font-size:26px}
.opt.ok{background:var(--kelp2);border-color:var(--kelp)}
.opt.bad{background:var(--redsoft);border-color:var(--signal)}
.opt[disabled]{cursor:default}
.fb{font-weight:700;min-height:24px}
.fb.ok{color:var(--kelp)} .fb.bad{color:var(--signal)}

.read{font-family:var(--f-en);direction:ltr;text-align:left;font-size:26px;line-height:1.7}
.read .w{cursor:pointer;border-radius:4px;padding:0 1px}
.read .w:hover,.read .w.hl{background:var(--brass2)}
.story{font-size:24px;line-height:1.75}
.tip{font-size:13px;color:var(--ink2)}
.qblock{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px dashed var(--chart2)}
.qblock .q{font-family:var(--f-en);direction:ltr;text-align:left;font-weight:700;font-size:22px}

.result{align-items:center;text-align:center}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:42px;height:42px}
.big{font-family:var(--f-display);font-size:40px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--f-en);background:var(--redsoft);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:19px;direction:ltr}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:13px;color:var(--ink2)}
.log{display:flex;flex-direction:column}
.logrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--chart2)}
.logrow:last-child{border-bottom:0}
.logrow .d{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sea2);min-width:58px}
.logrow .m{min-width:0;font-size:14px;color:var(--ink2)}
.logrow .s{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.syncbtn{font:inherit;font-size:13px;font-weight:800;border:0;background:#e2553b;color:#fff;border-radius:999px;padding:2px 10px}
.kidsw{display:flex;gap:4px;margin:2px 0}.kidsw button{font:inherit;font-size:13px;font-weight:800;border:1px solid var(--swell);background:transparent;color:var(--foam);border-radius:999px;padding:2px 12px}.kidsw button[aria-pressed="true"]{background:var(--brass);color:#1a1206;border-color:var(--brass)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chart2);color:var(--ink)}
.pill.ok{background:var(--kelp2);color:var(--kelp)} .pill.warn{background:var(--redsoft);color:#a53a24}
form.f{display:grid;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink2)}
.f input,.f textarea{font:inherit;font-size:16px;border:1.5px solid var(--chart2);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);min-width:0;width:100%}
.f .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.wtag{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 6px 4px 12px;font-size:15px}
.wtag .en{font-size:19px}
.wtag .en{font-weight:700}
.wtag button{border:0;background:var(--chart2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;color:var(--ink)}
.empty{font-size:14px;color:var(--ink2);background:var(--chart2);border-radius:10px;padding:12px}
.zitem{background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.zitem .zt{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.zitem a{color:var(--sea2);font-weight:700}
.report{white-space:pre-wrap;font-size:14px;background:#fff;border-radius:10px;padding:12px;color:var(--ink);max-height:240px;overflow:auto}

/* recorder */
.recpanel{background:var(--ink);color:var(--chart);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.recdot{width:96px;height:96px;border-radius:50%;background:var(--signal);display:grid;place-items:center;box-shadow:0 0 0 0 rgba(226,85,59,.6);animation:pulse 1.6s infinite}
.recdot svg{width:40px;height:40px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,85,59,.55)}70%{box-shadow:0 0 0 22px rgba(226,85,59,0)}100%{box-shadow:0 0 0 0 rgba(226,85,59,0)}}
.rectime{font-family:var(--f-display);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.level{width:100%;max-width:280px;height:10px;border-radius:5px;background:#24384a;overflow:hidden}
.level i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd18f,#f0cf86,#e2553b);transition:width .1s}
.recmeta{font-size:14px;color:var(--muted)}
.recfloat{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--signal);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px -10px #000}
.recfloat i{width:10px;height:10px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

/* camera */
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shoot label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 10px;border-radius:var(--r);background:var(--sea);color:var(--chart);font-weight:700;cursor:pointer;text-align:center}
.shoot label.main{background:var(--brass);color:var(--ink)}
.shoot svg{width:34px;height:34px}
.shoot input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shoot label.wide{grid-column:1/-1;flex-direction:row;padding:14px 10px;background:var(--swell)}
.shoot label.wide span{font-size:26px}
.thumb .doc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff;color:var(--ink);font-size:11px;padding:6px;text-align:center;word-break:break-all;overflow:hidden}
.thumb .doc b{font-size:28px}
textarea.paste{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--swell);padding:10px;font:inherit}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--chart2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;inset:auto 4px 4px auto;font-size:11px;font-weight:800;padding:2px 6px;border-radius:999px;background:#fff;color:var(--ink)}
.thumb span.ok{background:var(--kelp2);color:var(--kelp)}
.thumb span.err{background:var(--redsoft);color:#a53a24}
.thumb button{position:absolute;inset:4px auto auto 4px;border:0;width:26px;height:26px;border-radius:50%;background:rgba(15,34,51,.75);color:#fff;display:grid;place-items:center}

/* book games */
.pic{font-size:72px;text-align:center;line-height:1.2;padding:6px 0}
.opt.sel{background:var(--chart2);border-color:var(--sea2)}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfb{text-align:center;font-family:var(--f-body);font-size:17px}
.fixbox{background:var(--kelp2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.fixbox .en{font-size:25px;direction:ltr;text-align:left;align-self:stretch}
.cargo{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--sea);color:var(--chart);border-radius:14px;padding:18px;font-size:36px;font-weight:700}
.speak.sm{width:42px;height:42px}.speak.sm svg{width:20px;height:20px}
.boats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.boatbtn{border:2px solid var(--chart2);background:#fff;color:var(--ink);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.boatbtn svg{width:30px;height:30px;color:var(--sea2)}
.boatbtn b{font-size:19px;overflow-wrap:anywhere}.boatbtn span{font-size:12px;color:var(--ink2)}
.boatbtn.ok{background:var(--kelp2);border-color:var(--kelp)}.boatbtn.bad{background:var(--redsoft);border-color:var(--signal)}
.memo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:4/3;max-width:100%;border:0;border-radius:12px;background:var(--sea);color:var(--brass2);display:grid;place-items:center;font-size:22px;font-weight:700;padding:4px;transition:transform .2s}
.mcard .back-face{font-size:26px;opacity:.8}
.mcard.open{background:#fff;color:var(--ink);border:2px solid var(--chart2);transform:rotateY(0)}
.mcard.done{background:var(--kelp2);border-color:var(--kelp)}
.mcard .en{overflow-wrap:anywhere}
.olist{display:grid;gap:8px}
.ordr{display:flex;gap:10px;align-items:flex-start;font-size:22px}
.ordr .num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--chart2);display:grid;place-items:center;font-family:var(--f-body);font-size:14px}
.ordr.ok .num{background:var(--kelp);color:#fff}
.spellq{display:flex;align-items:center;justify-content:center;gap:14px;font-size:24px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr}
.slot{width:40px;height:50px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-size:28px;font-weight:700;text-transform:lowercase}
.slot.ok{color:var(--kelp);border-color:var(--kelp)}.slot.bad{color:var(--signal);border-color:var(--signal)}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tile{width:46px;height:50px;border:0;border-radius:10px;background:var(--brass);color:var(--ink);font-size:26px;font-weight:700;box-shadow:0 3px 0 #a87d27}
.tile[disabled]{opacity:.25;box-shadow:none}
.kara .w.hl{background:var(--brass2);box-shadow:0 0 0 2px var(--brass2)}
.kp{margin:0 0 12px}
.gloss{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.gloss .sub{width:100%;margin:0}
.r2 .w.good{background:var(--kelp2);color:var(--kelp)}.r2 .w.miss{background:var(--redsoft);color:#a53a24}
.exam{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--chart);background:var(--sea2);border-radius:10px;padding:6px 10px}
.exam b{color:var(--brass2);font-variant-numeric:tabular-nums}
/* captain's report & full reading */
.conquer{text-align:center;align-items:center;background:linear-gradient(180deg,var(--brass2),var(--chart) 55%)}
.conquer h2{font-size:28px}.flagrow{font-size:34px;letter-spacing:6px}
.report-box{display:grid;gap:8px;width:100%;text-align:start}
.reprow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.rn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar{height:8px;background:var(--chart2);border-radius:4px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:4px}
.rbar i.top{background:var(--kelp)}.rbar i.good{background:var(--brass)}.rbar i.low{background:var(--signal)}
.rl{font-size:12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.rl.top{color:var(--kelp)}.rl.good{color:#9a6f14}.rl.low{color:var(--signal)}.rl.none{color:var(--ink2)}
.tips{display:grid;gap:6px;width:100%;text-align:start;background:#fff;border-radius:12px;padding:10px 12px;font-size:15px}
.tips p{margin:0}
button.chip{border:0;cursor:pointer}
.rt .w.fixed{color:#1b6fa3;background:#dcebf7}
.rt .w.focus{outline:3px solid var(--brass);outline-offset:1px}
.rt .w.hl{background:var(--brass2)}
.teacher{display:grid;gap:10px;background:var(--chart);padding:10px 0}
.tbub{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:12px;border:2px solid var(--brass)}
.tbub p{margin:0}.tav{font-size:34px;line-height:1}
.tw{display:block;font-size:42px;direction:ltr;text-align:left;margin:4px 0}
.tmsg{color:var(--signal);font-weight:700}
.rtp{margin:0 0 12px;padding:6px 8px;border-radius:10px;transition:background .3s}
.rtp.cur{background:#fff;box-shadow:0 0 0 2px var(--brass)}
.rtp.next{opacity:.45}
.rt .w.good{color:var(--kelp);background:var(--kelp2)}.rt .w.miss{color:#a53a24;background:var(--redsoft)}
.rtctl{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--chart);padding:8px 0}
.rfb{display:grid;gap:6px;text-align:start;width:100%;background:#fff;border-radius:12px;padding:12px;font-size:16px}
.rfb p{margin:0}
/* timetable & exams */
.nextex{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--sea);border:1px solid var(--swell);border-radius:var(--r);padding:14px;color:var(--chart);text-align:center}
.nextex b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--brass2)}
.nextex span{font-size:14px;color:var(--muted)}
.nextex.eng{border-color:var(--brass)}
.daychips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.dchip{border:1.5px solid var(--chart2);background:#fff;border-radius:10px;padding:8px 2px;font-weight:700;font-size:14px;color:var(--ink);position:relative}
.dchip.on{background:var(--sea);color:var(--chart);border-color:var(--sea)}
.dchip.today::after{content:"";position:absolute;top:4px;inset-inline-end:4px;width:6px;height:6px;border-radius:50%;background:var(--signal)}
.ttable{display:grid;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;border:1.5px solid transparent}
.lrow.free{background:transparent;border:1.5px dashed var(--chart2)}
.lrow.eng{border-color:var(--brass);background:#fff8e6}
.lrow.now{box-shadow:0 0 0 2px var(--kelp)}
.lt{display:flex;flex-direction:column;align-items:center;min-width:64px;font-variant-numeric:tabular-nums}
.lt b{font-size:18px}.lt small{font-size:12px;color:var(--ink2)}
.ls{flex:1;min-width:0;display:flex;flex-direction:column}
.ls b{font-size:16px}.ls small{font-size:13px;color:var(--ink2)}
.eb{font-size:18px}.nowb{font-size:11px;font-weight:800;background:var(--kelp);color:#fff;border-radius:999px;padding:2px 8px}
.lform{background:#fff;border-radius:12px;padding:10px}
.exlist{display:grid;gap:6px}
.exrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px}
.exrow.eng{background:#fff8e6;border:1.5px solid var(--brass)}
.exrow.past{opacity:.55}
.exd{display:flex;flex-direction:column;align-items:center;min-width:44px;font-variant-numeric:tabular-nums}
.exd small{font-size:11px;color:var(--ink2)}
.exs{flex:1;min-width:0;font-weight:700;display:flex;flex-direction:column}.exs small{font-weight:400;font-size:12px;color:var(--ink2)}
.exn{font-size:13px;font-weight:700;color:var(--sea2);white-space:nowrap}
.xbtn{border:0;background:var(--chart2);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;color:var(--ink)}
details summary{cursor:pointer;padding:6px 0}
.shelf{background:var(--sea);border:1px solid var(--swell);border-radius:var(--r);padding:10px 14px;color:var(--chart)}
.shelf summary{cursor:pointer;font-family:var(--f-display);font-size:17px;list-style-position:inside}
.shelf summary small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-inline-start:6px}
.shelfl{display:grid;gap:6px;margin-top:10px}
.shelfi{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:10px;text-align:start;background:var(--chart);color:var(--ink);border:0;border-radius:10px;padding:8px 12px}
.shelfi .en{font-weight:700;font-size:20px;text-align:left}
.shelfi span:nth-child(2){font-size:12px;color:var(--ink2);grid-row:2}
.shelfi b{grid-row:1/3;grid-column:2;align-self:center;color:var(--kelp);font-size:14px}
.gate{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.gate img{width:120px;height:120px;border-radius:28px}

.tabs{position:fixed;inset:auto 0 0;z-index:5;background:var(--abyss);border-top:1px solid var(--swell);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);padding:4px;border-radius:10px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brass2);background:var(--sea)}
.tab .badge{position:absolute;top:0;inset-inline-end:14%;min-width:18px;height:18px;border-radius:9px;background:var(--signal);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--chart);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 8px 24px -10px #000;max-width:90vw;text-align:center}
@keyframes bob{0%,100%{transform:translateX(50%) translateY(0)}50%{transform:translateX(50%) translateY(-3px)}}
.track .ship{animation:bob 2.6s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.stars svg{animation:pop .4s ease-out both}
.stars svg:nth-child(2){animation-delay:.15s}.stars svg:nth-child(3){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

    <button class="tab" data-act="tab" data-tab="zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg>זום</button>

  </div>

<script>
/* ============ CONNECTION ============ */
const API='https://script.google.com/macros/s/AKfycbxLlbEJozfMjmGyQZeeJm0lXCW-NhjTsNaQ7UPCaaQ8qAqmo_yee2h7FEY4LW1IIXWJ4g/exec';
const LS={get(k,d){try{const v=localStorage.getItem('voy:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('voy:'+k,JSON.stringify(v))}catch(e){}}};
let KEY=LS.get('key','');
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
// בדפדפן משאירים את המפתח בכתובת, כדי ש"הוסף למסך הבית" באייפון ישמור אותו גם לאפליקציה
function readKey(){const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);if(m){KEY=m[1];LS.set('key',KEY);if(STANDALONE)history.replaceState(null,'',location.pathname+location.search);return true}return false}
function keyFromText(t){const m=String(t||'').match(/k=([A-Za-z0-9_-]{10,})/)||String(t||'').trim().match(/^([A-Za-z0-9_-]{10,})$/);return m?m[1]:''}
readKey();
addEventListener('online',()=>{if(KEY&&S.online===false&&!S._inflight)loadAll()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!KEY||S._inflight)return;if(S.online===false||Date.now()-CONN.okAt>5*60e3)loadAll()});
addEventListener('hashchange',()=>{if(readKey()){S.badKey=false;loadAll()}});

let CHILD=LS.get('child','');
let WORLD=LS.get('world:'+(CHILD||'yuvik'),'en');
const NS=()=>(CHILD&&CHILD!=='yuvik'?CHILD+':':'')+(WORLD!=='en'?WORLD+':':'');
const cacheKey=()=>NS()?'cache:'+NS():'cache';
const CONN={fails:0,okAt:0,ch:'',lastErr:''};const zz=ms=>new Promise(r=>setTimeout(r,ms));
async function withTO(fn,ms){const ac=window.AbortController?new AbortController():null;const tm=ac&&setTimeout(()=>ac.abort(),ms);try{return await fn(ac)}finally{clearTimeout(tm)}}
async function apiLoadPost(ac){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,c:CHILD||undefined,w:WORLD!=='en'?WORLD:undefined,action:'load',diag:CONN.fails||CONN.lastErr?{fails:CONN.fails,err:CONN.lastErr,ua:navigator.userAgent.slice(0,90)}:undefined}),signal:ac?ac.signal:undefined});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');if(!j.state)throw new Error('no state');return j}
async function apiGet(){const tries=[['post',apiLoadPost],['get',apiGet_],['post',apiLoadPost]];let last;
  for(let i=0;i<tries.length;i++){const [ch,fn]=tries[i];try{const j=await withTO(fn,30000);CONN.ch=ch;CONN.okAt=Date.now();CONN.fails=0;CONN.lastErr='';return j}
    catch(e){last=e;if(/bad key/.test(e&&e.message))throw e;CONN.lastErr=ch+': '+String(e&&e.message||e).slice(0,80);if(i<tries.length-1)await zz(i?3000:400)}}
  CONN.fails++;throw last}
async function apiGet_(ac){const r=await fetch(API+'?key='+encodeURIComponent(KEY)+(CHILD?'&c='+encodeURIComponent(CHILD):'')+(WORLD!=='en'?'&w='+encodeURIComponent(WORLD):'')+'&t='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');return j}
async function apiPost(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,c:CHILD||undefined,w:WORLD!=='en'?WORLD:undefined,...body})});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');return j}

/* outbox: latest version of each state doc, sent when online */
let outbox=LS.get('outbox',{});let flushing=false,flushTimer=null;
function enqueue(id,body){body={c:CHILD||undefined,w:WORLD!=='en'?WORLD:undefined,...body};id=NS()+id;outbox[id]=body;LS.set('outbox',outbox);setSync();clearTimeout(flushTimer);flushTimer=setTimeout(flush,1500)}
async function flush(){
  if(flushing||!KEY)return;flushing=true;
  try{
    for(const id of Object.keys(outbox)){
      const body=outbox[id];
      try{await apiPost(body);if(outbox[id]===body){delete outbox[id];LS.set('outbox',outbox)}}
      catch(e){console.warn('sync',e);
        if(/not allowed|bad state/.test(e.message)){delete outbox[id];LS.set('outbox',outbox);continue}
        if(/bad key/.test(e.message)){S.badKey=true}break}
    }
  }finally{flushing=false;setSync()}
}
setInterval(()=>{flush();flushUploads()},60000);
addEventListener('online',()=>{flush();flushUploads()});

/* upload queue in IndexedDB, so a recording is never lost */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('voyage',1);r.onupgradeneeded=()=>r.result.createObjectStore('up',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('up',mode);const st=t.objectStore('up');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  put(o){return this.tx('readwrite',s=>s.put(o))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  all(){return this.tx('readonly',s=>s.getAll())}
};
let upBusy=false;const upStatus={};
function blobToB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
async function queueUpload(item){item.meta={c:CHILD||undefined,w:WORLD!=='en'?WORLD:undefined,...(item.meta||{})};try{await IDB.put(item)}catch(e){console.warn(e)}upStatus[item.id]='wait';flushUploads()}
async function flushUploads(){
  if(upBusy||!KEY)return;upBusy=true;
  try{

function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function buildVocabQuiz(i,n=10){
  const words=i.words;const pool=[];allIslands().forEach(x=>pool.push(...x.words));
  const order=shuffle([...shuffle(words),...shuffle(words)]).slice(0,Math.min(n,words.length*2));
  return order.map((w,k)=>{
    const others=shuffle(words.filter(x=>x.en!==w.en));
    let guard=0;while(others.length<3&&guard++<50){const r=pool[Math.floor(Math.random()*pool.length)];if(r&&r.en!==w.en&&r.he!==w.he&&!others.some(o=>o.en===r.en))others.push(r)}
    const distract=others.slice(0,3);
    const form=w.form||w.en;
    const re=new RegExp('\\b'+reEsc(form)+'\\b','i');
    const canGap=w.ex&&re.test(w.ex);
    const types=['en2he','he2en','listen'];if(canGap)types.push('gap','gap');
    const t=types[(k+Math.floor(Math.random()*types.length))%types.length];
    if(t==='en2he') return {t,word:w.en,prompt:`מה הפירוש של <span class="en">${esc(w.en)}</span>?`,say:w.en,opts:shuffle([w,...distract]).map(x=>x.he),ans:w.he,en:false};
    if(t==='he2en') return {t,word:w.en,prompt:`איך אומרים ב${LANG()==='ar'?'ערבית':'אנגלית'}: <b>${esc(w.he)}</b>?`,opts:shuffle([w,...distract]).map(x=>x.en),ans:w.en,en:true};
    if(t==='listen') return {t,word:w.en,prompt:'הקשב ובחר את המילה ששמעת',say:w.en,autoSay:true,opts:shuffle([w,...distract]).map(x=>x.en),ans:w.en,en:true};
    return {t:'gap',word:w.en,prompt:'השלם את המשפט',gap:esc(w.ex).replace(new RegExp('\\b'+reEsc(esc(form))+'\\b','i'),'<u></u>'),say:w.ex,opts:shuffle([w,...distract]).map(x=>x.form||x.en),ans:form,en:true};
  });
}

function finishActivity(kind,title,correct,total,missed,extra){

  if(kind==='readtext'&&extra){b.readHist=[...(b.readHist||[]),{pct,wpm:extra.wpm,d:today()}].slice(-6)}
  const ratioAfter=islandRatio(i);const hasScored=stationsOf(i).some(x=>x.scored);
  const islandDone=!hasScored?null:(ratioAfter>=1&&ratioBefore<1)?'full':(ratioAfter>=.5&&ratioBefore<.5)?'pass':null;
  _trk=null;const fresh=activeIds().filter(x=>!activeBefore.includes(x)).map(x=>islandById(x)).filter(Boolean);

  if(kind==='quiz'&&pct>=70&&idx>-1&&idx+1===S.progress.unlocked&&idx+1<ISLANDS.length){S.progress.unlocked++;unlocked=ISLANDS[idx+1].name}

const isLatinOld=s=>/[A-Za-z]/.test(s)&&!/[֐-׿]/.test(s);
const isLatin=s=>LANG()==='ar'?/[\u0600-\u06FF]/.test(s):isLatinOld(s);
const enSpan=s=>isLatin(s)?`<span class="en">${esc(s)}</span>`:esc(s);
function sentencesOf(text){return String(text).replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z"])/).map(x=>x.trim()).filter(Boolean)}
function readItems(i){
  let out=[];
  if(i.text)i.text.paras.forEach(p=>sentencesOf(p.replace(/^[A-Z][a-z]+( [A-Z][a-z]+)?:\s+/,'').replace(/^(The Classroom|The Teacher|Books and Notebooks)\.\s+/,'')).forEach(s=>out.push(s)));
  (i.dialogues||[]).forEach(d=>d.forEach(l=>out.push(l.replace(/^[A-Za-z]+:\s*/,''))));
  (i.games||[]).forEach(g=>{if(g.kind==='order')g.items.forEach(it=>it.forEach(s=>out.push(s)))});
  (i.words||[]).forEach(w=>{if(w.ex)out.push(w.ex)});
  (i.mistakes||[]).forEach(m=>out.push(m.correct));
  return [...new Set(out)].filter(s=>{const n=s.split(' ').length;return n>=3&&n<=18});
}

function buildGame(i,n){

    if(g.kind==='mc')items=g.items.map(it=>({q:it.q,o:it.o,a:Array.isArray(it.a)?it.a:[it.a],why:it.why,say:it.q}));
    else if(g.kind==='fill')items=shuffle(g.items).map(it=>({q:it.t,gap:true,o:shuffle(it.o),a:null,ans:it.a,say:it.t.replace('___',it.a)}));

let kTimer=null,kRun=0;
function kHighlight(n){document.querySelectorAll('.kara .w.hl').forEach(x=>x.classList.remove('hl'));const el=document.getElementById('kw'+n);if(el){el.classList.add('hl');el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function kPlay(){
  if(!('speechSynthesis' in window)){toast('הטלפון לא תומך בהקראה');return}
  const sc=S.screen;const i=islandById(sc.id);const paras=i.text.paras;
  hush();clearTimeout(kTimer);const run=++kRun;const rate=SPEEDS[S.speed].rate;
  let base=0;const offsets=paras.map(p=>{const o=base;base+=p.split(' ').length;return o});
  const playPara=pi=>{
    if(run!==kRun||pi>=paras.length){kHighlight(-1);return}
    if(SPEEDS[S.speed].wbw){sayPaced(paras[pi],k=>{if(run===kRun&&k>=0)kHighlight(offsets[pi]+k)},()=>{if(run===kRun)setTimeout(()=>playPara(pi+1),500)});return}
    const words=paras[pi].split(' ');const starts=[];let c=0;words.forEach(w=>{starts.push(c);c+=w.length+1});
    const u=new SpeechSynthesisUtterance(paras[pi]);u.lang=TTS_LANG();u.rate=rate;{const vv=LANG()==='ar'?arVoice:enVoice;if(vv)u.voice=vv}
    let gotB=false,wk=0;
    u.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;clearTimeout(kTimer);let k=0;while(k+1<starts.length&&starts[k+1]<=e.charIndex)k++;kHighlight(offsets[pi]+k)};
    const step=()=>{if(gotB||run!==kRun)return;if(wk<words.length){kHighlight(offsets[pi]+wk);wk++;kTimer=setTimeout(step,(300+words[wk-1].length*55)/rate)}};
    u.onstart=()=>{kTimer=setTimeout(step,120)};
    u.onend=()=>{clearTimeout(kTimer);setTimeout(()=>playPara(pi+1),250)};
    speechSynthesis.speak(u);
  };
  playPara(0);
}

/* read aloud with speech recognition */
function buildRead2(i){return {name:'read2',id:i.id,items:shuffle(readItems(i)).slice(0,6),idx:0,correct:0,res:null,listening:false,missed:[]}}
const normW=w=>LANG()==='ar'?plainW(w).replace(/[إأآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي'):w.toLowerCase().replace(/[^a-z0-9']/g,'').replace(/'/g,'');
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,x)=>[x,...Array(n).fill(0)]);for(let y=1;y<=n;y++)d[0][y]=y;for(let x=1;x<=m;x++)for(let y=1;y<=n;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));return d[m][n]}
const NUMW={'1':'one','2':'two','3':'three','10':'ten','11':'eleven','12':'twelve','14':'fourteen','15':'fifteen','27':'twentyseven'};
function matchWords(target,heard){
  const T=target.split(' ').map(normW).filter(Boolean);const H=heard.split(/\s+/).map(normW).filter(Boolean).map(w=>NUMW[w]||w);
  let p=0;return T.map(t=>{for(let k=p;k<Math.min(H.length,p+4);k++){const h=H[k];if(h===t||(t.length>=4&&lev(h,t)<=1)||(NUMW[t]&&NUMW[t]===h)){p=k+1;return true}}return false});
}
function viewRead2(){

  <div class="read r2">${words.map((w,k)=>`<span class="w ${res?(res[k]?'good':'miss'):''}" data-act="sayw" data-text="${esc(w.replace(LETTER_RE(),''))}">${esc(w)}</span>`).join(' ')}</div>
  <div class="btns">

    ${readSR()?`<button class="btn ${sc.listening?'red':'brass'}" data-act="srGo">${I.mic2} ${sc.listening?'מקשיב…':res?'לנסות שוב':'אני קוראת'}</button>`:''}
  </div>
  ${sc.heard?`<p class="sub">הטלפון שמע: <span class="en">${esc(sc.heard)}</span></p>`:''}
  ${pct!=null?`<p class="fb ${pct>=80?'ok':'bad'}">${pct>=80?'קריאה מצוינת!':'עוד ניסיון אחד?'} ${pct}% מהמילים</p>`:''}
  ${res&&res.some(x=>!x)?`<div class="misslist"><span class="sub">מילים לתרגל. לחצי כדי לשמוע איך אומרים:</span><div class="hearrow">${[...new Set(words.filter((w,k)=>!res[k]).map(w=>w.replace(LETTER_RE(),'')).filter(Boolean))].map(w=>`<button class="chip" data-act="say" data-text="${esc(w)}">🔊 ${esc(w)}</button><button class="btn ghost small" data-act="saySlow" data-text="${esc(w)}" aria-label="לאט">🐢</button>`).join('')}</div></div>`:''}
  ${readSR()?(res?`<div class="btns"><button class="btn brass" data-act="r2Next">${sc.idx===sc.items.length-1?'לתוצאות':'הבא'}</button></div>`:''):
    `<div class="btns"><button class="btn brass" data-act="r2Self" data-v="1">קראתי נכון</button><button class="btn ghost" data-act="r2Self" data-v="0">נעזרתי בהקראה</button></div>`}
  </section>`;

let SR=null;
function srGo(){
  const sc=S.screen;if(sc.listening){try{SR&&SR.stop()}catch(e){}return}
  hush();
  try{SR=new SRClass()}catch(e){toast('הזיהוי הקולי לא זמין בטלפון הזה');return}
  SR.lang=TTS_LANG();SR.interimResults=false;SR.maxAlternatives=5;SR.continuous=false;
  const target=sc.items[sc.idx];let got=false;
  SR.onresult=e=>{got=true;let best=null,bestN=-1,bestT='';const r=e.results[0];for(let k=0;k<r.length;k++){const m=matchWords(target,r[k].transcript);const n=m.filter(Boolean).length;if(n>bestN){bestN=n;best=m;bestT=r[k].transcript}}
    const prev=sc.res?sc.res.filter(Boolean).length:-1;if(!sc.res||bestN>=prev){sc.res=best;sc.heard=bestT}
    const pct=sc.res.filter(Boolean).length/sc.res.length;pct>=.8?sfx.ok():sfx.bad()};
  SR.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('צריך לאשר גישה למיקרופון');else if(e.error==='no-speech')toast('לא שמעתי. נסי לדבר קרוב יותר לטלפון');};
  SR.onend=()=>{sc.listening=false;if(S.screen===sc)render()};
  try{SR.start();sc.listening=true;sc.heard='';render()}catch(e){toast('לא הצלחתי להפעיל את המיקרופון')}
}

/* ============ CAPTAIN'S REPORT (feedback per island) ============ */
function islandReportHTML(i){
  const b=S.progress.best[i.id]||{};const st=stationsOf(i).filter(s=>s.scored);
  const lvl=v=>v==null?['עוד לא','none']:v>=90?['מצוין','top']:v>=70?['טוב','good']:['לחזור','low'];
  const rows=st.map(s=>{const v=b[s.k];const [t,c]=lvl(v);return `<div class="reprow"><span class="rn">${esc(s.t)}</span><span class="rbar"><i class="${c}" style="width:${v||0}%"></i></span><span class="rl ${c}">${v!=null?v+'%':''} ${t}</span></div>`}).join('');
  const strong=st.filter(s=>(b[s.k]||0)>=90).map(s=>s.t);
  const weak=st.filter(s=>b[s.k]!=null&&b[s.k]<70);
  const todo=st.filter(s=>b[s.k]==null);
  const tips=[];
  if(strong.length)tips.push(`<b>חזקה ב:</b> ${strong.map(esc).join(', ')}.`);
  if(weak.some(s=>s.k==='quiz'))tips.push('במשחק המילים: לעבור שוב על "כרטיסיות מילים" עם ההקראה, ואז לשחק שוב.');
  if(weak.some(s=>s.k==='spell'))tips.push('האיות עוד מבלבל. שווה לשחק שוב ב"בונים מילה", ולהקשיב למילה לפני שבונים.');
  if(weak.some(s=>s.k==='readaloud'||s.k==='readtext'))tips.push('בקריאה בקול כדאי קודם לשמוע את הטקסט ב"קוראים יחד", ואז לקרוא שוב לאט.');

let RT=null;
function rtPaint(sc,pi,heard){
  const m=matchWords(sc.__para,heard);let last=-1;m.forEach((ok,k)=>{if(ok)last=k});
  m.forEach((ok,k)=>{const el=document.getElementById(`rw${pi}_${k}`);if(el){el.classList.toggle('good',ok);el.classList.toggle('miss',!ok&&k<last)}});return m;
}
function coachQueue(para,res){const words=rtWords(para);const q=[];res.forEach((ok,k)=>{const w=words[k].replace(LETTER_RE(),'');if(!ok&&w.length>=2)q.push(k)});return q.slice(0,8)}
function rtGo(){
  const sc=S.screen;const i=islandById(sc.id);const pi=sc.pi;const para=i.text.paras[pi];
  hush();sc.__para=para;sc.coach=null;
  let finals='',t0=0,t1=0,restarts=0,stopReq=false,best=null;
  const start=()=>{
    try{RT=new SRClass()}catch(e){toast('הזיהוי הקולי לא זמין בטלפון הזה');return}
    RT.lang=TTS_LANG();RT.continuous=true;RT.interimResults=true;RT.maxAlternatives=1;
    RT.onresult=e=>{
      const now=Date.now();if(!t0)t0=now;t1=now;
      let interim='';for(let k=e.resultIndex;k<e.results.length;k++){const tr=e.results[k][0].transcript;if(e.results[k].isFinal)finals+=' '+tr;else interim+=' '+tr}
      const m=rtPaint(sc,pi,(finals+' '+interim).trim());
      if(!best||m.filter(Boolean).length>=best.filter(Boolean).length)best=m;
      if(m.every(Boolean)){stopReq=true;try{RT.stop()}catch(_){}}
    };
    RT.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopReq=true;toast('צריך לאשר גישה למיקרופון')}};
    RT.onend=()=>{
      if(!stopReq&&restarts<6&&S.screen===sc){restarts++;start();return}
      sc.listening=false;
      if(best){sc.res[pi]=best;sc.heard[pi]=finals.trim();sc.ms[pi]=Math.max(0,t1-t0);
        const q=coachQueue(para,best);sc.coach={pi,q,i:0,ok:0,tries:0,msg:''};
        if(!q.length){sfx.win()}else sfx.tap();
        if(q.length)setTimeout(()=>{if(S.screen===sc&&sc.coach&&sc.coach.i===0){const w=rtWords(para)[q[0]].replace(LETTER_RE(),'');sayPaced(w,null,null,'x')}},600);}
      else toast('לא שמעתי. נסי לקרוא קרוב יותר לטלפון');
      if(S.screen===sc)render();
    };
    try{RT.start()}catch(e){}
  };
  sc.stop=()=>{stopReq=true;try{RT&&RT.stop()}catch(_){}};
  sc.listening=true;render();start();
}
function coachHit(target,alts){const t=normW(target);return alts.some(a=>a.split(/\s+/).map(normW).some(h=>h===t||(t.length>=4&&lev(h,t)<=1)||(NUMW[h]===t)))}
let CO_R=null;
function heOf(w){const k=String(w).toLowerCase();for(const i of allIslands()){const g=i.text&&i.text.gloss;if(g)for(const e in g)if(e.toLowerCase()===k)return g[e];for(const x of (i.words||[]))if(String(x.en).toLowerCase()===k||String(x.form||'').toLowerCase()===k)return x.he}return ''}
function sentenceWith(para,w){const re=new RegExp('\\b'+reEsc(w)+'\\b','i');return sentencesOf(para).find(x=>re.test(x))||para}
function coSay(word){
  const sc=S.screen;const co=sc.coach;if(!co||co.listening)return;hush();
  let R;try{R=CO_R=new SRClass()}catch(e){toast('הזיהוי הקולי לא זמין');return}
  R.lang=TTS_LANG();R.interimResults=false;R.maxAlternatives=5;R.continuous=false;let got=false;
  R.onresult=e=>{if(got)return;got=true;const r=e.results[0];const alts=[];for(let k=0;k<r.length;k++)alts.push(r[k].transcript);
    const k=co.q[co.i];
    if(coachHit(word,alts)){sc.fixed[co.pi+'_'+k]=true;co.ok++;co.i++;co.tries=0;co.msg='';sfx.ok();toast(['מצוין!','יפה מאוד!','בדיוק ככה!'][co.ok%3])}
    else{co.tries++;sfx.bad();
      if(co.tries>=3){co.msg='';co.i++;co.tries=0;toast('נמשיך. נחזור למילה הזו בתרגול בסוף')}
      else co.msg=`כמעט! שמעתי <span class="en">${esc(alts[0]||'')}</span>. לחצי "שמעי", הקשיבי ונסי שוב.`}
    if(co.i<co.q.length&&co.tries===0)setTimeout(()=>{if(S.screen===sc&&co.i<co.q.length){const w=rtWords(islandById(sc.id).text.paras[co.pi])[co.q[co.i]].replace(LETTER_RE(),'');sayPaced(w,null,null,'x')}},700);
  };

  R.onend=()=>{co.listening=false;if(S.screen===sc)render()};
  co.listening=true;try{R.start();render()}catch(e){co.listening=false}

const SMALLW=new Set(['a','an','the','is','are','i','to','of','and','in','on','at','it','he','she','we','they','you','my','his','her','for','with','but','so','be','was','do']);
function rtFinish(){
  const sc=S.screen;const i=islandById(sc.id);const paras=i.text.paras;
  let total=0,ok=0,ms=0;const missed=[];
  paras.forEach((p,pi)=>{const words=rtWords(p);const r=sc.res[pi];if(!r)return;total+=words.length;ok+=r.filter(Boolean).length;ms+=sc.ms[pi]||0;
    r.forEach((g,k)=>{const w=words[k].replace(LETTER_RE(),'');if(!g&&!(sc.fixed||{})[pi+'_'+k]&&w.length>=3&&!SMALLW.has(w.toLowerCase()))missed.push(w)})});
  const fixedN=Object.keys(sc.fixed||{}).length;
  if(!total){toast('עוד לא קראת אף פסקה');return}
  const wpm=ms>3000?Math.round(ok/(ms/60000)):null;
  const prev=((S.progress.best[i.id]||{}).readHist||[]).slice(-1)[0]||null;
  const pct=Math.round(ok/total*100);
  S.session.readOk+=ok>=total*.8?1:0;
  finishActivity('readtext',`קריאת אנסין: ${i.text.title}${wpm?` · ${wpm} מילים לדקה`:''}`,ok,total,[...new Set(missed)],{wpm,prev,pct,fixed:fixedN,read:sc.res.filter(Boolean).length,paras:paras.length});
}
function readFeedbackHTML(r){

const REC={stream:null,rec:null,chunks:[],part:0,recId:null,zoomId:null,start:0,segStart:0,tick:null,analyser:null,buf:null,wake:null,mime:'',saved:0,pending:0};
function pickMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac'];for(const m of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''}
async function wakeOn(){try{if('wakeLock' in navigator){REC.wake=await navigator.wakeLock.request('screen');REC.wake.addEventListener?.('release',()=>{REC.wake=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){S.lastInput=Date.now();if(REC.rec&&!REC.wake)wakeOn()}});
async function startRecording(zoomId){
  if(REC.rec)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('הטלפון הזה לא תומך בהקלטה מהדפדפן');return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}})}
  catch(e){toast('צריך לאשר גישה למיקרופון כדי להקליט');return}
  let z=S.zoom.find(x=>x.id===zoomId);
  if(!z){z={id:uid('z'),date:today(),time:hhmm(new Date()),teacher:'',link:'',done:false,notes:'',recs:[]};S.zoom.push(z);saveState('zoom')}
  Object.assign(REC,{stream,chunks:[],part:0,recId:uid('r'),zoomId:z.id,start:Date.now(),mime:pickMime(),saved:0,pending:0});
  try{const c=ac();if(c){const src=c.createMediaStreamSource(stream);const an=c.createAnalyser();an.fftSize=512;src.connect(an);REC.analyser=an;REC.buf=new Uint8Array(an.fftSize)}}catch(e){}
  startSegment();wakeOn();
  REC.tick=setInterval(recTick,250);
  sfx.tap();render();
}
function startSegment(){
  REC.part++;REC.segStart=Date.now();
  const opts={audioBitsPerSecond:48000};if(REC.mime)opts.mimeType=REC.mime;
  let r;try{r=new MediaRecorder(REC.stream,opts)}catch(e){r=new MediaRecorder(REC.stream)}
  const chunks=[];const part=REC.part;
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.onstop=()=>{const blob=new Blob(chunks,{type:(r.mimeType||REC.mime||'audio/webm').split(';')[0]});if(blob.size>2000)saveRecPart(blob,part)};
  r.start(10000);REC.rec=r;
}
function saveRecPart(blob,part){
  const z=S.zoom.find(x=>x.id===REC.zoomId)||{};
  REC.pending++;
  queueUpload({id:uid('u'),kind:'rec',blob,meta:{zoomId:z.id,recId:REC.recId,part,date:z.date||today(),teacher:z.teacher||''}});
}
function onRecUploaded(it,file){
  const z=S.zoom.find(x=>x.id===it.meta.zoomId);
  if(z&&file){z.recs=z.recs||[];if(!z.recs.some(r=>r.id===file.id))z.recs.push({id:file.id,url:file.url,name:file.name,part:it.meta.part});z.recs.sort((a,b)=>a.part-b.part);saveState('zoom')}
  if(it.meta.recId===REC.recId){REC.saved++;REC.pending=Math.max(0,REC.pending-1)}
  if(S.tab==='zoom'&&!REC.rec)render();
}
function recTick(){
  if(!REC.rec)return;
  const el=Date.now()-REC.start;
  if(Date.now()-REC.segStart>=SEG_MIN*60000){const old=REC.rec;startSegment();try{old.stop()}catch(e){}}
  if(el>=MAX_REC_MIN*60000){stopRecording(true);return}
  if(REC.analyser){REC.analyser.getByteTimeDomainData(REC.buf);let m=0;for(const v of REC.buf)m=Math.max(m,Math.abs(v-128));REC.level=Math.min(1,m/70)}
  refreshRecUI();
}
function fmtDur(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function stopRecording(auto){

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1800;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.85));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}
const FILE_OK=/^(application\/(pdf|msword|rtf|vnd\.openxmlformats-officedocument\.wordprocessingml\.document|vnd\.oasis\.opendocument\.text)|text\/(plain|html|rtf)|message\/rfc822)$/;
const FILE_EXT=/\.(pdf|docx?|odt|rtf|txt|html?|eml)$/i;
const MAX_FILE=10*1024*1024;
function addFiles(files){
  let n=0;const imgs=[];
  for(const f of files){
    if(/^image\//.test(f.type)){imgs.push(f);continue}
    if(!FILE_OK.test(f.type)&&!FILE_EXT.test(f.name)){toast('סוג קובץ לא נתמך: '+f.name);continue}
    if(f.size>MAX_FILE){toast('הקובץ גדול מ־10MB: '+f.name);continue}
    S.shots.push({id:uid('f'),blob:f,name:f.name,file:true,status:'new'});n++;
  }
  if(imgs.length)addShots(imgs);else if(n){sfx.tap();render()}
}
async function addShots(files){
  for(const f of files){
    if(!/^image\//.test(f.type))continue;
    const blob=await compress(f);
    S.shots.push({id:uid('p'),blob,url:URL.createObjectURL(blob),status:'new'});
  }
  sfx.shutter();render();
}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;const sc=S.screen;
  if(a!=='answer')sfx.tap();
  switch(a){
    case 'sound':S.sound=!S.sound;LS.set('sound',S.sound);render();break;
    case 'relinkCancel':S.relink=false;render();break;
    case 'shelfTog':setTimeout(()=>{const d=document.querySelector('.shelf');if(d)LS.set('shelfOpen',d.open)},0);break;
    /* book games */
    case 'gAns':{if(sc.answered)break;const q=sc.items[sc.idx];const k=+el.dataset.k;
      if(q.a.length>1){if(sc.picked.includes(k)){sc.picked=sc.picked.filter(x=>x!==k);render();break}sc.picked.push(k);if(sc.picked.length<q.a.length){render();break}}
      else sc.picked=[k];
      sc.answered=true;sc.wasOk=q.a.every(x=>sc.picked.includes(x));
      if(sc.wasOk){sc.correct++;sfx.ok();if(q.gap&&q.say)setTimeout(()=>say(q.say),350)}else{sfx.bad();sc.missed.push(q.ans||q.o[q.a[0]])}
      render();break;}
    case 'tfAns':{if(sc.answered)break;const q=sc.items[sc.idx];sc.pick=el.dataset.v==='1';sc.answered=true;sc.wasOk=sc.pick===q.t;
      if(sc.wasOk){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(q.s)}
      render();if(q.fix)setTimeout(()=>say(q.fix),400);break;}
    case 'sortAns':{if(sc.answered)break;const q=sc.items[sc.idx];sc.pick=+el.dataset.g;sc.answered=true;sc.wasOk=sc.pick===q.gi;
      if(sc.wasOk){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(q.w)}render();break;}
    case 'gNext':{sc.answered=false;sc.picked=[];sc.pick=null;
      const total=sc.items.length;if(sc.idx<total-1){sc.idx++;render()}else gameDone(sc,sc.correct,total,sc.missed);break;}
    case 'memo':{if(sc.lock)break;const c=sc.cards[+el.dataset.k];if(c.open||c.done)break;c.open=true;sfx.flip();say(c.t);
      if(sc.first==null){sc.first=c.k;render();break}
      const f=sc.cards[sc.first];sc.first=null;
      if(f.p===c.p){f.done=c.done=true;sc.found++;setTimeout(()=>sfx.ok(),250);render();
        if(sc.found===sc.total)setTimeout(()=>gameDone(sc,sc.total,sc.total,[]),900)}
      else{sc.mistakes++;sc.lock=true;render();setTimeout(()=>{f.open=c.open=false;sc.lock=false;if(S.screen===sc)render()},1000)}
      break;}
    case 'ordTap':{const k=+el.dataset.k;if(k===sc.next){sc.next++;sfx.ok();sc.flash=null}else{sc.err++;sfx.bad();sc.flash=k;setTimeout(()=>{if(S.screen===sc){sc.flash=null;render()}},600)}
      if(sc.next>=sc.shuf.length&&!sc.err)sc.correct++;
      render();break;}
    case 'ordNext':{if(sc.err)sc.missed.push(sc.items[sc.idx][0]);
      if(sc.idx<sc.items.length-1){sc.idx++;sc.shuf=shuffle(sc.items[sc.idx].map((s,k)=>({s,k})));sc.next=0;sc.err=0;render()}
      else gameDone(sc,sc.correct,sc.items.length,sc.missed);break;}
    case 'spTile':{const t=sc.tiles[+el.dataset.k];if(t.used)break;t.used=true;sc.built.push(t);sfx.tap();
      const w=sc.items[sc.idx];if(sc.built.length===plainW(w.en).length){sc.checked=true;sc.ok=sc.built.map(x=>x.ch).join('')===plainW(w.en);
        if(sc.ok){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(w.en)}say(w.en)}
      render();break;}
    case 'spBack':{const t=sc.built.pop();if(t)t.used=false;render();break;}
    case 'spNext':{if(sc.idx<sc.items.length-1){sc.idx++;Object.assign(sc,spellState(sc.items[sc.idx]));render();say(sc.items[sc.idx].en)}else finishActivity('spell','בונים מילה',sc.correct,sc.items.length,sc.missed);break;}
    case 'kPlay':kPlay();break;
    case 'kSpeed':sc.slow=!sc.slow;kRun++;hush();render();break;
    case 'kStop':kRun++;clearTimeout(kTimer);hush();kHighlight(-1);break;
    case 'kDone':{kRun++;hush();const i=islandById(sc.id);finishActivity('story','קוראים יחד: '+i.text.title,1,1,[]);break;}
    case 'srGo':srGo();break;
    case 'calDay':S.calDay=+el.dataset.k;S.editLesson=null;render();break;
    case 'lsEdit':if(isParent()){S.editLesson=+el.dataset.k;render()}break;
    case 'lsCancel':S.editLesson=null;render();break;
    case 'exDel':{if(!isParent())break;const c=editableSchedule();c.exams=c.exams.filter(e=>e.id!==el.dataset.id);saveSchedule();toast('המבחן נמחק');break;}
    case 'rtGo':rtGo();break;
    case 'rtHear':{const i=islandById(sc.id);const pi=sc.pi;sayPaced(i.text.paras[pi],k=>{document.querySelectorAll('.rt .w.hl').forEach(x=>x.classList.remove('hl'));const el=document.getElementById(`rw${pi}_${k}`);if(el)el.classList.add('hl')});break;}
    case 'coListen':sayPaced(el.dataset.w,null,null,'x');break;
    case 'coHear':say(el.dataset.w,.7);break;
    case 'coCtx':{const i=islandById(sc.id);const co=sc.coach;if(!co)break;const para=i.text.paras[co.pi];const w=el.dataset.w;const st=sentenceWith(para,w);sayPaced(st,null,null,S.speed==='x'?'s':S.speed);break;}
    case 'cfStay':S.confirm=null;render();break;
    case 'cfGo':{const t=S.confirm;S.confirm=null;if(t)navTo(t,true);break;}
    case 'coSay':coSay(el.dataset.w);break;
    case 'coSkip':{const co=sc.coach;if(co){co.i++;co.tries=0;co.msg='';render()}break;}
    case 'rtStop':sc.stop&&sc.stop();break;
    case 'rtNext':{const i=islandById(sc.id);if(sc.pi<i.text.paras.length-1){sc.pi++;render();const el=document.getElementById('rtp'+sc.pi);el&&el.scrollIntoView({block:'center',behavior:'smooth'})}else rtFinish();break;}
    case 'drill':{const r=sc;const words=[...new Set(r.missed||[])].slice(0,10);if(!words.length)break;S.screen={name:'read2',id:r.id,items:words,idx:0,correct:0,res:null,listening:false,missed:[],drill:true};render();scrollTo({top:0});break;}
    case 'r2Next':case 'r2Self':{
      let ok;if(a==='r2Self')ok=el.dataset.v==='1';else{const r=sc.res||[];ok=r.length&&r.filter(Boolean).length/r.length>=.8}
      if(ok){sc.correct++;S.session.readOk++}else{S.session.readHelp++;sc.missed.push(sc.items[sc.idx].split(' ').slice(0,4).join(' ')+'…')}
      if(sc.idx<sc.items.length-1){sc.idx++;sc.res=null;sc.heard='';render()}else finishActivity(sc.drill?'drill':'readaloud',sc.drill?'תרגול מילים קשות':'קוראת בקול',sc.correct,sc.items.length,[]);break;}
    case 'tab':{const t=el.dataset.tab;if(t==='map'&&S.tab==='map'){if(S.screen.name!=='map')navTo({act:'home'})}else{stopAll();S.tab=t;render();scrollTo({top:0})}break;}
    case 'home':navTo({act:'home'});break;
    case 'kid':switchChild(el.dataset.id);break;
    case 'conntest':connTest();break;
    case 'retry':toast('מתחבר…');S.online=null;setSync();loadAll();break;
    case 'world':switchWorld(el.dataset.id);break;
    case 'ref':S.refTab=S.refTab||'letters';S.ref=true;render();break;
    case 'refTab':S.refTab=el.dataset.id;render();break;
    case 'refClose':S.ref=false;render();break;
    case 'sayAr':say(el.dataset.text,.7);break;
    case 'fleet':S.boatModal={kind:'fleet',from:S.boatModal&&S.boatModal.kind};render();break;
    case 'bmClose':{const m=S.boatModal;S.boatModal=null;const fk=THEME()==='desert'?'caravanIntro':'fleetIntro';if(m&&(m.kind==='intro'||m.from==='intro')&&!S.progress[fk]){S.progress[fk]=1;saveState('progress')}render();break;}
    case 'locked':sfx.bad();toast('האי עדיין נעול. 70% במשחק המילים של האי הקודם יפתחו אותו');break;
    case 'island':navTo({act:'island',id:el.dataset.id});break;
    case 'station':{
      const id=el.dataset.id,k=el.dataset.k,i=islandById(id);if(!i)break;
      kRun++;clearTimeout(kTimer);
      if(k==='story'){S.screen={name:'karaoke',id,slow:false}}
      else if(k==='spell'){const sp=buildSpell(i);S.screen=sp;setTimeout(()=>{if(S.screen===sp)say(sp.items[0].en)},350)}
      else if(/^g\d+$/.test(k)){S.screen=buildGame(i,+k.slice(1))}
      else if(k==='readtext'){S.screen={name:'readtext',id,pi:0,res:[],heard:[],ms:[],listening:false}}
      else if(k==='readaloud'){const r=buildRead2(i);if(!r.items.length){toast('אין משפטים באי הזה');break}S.screen=r}
      else if(k==='learn'){S.screen={name:'learn',id,idx:0};say(i.words[0].en)}
      else if(k==='quiz'){S.screen={name:'quiz',id,idx:0,qs:buildVocabQuiz(i),correct:0,missed:[]}}
      else if(k==='sounds'){S.screen={name:'sounds',id,idx:0,qs:buildSoundQuiz(),correct:0,missed:[]}}
      else if(k==='fix'){S.screen={name:'fix',id,idx:0,qs:buildFixQuiz(i),correct:0,missed:[]}}
      else if(k==='readaloud'){const items=shuffle([...i.words.filter(w=>w.ex).map(w=>w.ex),...(i.mistakes||[]).map(m=>m.correct)]).slice(0,5);if(!items.length){toast('אין משפטים באי הזה');break}S.screen={name:'readaloud',id,idx:0,items,ok:0,help:0}}
      else if(k==='unseen'){S.screen={name:'unseen',id,answers:[],checked:false}}
      render();scrollTo({top:0});
      const q=S.screen.qs&&S.screen.qs[0];if(q&&q.autoSay)setTimeout(()=>say(q.say),350);
      break;}
    case 'say':{const t=el.dataset.text||'';if(t.includes(' ')&&S.speed!=='n')sayPaced(t);else say(t,S.speed==='x'?.45:S.speed==='s'?.6:.85);break;}
    case 'speed':{const k=SPEED_ORDER[(SPEED_ORDER.indexOf(S.speed)+1)%3];S.speed=k;LS.set('speed',k);kRun++;hush();toast('מהירות: '+SPEEDS[k].label);render();break;}
    case 'saySlow':sayPaced(el.dataset.text,null,null,'x');break;
    case 'stopSay':hush();break;
    case 'sayw':{const t=el.dataset.text;if(t){document.querySelectorAll('.w.hl').forEach(x=>x.classList.remove('hl'));el.classList.add('hl');say(t,.75)}break;}
    case 'learnNext':{const i=islandById(sc.id);sfx.flip();if(sc.idx<i.words.length-1){sc.idx++;render();say(i.words[sc.idx].en)}else finishActivity('learn','כרטיסיות מילים',i.words.length,i.words.length,[]);break;}
    case 'learnPrev':if(sc.idx>0){sc.idx--;sfx.flip();render();say(islandById(sc.id).words[sc.idx].en)}break;
    case 'answer':{if(sc.answered)break;const q=sc.qs[sc.idx];sc.picked=q.opts[+el.dataset.k];sc.answered=true;
      if(sc.picked===q.ans){sc.correct++;sfx.ok()}else{sc.missed.push(q.word);sfx.bad()}
      render();if((q.t==='gap'||q.t==='fix')&&sc.picked===q.ans)setTimeout(()=>say(q.say),400);break;}
    case 'nextQ':{sc.answered=false;sc.picked=null;
      if(sc.idx<sc.qs.length-1){sc.idx++;render();const q=sc.qs[sc.idx];if(q.autoSay)setTimeout(()=>say(q.say),300)}
      else{const kind=sc.name==='quiz'?'quiz':sc.name;finishActivity(kind,{quiz:'משחק מילים',sounds:'מה שמעת?',fix:'מתקנים טעויות'}[kind],sc.correct,sc.qs.length,sc.missed)}break;}
    case 'readMark':{if(el.dataset.v==='ok'){sc.ok++;S.session.readOk++;sfx.ok()}else{sc.help++;S.session.readHelp++}
      if(sc.idx<sc.items.length-1){sc.idx++;render()}else finishActivity('read','קריאה בקול',sc.ok,sc.items.length,[]);break;}
    case 'uAns':sc.answers[+el.dataset.q]=+el.dataset.o;render();break;
    case 'uCheck':{const st=islandById(sc.id).story;if(sc.answers.filter(x=>x!=null).length<st.qs.length){toast('יש לענות על כל השאלות');break}
      sc.checked=true;const c=st.qs.filter((q,k)=>sc.answers[k]===q.a).length;sc.correct=c;c===st.qs.length?sfx.ok():sfx.bad();render();break;}
    case 'uDone':{const st=islandById(sc.id).story;finishActivity('unseen','אנסין: '+st.title,sc.correct,st.qs.length,[]);break;}
    case 'copyRep':{const txt=buildReport();const sel=()=>{const r=$('#rep');const g=getSelection();const rg=document.createRange();rg.selectNodeContents(r);g.removeAllRanges();g.addRange(rg);toast('הטקסט מסומן, אפשר להעתיק')};
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('הדוח הועתק')).catch(sel);else sel();break;}
    case 'delWord':{const id=el.dataset.id;S.classWords=S.classWords.filter(w=>w.id!==id);saveState('classwords');render();break;}
    case 'delZoom':{const id=el.dataset.id;S.zoom=S.zoom.filter(z=>z.id!==id);saveState('zoom');render();break;}
    case 'recStart':startRecording(el.dataset.id);break;
    case 'recStop':stopRecording(false);break;
    case 'delShot':{const s=S.shots.find(x=>x.id===el.dataset.id);if(s)URL.revokeObjectURL(s.url);S.shots=S.shots.filter(x=>x.id!==el.dataset.id);render();break;}
    case 'reqProcess':{el.disabled=true;apiPost({action:'requestProcess',note:''}).then(()=>{sfx.ok();toast('הבקשה נשלחה לאבא במייל')}).catch(err=>{toast(err.message||'לא הצלחתי לשלוח, נסי שוב');el.disabled=false});break;}
  }
});

  return `<svg viewBox="0 0 ${W} ${H}" width="${size}" height="${Math.round(size*H/W)}" aria-hidden="true"><path d="M0 ${wl+3} q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 V${H} H0Z" fill="#1f8fb3" opacity=".55"/>${g}</svg>`;
}
function isGreat(i){const st=stationsOf(i).filter(x=>x.scored);if(!st.length)return false;const b=S.progress.best[i.id]||{};if(st.some(x=>b[x.k]==null))return false;return st.reduce((n,x)=>n+b[x.k],0)/st.length>=85}
const fleetOn=()=>(THEME()==='sea'||THEME()==='desert')&&!!S.profile;
function fleetState(){const F=FLEETS();const q=allIslands().filter(isGreat).length;const lv=Math.min(F.length-1,Math.floor(q/5));return {q,lv,next:lv>=F.length-1?0:5-(q%5),inStep:q%5}}
function fleetCardHTML(){if(!fleetOn())return '';const f=fleetState();const F=FLEETS();const b=F[f.lv];
  return `<button class="fleetcard" data-act="fleet">${vehSVG(f.lv,72)}<span class="ft"><b>${esc(fullName(b))} <small style="direction:ltr;display:inline-block">${esc(b.en)}</small></b><span>${f.lv>=F.length-1?(THEME()==='desert'?'הגעת לרכב המטורף ביותר! 🏆':'הגעת לספינה הגדולה ביותר! 🏆'):`עוד <b>${f.next}</b> ${f.next===1?(THEME()==='desert'?'נווה מדבר מצוין':'אי מצוין'):(THEME()==='desert'?'נווי מדבר מצוינים':'איים מצוינים')} לשדרוג`}</span><span class="fdots">${[0,1,2,3,4].map(k=>`<i class="${k<f.inStep?'on':''}"></i>`).join('')}</span></span><span class="flv">${f.lv+1}/20</span></button>`}
function checkFleet(){if(!fleetOn()||isParent()||!S.loaded)return;const p=S.progress;const f=fleetState();
  const fk=THEME()==='desert'?'caravanIntro':'fleetIntro';if(!p[fk]&&!S.boatModal){S.boatModal={kind:'intro'};return}
  if((p.boatLevel||0)<f.lv&&!S.boatModal){S.boatModal={kind:'up',lv:f.lv};p.boatLevel=f.lv;saveState('progress');setTimeout(()=>{sfx.horn();setTimeout(()=>sfx.win(),700)},200)}}
function boatModalHTML(){const m=S.boatModal;if(!m)return '';
  if(m.kind==='intro'&&THEME()==='desert')return `<div class="cfwrap bm" role="dialog" aria-modal="true"><div class="cfbox boatbox"><div class="bpop">${desertSVG(0,200)}</div><h3>יוביק והגמל הצעיר</h3>
    <p>יוביק נחתה בלב המדבר הגדול. בצל עץ דקל חיכה לה גמל צעיר וסקרן, עם דבשת אחת ועיניים גדולות.</p>
    <p>מתוך אוהל גדול יצא שייח' אל־כַּלִמָאת, שייח' המילים. "כל <b>5 נווי מדבר</b> שתסיימי <b>מצוין</b>, כל התחנות ב־85% ומעלה," הוא אמר, "ואתן לך כלי רכיבה חזק יותר."</p>
    <p>20 כלים מחכים לך, מגמל צעיר ועד <b>רכב שטח מפלצתי</b>. ובכל רגע אפשר לפתוח את טבלת האותיות והמספרים בכפתור 🔤 למעלה. מוכנה לרכוב?</p>
    <div class="btns"><button class="btn brass" data-act="bmClose">יאללה, רוכבים! 🐪</button><button class="btn ghost" data-act="fleet">לראות את כל השיירה</button></div></div></div>`;
  if(m.kind==='intro')return `<div class="cfwrap bm" role="dialog" aria-modal="true"><div class="cfbox boatbox"><div class="bpop">${boatSVG(0,200)}</div><h3>יוביק והרפסודה הקטנה</h3>
    <p>ביום סוער אחד נסחפה יוביק אל חוף של אי קטן. כל מה שנשאר לה זה רפסודה: כמה בולי עץ, חבל אחד ומפרש מחולצה ישנה.</p>
    <p>על הרציף חיכה לה הקפטן הזקן של הנמל, Captain Words. "יש לי הצעה בשבילך," הוא חייך. "על כל <b>5 איים</b> שתסיימי <b>מצוין</b>, כל התחנות ב־85% ומעלה, אתן לך כלי שייט גדול יותר."</p>
    <p>20 כלי שייט מחכים בנמל, מרפסודה ועד ספינת התענוגות הענקית <b class="en">Queen of English</b>. מוכנה להפליג?</p>
    <div class="btns"><button class="btn brass" data-act="bmClose">יאללה, מפליגים! ⛵</button><button class="btn ghost" data-act="fleet">לראות את כל הצי</button></div></div></div>`;
  if(m.kind==='up'){const b=FLEETS()[m.lv];const ds=THEME()==='desert';return `<div class="cfwrap bm" role="dialog" aria-modal="true"><div class="cfbox boatbox"><div class="confetti">🎉✨🎊</div><div class="bpop">${vehSVG(m.lv,220)}</div><h3>שדרוג! ${ds?'כלי רכיבה':'כלי שייט'} חדש: ${esc(fullName(b))}</h3><p style="margin:0;color:var(--ink2);text-align:center;direction:ltr">${esc(b.en)} · ${m.lv+1}/20</p><p>${ds?"שייח' אל־כלמאת":'Captain Words'}: "${esc(b.story)}"</p><div class="btns"><button class="btn brass" data-act="bmClose">ממשיכים להפליג!</button></div></div></div>`}
  if(m.kind==='fleet'){const f=fleetState();const ds=THEME()==='desert';return `<div class="cfwrap bm" role="dialog" aria-modal="true"><div class="cfbox boatbox fleetbox"><h3>${ds?'השיירה':'הצי'} של יוביק · ${f.lv+1}/20</h3><p class="sub" style="margin:0">כל 5 ${ds?'נווי מדבר':'איים'} מצוינים (כל התחנות, ממוצע 85%+) משדרגים את ${ds?'כלי הרכיבה':'כלי השייט'}.</p>
    <div class="fleetgrid">${FLEETS().map((b,k)=>`<div class="fitem ${k<=f.lv?'own':'lock'} ${k===f.lv?'cur':''}">${vehSVG(k,96)}<b>${k<=f.lv||k===f.lv+1?esc(b.n):'?'}</b>${k<=f.lv||k===f.lv+1?`<small>"${esc(b.nick)}"</small>`:''}<small>${k*5} איים</small></div>`).join('')}</div>
    <div class="btns"><button class="btn brass" data-act="bmClose">סגירה</button></div></div></div>`}
  return ''}

/* ============ NAVIGATION: back button, exit confirmation ============ */
function stopAll(){kRun++;clearTimeout(kTimer);hush();const sc=S.screen;try{sc&&sc.stop&&sc.stop()}catch(e){}try{SR&&SR.stop()}catch(e){}try{CO_R&&CO_R.stop()}catch(e){}}
function inProgress(sc){if(!sc||S.tab!=='map')return false;switch(sc.name){
  case 'game':return sc.idx>0||!!sc.answered||sc.found>0||sc.mistakes>0||sc.next>0;
  case 'spell':return sc.idx>0||sc.built.length>0;
  case 'quiz':case 'sounds':case 'fix':return sc.idx>0||!!sc.answered;
  case 'read2':return sc.idx>0||!!sc.res;
  case 'readtext':return sc.res.some(Boolean)||!!sc.listening;
  case 'unseen':return sc.answers.some(x=>x!=null);
  case 'readaloud':return sc.idx>0;}return false}
function navTo(t,force){
  if(!force&&inProgress(S.screen)){S.confirm=t;render();return}
  S.confirm=null;stopAll();
  if(t.act==='home'){S.screen={name:'map'};S.tab='map'}
  else if(t.act==='island'){const id=t.id||S.screen.id;S.tab='map';S.screen=id?{name:'island',id}:{name:'map'};markSeen(id)}
  render();scrollTo({top:0});
}
function confirmHTML(){return `<div class="cfwrap" role="dialog" aria-modal="true"><div class="cfbox"><h3>לצאת באמצע?</h3><p>ההתקדמות בתרגיל הזה לא תישמר. אפשר להמשיך מאיפה שהפסקת.</p><div class="btns"><button class="btn brass" data-act="cfStay">להמשיך לתרגל</button><button class="btn ghost" data-act="cfGo">לצאת</button></div></div></div>`}
function goBack(){
  if(S.confirm){S.confirm=null;render();return true}
  if(S.relink&&KEY){S.relink=false;render();return true}
  if(S.tab!=='map'){stopAll();S.tab='map';render();scrollTo({top:0});return true}
  const sc=S.screen;if(!sc||sc.name==='map')return false;
  if(sc.name==='island')navTo({act:'home'});else navTo({act:'island',id:sc.id});
  return true;
}
const atRoot=()=>S.tab==='map'&&(!S.screen||S.screen.name==='map')&&!S.confirm&&!S.relink;
function armBack(){if(!atRoot()&&!(history.state&&history.state.app)){try{history.pushState({app:1},'')}catch(e){}}}
addEventListener('popstate',()=>{if(!goBack())return;armBack()});
/* 5 לחיצות מהירות על האייקון שבכותרת: החלפת קישור (למשל מעבר לקישור הורה) */
let logoTaps=[];document.querySelector('.brand img').addEventListener('click',()=>{const t=Date.now();logoTaps=logoTaps.filter(x=>t-x<2500);logoTaps.push(t);if(logoTaps.length>=5){logoTaps=[];S.relink=true;render()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('isl')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{if(e.target.id==='calTT'||e.target.id==='calEX'){const f=e.target.files[0];const note=e.target.dataset.note;e.target.value='';if(f)calPhoto(f,note);return}
  if(e.target.id==='fileIn'){const files=[...e.target.files];e.target.value='';if(files.length)addFiles(files);return}
  if(e.target.id==='camIn'||e.target.id==='galIn'){const files=[...e.target.files];e.target.value='';if(files.length)addShots(files)}});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  if(f.dataset.form==='key'){
    const k=keyFromText($('#keyIn').value);if(!k){toast('הקישור לא נראה נכון. העתיקי את כולו, כולל הסוף אחרי #k=');return}
    KEY=k;LS.set('key',KEY);S.badKey=false;S.relink=false;outbox={};LS.set('outbox',outbox);
    render();loadAll();return;
  }
  if(f.dataset.form==='exam'){
    const date=$('#exD').value,subject=$('#exS').value.trim(),note=$('#exN').value.trim();if(!date||!subject)return;
    const c=editableSchedule();c.exams=c.exams||[];c.exams.push({id:uid('e'),date,subject,note});saveSchedule();sfx.ok();toast('המבחן נוסף');return;
  }
  if(f.dataset.form==='lesson'){
    const k=+f.dataset.k;const c=editableSchedule();const di=S.calDay!=null?S.calDay:(new Date().getDay()<=4?new Date().getDay():0);
    while(c.days.length<=di)c.days.push({d:DAY_NAMES[c.days.length],l:[]});
    const subj=$('#lsS').value.trim();c.days[di].l[k]=subj?{s:subj,t:$('#lsT').value.trim(),r:$('#lsR').value.trim()}:null;
    S.editLesson=null;saveSchedule();toast('השיעור עודכן');return;
  }
  if(f.dataset.form==='word'){
    const en=$('#wEn').value.trim(),he=$('#wHe').value.trim(),ex=$('#wEx').value.trim();if(!en||!he)return;
    S.classWords.push({id:uid('w'),en,he,ex,added:Date.now()});saveState('classwords');sfx.ok();toast('המילה נוספה');render();
  }else if(f.dataset.form==='zoom'){
    const z={id:uid('z'),date:$('#zDate').value,time:$('#zTime').value,teacher:$('#zTeacher').value.trim(),link:$('#zLink').value.trim(),done:false,notes:'',recs:[]};
    if(!z.date)return;S.zoom.push(z);saveState('zoom');sfx.ok();toast('השיעור נשמר');render();
  }else if(f.dataset.form==='znotes'){
    const z=S.zoom.find(x=>x.id===f.dataset.id);if(!z)return;z.notes=(f.querySelector('input').value||'').trim();if(!z.notes)return;saveState('zoom');toast('נשמר');render();
  }else if(f.dataset.form==='paste'){
    const t=($('#pasteIn').value||'').trim();if(!t){toast('אין מה לשלוח');return}const zm=zoomMeta('pasteZoom');if(!zm){toast('בחרי למה זה שייך');return}
    const blob=new Blob([t],{type:'text/plain'});const id=uid('f');
    S.shots.push({id,blob,name:'טקסט שהודבק.txt',file:true,status:'wait'});queueUpload({id,kind:'file',blob,meta:{note:'טקסט שהודבק',name:'טקסט שהודבק.txt',...zm}});
    sfx.ok();toast('נשלח לדרייב');render();
  }else if(f.dataset.form==='shots'){
    const note=($('#shotNote')?.value||'').trim();const zm=zoomMeta('shotZoom');if(!zm){toast('בחרי למה זה שייך');return}
    S.shots.filter(s=>s.status==='new').forEach(s=>{s.status='wait';queueUpload({id:s.id,kind:s.file?'file':'photo',blob:s.blob,meta:s.file?{note,name:s.name,...zm}:{note,...zm}})});
    sfx.ok();toast('הצילומים נשלחים לדרייב');render();
  }
});

/* ============ START ============ */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
loadAll();
</script>
