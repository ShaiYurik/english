/* Layout: one-column phone app — a sea chart map of islands as levels, chart-paper cards for exercises, rope-and-brass details. Single committed dark-sea look. */
:root{
  color-scheme: dark;
  --abyss:#0a1a29; --sea:#10304a; --sea2:#174260; --swell:#22587c;
  --chart:#eef2ea; --chart2:#dfe7dc; --ink:#0f2233; --ink2:#41586b;

  --foam:#d9e7ee; --muted:#86a2b6;

  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-en:"Alegreya",Georgia,"Times New Roman",serif;

}
:root[data-theme="tennis"]{
  --abyss:#0b2147; --sea:#1d56a8; --sea2:#2766c0; --swell:#3d7fd8;
  --chart:#f6f8f1; --chart2:#e6eddc; --ink:#13213a; --ink2:#44546c;
  --brass:#cfe83a; --brass2:#ecf98f; --signal:#e0663a; --kelp:#2f9e5b; --kelp2:#dcf2e3; --redsoft:#fbe0d4;
  --foam:#e4ecf7; --muted:#9db3d1;
}
:root[data-theme="desert"]{
  --abyss:#3a2414; --sea:#8a5a2b; --sea2:#a86d36; --swell:#c28a4a;
  --chart:#fbf3e4; --chart2:#f1e2c6; --ink:#3a2414; --ink2:#6e4e2f;
  --brass:#f2a93b; --brass2:#ffd78a; --signal:#d8572a; --kelp:#2f8a63; --kelp2:#dcefe0; --redsoft:#f8dccd;
  --foam:#fff3dd; --muted:#e0c49a;
}
:root[data-theme="shop"]{
  --abyss:#2b1830; --sea:#a8336a; --sea2:#c24a82; --swell:#e07aa8;
  --chart:#fff6f9; --chart2:#fbe4ee; --ink:#2b1830; --ink2:#6e4a63;
  --brass:#f2b94a; --brass2:#ffd98c; --signal:#e0395f; --kelp:#2f9468; --kelp2:#dcf3e8; --redsoft:#fcdde4;
  --foam:#fff4f8; --muted:#e9bfd3;
}
:root[data-theme="dance"]{
  --abyss:#160d2e; --sea:#5b2a9e; --sea2:#7a3cc4; --swell:#b07ae8;
  --chart:#fbf6ff; --chart2:#efe3ff; --ink:#1f1238; --ink2:#5e4b7c;
  --brass:#ffcf4a; --brass2:#ffe9a3; --signal:#ff4f9a; --kelp:#2fae7f; --kelp2:#dcf6ea; --redsoft:#ffe0ef;

}
:root[data-theme="dance"] body{background-image:radial-gradient(ellipse at 30% 0%,#ff6fb5 0%,transparent 45%),radial-gradient(ellipse at 80% 5%,#7a5cff 0%,transparent 40%),linear-gradient(180deg,#3a1d6e 0%,#1d1040 55%,#120a26 100%)}
.dancecard{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--swell);background:linear-gradient(135deg,#5b2a9e,#1d1040);color:var(--foam);border-radius:var(--r);padding:8px 12px;font:inherit;text-align:start}
.dancecard b{color:var(--brass2);font-size:18px}.dancecard.dempty{margin-top:10px;background:linear-gradient(135deg,#ff5fa8,#7b3fe4);border-color:#ff9fd0}.dancecard.dempty b{color:#fff}.dancecard.dempty small{color:#ffe3f1}.dancecard .de{font-size:40px;flex:none;padding:0 6px}.dsteps{display:flex;justify-content:center;gap:6px;margin-bottom:6px}.dsteps i{width:8px;height:8px;border-radius:50%;background:#d9cdea}.dsteps i.on{background:#c13fe0;width:22px;border-radius:4px}.dsteps i.done{background:#e8a6ff}.dlist{text-align:right;margin:6px 0;padding-inline-start:22px;display:grid;gap:8px;line-height:1.5}.dlist li::marker{color:#c13fe0;font-weight:800}.kb{display:inline-block}.dancecard .ft{display:grid;gap:2px;flex:1}.dancecard small{color:var(--muted);font-weight:600}.dancecard svg{flex:none}
.dlv{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:#f3eefb;text-align:start;opacity:.55}.dlv.got{opacity:1;background:#efe3ff}.dlv.cur{outline:2px solid #ffcf4a}.dlv>span:first-child{font-size:26px;width:36px;text-align:center}.dlv small{display:block;color:var(--ink2)}
:root[data-theme="shop"] body{background-image:linear-gradient(180deg,#f3a6c4 0%,#a8336a 40%,#2b1830 85%)}
.mallcard{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--swell);background:linear-gradient(135deg,var(--sea),var(--abyss));color:var(--foam);border-radius:var(--r);padding:10px 12px;font:inherit;text-align:start}
.mallcard .mw{font-size:40px;line-height:1}.mallcard b{color:var(--brass2);font-size:18px}.mallcard .ft{display:grid;gap:2px;flex:1}.mallcard small{color:var(--muted);font-weight:600}
.mallbox{max-height:84vh;overflow:auto;text-align:start}.mallbox h3{margin:0}
.mtabs{display:flex;gap:6px;flex-wrap:wrap}.mtabs button{border:1px solid var(--swell);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700}.mtabs button.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:8px}.store{border:0;border-radius:12px;padding:0;overflow:hidden;background:#fff;box-shadow:0 2px 8px -4px rgba(0,0,0,.35);font:inherit;color:var(--ink)}
.store .aw{height:14px;background:repeating-linear-gradient(90deg,var(--sc) 0 12px,#fff 12px 24px)}.store .sn{display:block;font-weight:900;letter-spacing:.06em;font-size:17px;padding:8px 6px 2px;direction:ltr}.store .sx{display:block;font-size:12px;color:var(--ink2);padding:0 6px 8px}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#fff;border-radius:12px;padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;box-shadow:0 2px 8px -5px rgba(0,0,0,.35)}
.item .ie{font-size:42px;line-height:1.1}.item .ip{font-weight:800;color:var(--sea)}.item .ip s{color:var(--ink2);font-weight:600}.item button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:6px 12px;background:var(--brass);color:var(--ink)}.item button[disabled]{background:#eee;color:#999}.item.own{outline:2px solid var(--kelp)}
.coupon{display:flex;align-items:center;gap:10px;border:2px dashed var(--sea);border-radius:12px;padding:8px 12px;background:#fff}.coupon b{font-size:20px;color:var(--sea)}.coupon.used{opacity:.45}
.closet{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.closet div{background:#fff;border-radius:10px;text-align:center;padding:6px 2px;font-size:30px}.closet small{display:block;font-size:10px;color:var(--ink2)}
.wallet{font-weight:900;color:var(--sea);font-size:20px}
:root[data-theme="desert"] body{background-image:linear-gradient(180deg,#f0b35a 0%,#a86d36 35%,#3a2414 80%)}
:root[data-lang="ar"] .en{font-family:"Noto Naskh Arabic","Amiri","Geeza Pro",serif;direction:rtl;unicode-bidi:isolate}
:root[data-lang="ar"] .read,:root[data-lang="ar"] .opt.en,:root[data-lang="ar"] .qblock .q{direction:rtl;text-align:right}

.tr{color:var(--ink2);font-size:18px;margin-top:-4px}
.worldsw .refbtn{background:var(--chart);color:var(--ink);border-color:var(--chart)}
.refgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.refcell{border:0;background:var(--chart2);border-radius:10px;padding:6px 2px;display:grid;justify-items:center;gap:0;font:inherit;color:var(--ink)}
.refcell .ar{font-family:"Noto Naskh Arabic",serif;font-size:34px;line-height:1.2}
.refcell .he{font-weight:800;font-size:18px}.refcell small{color:var(--ink2);font-size:11px}
.refcell .forms{font-family:"Noto Naskh Arabic",serif;font-size:15px;direction:rtl;color:var(--ink2)}
.reftabs{display:flex;gap:6px;justify-content:center}.reftabs button{font:inherit;font-weight:800;border-radius:999px;border:1px solid var(--swell);padding:6px 14px;background:transparent;color:var(--ink)}.reftabs button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass)}
.numrow{display:grid;grid-template-columns:52px 40px 1fr 1fr;align-items:center;gap:8px;border:0;background:var(--chart2);border-radius:10px;padding:6px 10px;font:inherit;color:var(--ink);width:100%;text-align:start}
.numrow .ar{font-family:"Noto Naskh Arabic",serif;font-size:28px}
:root[data-theme="tennis"] body{background-image:linear-gradient(180deg,#1d56a8 0%,#0b2147 75%)}
*{box-sizing:border-box}
html,body{min-height:100%}
html{padding-top:env(safe-area-inset-top,0px)}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(120% 60% at 50% 0%, var(--sea) 0%, var(--abyss) 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--abyss)}
[hidden]{display:none!important}

#app{max-width:560px;margin:0 auto;padding-block:12px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
:root[data-ilang="he"] .en,:root[data-ilang="he"] .gap,:root[data-ilang="he"] .opt.en,:root[data-ilang="he"] .read,:root[data-ilang="he"] .qblock .q,:root[data-ilang="he"] .chip{font-family:inherit;direction:rtl;text-align:right}:root[data-ilang="he"] .opt.en{text-align:center}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px}

.topbtns{display:flex;gap:8px;align-items:center}.fontbtn{font-family:inherit;color:inherit;line-height:1}.fontbtn b{font-size:20px;font-weight:900}.fontbtn small{font-size:13px;font-weight:900;margin-top:-6px}.fontbtn{display:flex;gap:1px;align-items:center;justify-content:center}#fontBtn[aria-pressed="false"]{opacity:1}#fontBtn[aria-pressed="true"]{background:#f0c35e;color:#1a1206;border-color:#f0c35e}

.map{background:var(--sea);border-radius:var(--r);overflow:hidden;border:1px solid var(--swell)}

.isl{cursor:pointer}

.flv{font-weight:800;color:var(--brass);font-size:14px}

.eb{font-size:18px}.nowb{font-size:11px;font-weight:800;background:var(--kelp);color:#fff;border-radius:999px;padding:2px 8px}
.lform{background:#fff;border-radius:12px;padding:10px}
.exlist{display:grid;gap:6px}
.exrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px}

.exn{font-size:13px;font-weight:700;color:var(--sea2);white-space:nowrap}
.xbtn{border:0;background:var(--chart2);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;color:var(--ink)}
details summary{cursor:pointer;padding:6px 0}
.shelf{background:var(--sea);border:1px solid var(--swell);border-radius:var(--r);padding:10px 14px;color:var(--chart)}

.tab .badge{position:absolute;top:0;inset-inline-end:14%;min-width:18px;height:18px;border-radius:9px;background:var(--signal);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--chart);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 8px 24px -10px #000;max-width:90vw;text-align:center}

<script>
/* ============ CONNECTION ============ */
const API='https://script.google.com/macros/s/AKfycbxLlbEJozfMjmGyQZeeJm0lXCW-NhjTsNaQ7UPCaaQ8qAqmo_yee2h7FEY4LW1IIXWJ4g/exec';
/* חומר בעיבוד: מה נשלח ועוד לא הפך לאי (נמחק כשהדרייב ריק מחומר שממתין) */
const PRK=()=>'proc:'+(((typeof S!=='undefined'&&S.profile&&S.profile.child)||CHILD)||'');
function procAdd(tag){const m=/subject:(.+)$/.exec(String(tag||''));const a=LS.get(PRK(),[]).filter(x=>Date.now()-x.t<4*864e5);a.push({s:m?m[1].trim():'',t:Date.now()});LS.set(PRK(),a.slice(-30))}
function procList(){if(!S.pendingPhotos)return [];return LS.get(PRK(),[]).filter(x=>Date.now()-x.t<4*864e5)}
function procSubjects(){return [...new Set(procList().map(x=>x.s||''))]}
function procBannerHTML(){if(isParent()||!S.pendingPhotos)return '';const subs=procSubjects().filter(Boolean);const n=S.pendingPhotos;
  return `<div class="newbanner procb"><span class="gift">⏳</span><span>${SHL()?'הריקוד החדש שלך בהכנה!':'החומר ששלחת בעיבוד'}<small>${n===1?'קובץ אחד מחכה':n+' קבצים מחכים'}${subs.length?' · '+subs.map(esc).join(', '):''} · ${SHL()?'כשהוא מוכן הוא יופיע בסטודיו 💃':'כשהוא מוכן הוא יופיע כאי חדש במפה'}</small></span></div>`}
function SHL(){return !!(typeof S!=='undefined'&&S.profile&&S.profile.child==='shaili')}
const LS={get(k,d){try{const v=localStorage.getItem('voy:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('voy:'+k,JSON.stringify(v))}catch(e){}}};
let KEY=LS.get('key','');
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
// בדפדפן משאירים את המפתח בכתובת, כדי ש"הוסף למסך הבית" באייפון ישמור אותו גם לאפליקציה
function readKey(){const m=location.hash.match(/k=([A-Za-z0-9_-]+)/);if(m){KEY=m[1];LS.set('key',KEY);if(STANDALONE)history.replaceState(null,'',location.pathname+location.search);return true}return false}
function keyFromText(t){const m=String(t||'').match(/k=([A-Za-z0-9_-]{10,})/)||String(t||'').trim().match(/^([A-Za-z0-9_-]{10,})$/);return m?m[1]:''}
readKey();
addEventListener('online',()=>{if(KEY&&S.online===false&&!S._inflight)loadAll()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!KEY||S._inflight)return;if(S.online===false||Date.now()-CONN.okAt>5*60e3)loadAll()});
addEventListener('hashchange',()=>{if(readKey()){S.badKey=false;loadAll()}});

let CHILD=LS.get('child','');
let WORLD=LS.get('world:'+(CHILD||'yuvik'),'en');
const WP=()=>WORLD!=='en'&&WORLD!=='math'?WORLD:undefined;
const NS=()=>(CHILD&&CHILD!=='yuvik'?CHILD+':':'')+(WORLD!=='en'&&WORLD!=='math'?WORLD+':':'');  // חשבון חולק את הנתונים של אנגלית
const cacheKey=()=>NS()?'cache:'+NS():'cache';
const APP_VERSION='58';
/* ---- עדכון אפליקציה: status.json באתר. updating=true מציג הודעה; version חדש = רענון כשלא באמצע תרגיל ---- */
let UPD={updating:false,ver:null,pendingReload:false};
async function checkStatus(){if(!/^https?:$/.test(location.protocol))return;try{const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
  UPD.updating=!!j.updating;UPD.msg=j.msg||'';UPD.ver=j.version||null;UPD.pendingReload=!!(UPD.ver&&String(UPD.ver)!==APP_VERSION&&!UPD.updating&&LS.get('reloadedFor','')!==String(UPD.ver));showUpd();maybeReload()}catch(e){}}
function showUpd(){let el=document.getElementById('updBanner');if(!el){el=document.createElement('div');el.id='updBanner';el.className='updbanner';document.body.appendChild(el)}
  el.hidden=!(UPD.updating||UPD.pendingReload);el.innerHTML=UPD.updating?`⏳ האפליקציה מתעדכנת עכשיו. אפשר להמשיך בעוד דקה-שתיים, ומה שעשית נשמר.${UPD.msg?`<small>${esc(UPD.msg)}</small>`:''}`:UPD.pendingReload?'✨ יש גרסה חדשה. היא תיטען כשתסיימי את התרגיל.':''}
function maybeReload(){if(UPD.pendingReload&&!inProgress(S.screen)&&!(S.screen&&['game','spell','quiz','sounds','fix','read2','readtext'].includes(S.screen.name))){UPD.pendingReload=false;LS.set('reloadedFor',String(UPD.ver));flush&&flush();setTimeout(()=>location.reload(),300)}}
setInterval(()=>{if(document.visibilityState==='visible')checkStatus()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkStatus()});
/* ---- תזכורות בטלפון (Web Push) ---- */
const VAPID_PUB='BBR4fkFfpsYjeBt2gwMCR-f8Uo7xR7Eao2UVjioVPr4f7Q7ysexQZKy707C-etOaB7fGALonLbWB_i9Mb8DCzMU';
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&window.isSecureContext;
function u8b64(b){const p='='.repeat((4-b.length%4)%4);const raw=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function notifPrefs(){try{const c=await caches.open('notif');const nm=(S.profile&&S.profile.name)||'';await c.put('name',new Response(nm));await c.put('icon',new Response(({gil:'./icon-gil-192.png',ariel:'./icon-ariel-192.png',shaili:'./icon-shaili-192.png'})[(S.profile&&S.profile.child)||CHILD]||'./icon-192.png'));await c.put('api',new Response(JSON.stringify({api:API,key:KEY})))}catch(e){}}
async function enablePush(){if(!pushOK()){toast('בטלפון הזה אין תמיכה בתזכורות. באייפון: צריך להתקין את האפליקציה למסך הבית.');return}
  try{const perm=await Notification.requestPermission();if(perm!=='granted'){LS.set('pushOff',1);toast('התזכורות לא הופעלו. אפשר להפעיל אחר כך בהגדרות הדפדפן.');render();return}
    await notifPrefs();const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8b64(VAPID_PUB)});
    LS.set('pushOn',1);render();toast('🔔 התזכורת הופעלה! ראשון עד חמישי ב-18:00');
    const old=LS.get('pushEp','');await apiPost({action:'pushSub',sub:sub.toJSON(),old:old&&old!==sub.endpoint?old:undefined,ua:navigator.userAgent.slice(0,60)});LS.set('pushEp',sub.endpoint)}
  catch(e){console.warn(e);toast('לא הצלחנו להפעיל תזכורות: '+String(e&&e.message||e).slice(0,60))}}
async function syncPush(){if(!pushOK()||isParent()||Notification.permission!=='granted')return;try{await notifPrefs();const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)return;
  LS.set('pushOn',1);const old=LS.get('pushEp','');if(old!==sub.endpoint){await apiPost({action:'pushSub',sub:sub.toJSON(),old:old||undefined,ua:navigator.userAgent.slice(0,60)});LS.set('pushEp',sub.endpoint)}}catch(e){}}
function pushCardHTML(){if(isParent()||!pushOK()||LS.get('pushOff',0)||(Notification.permission==='granted'&&LS.get('pushOn',0)))return '';
  return `<button class="newbanner late" data-act="pushOn"><span class="gift">🔔</span><span>תזכורת יומית לתרגול<small>ראשון עד חמישי ב-18:00</small></span><span class="go">להפעיל</span></button>`}
const CONN={fails:0,okAt:0,ch:'',lastErr:''};const zz=ms=>new Promise(r=>setTimeout(r,ms));
async function withTO(fn,ms){const ac=window.AbortController?new AbortController():null;const tm=ac&&setTimeout(()=>ac.abort(),ms);try{return await fn(ac)}finally{clearTimeout(tm)}}
async function apiLoadPost(ac){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,c:CHILD||undefined,w:WP(),action:'load',diag:CONN.fails||CONN.lastErr?{fails:CONN.fails,err:CONN.lastErr,ua:navigator.userAgent.slice(0,90)}:undefined}),signal:ac?ac.signal:undefined});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');if(!j.state)throw new Error('no state');return j}
async function apiGet(){const tries=[['post',apiLoadPost],['get',apiGet_],['post',apiLoadPost]];let last;
  for(let i=0;i<tries.length;i++){const [ch,fn]=tries[i];try{const j=await withTO(fn,30000);CONN.ch=ch;CONN.okAt=Date.now();CONN.fails=0;CONN.lastErr='';return j}
    catch(e){last=e;if(/bad key/.test(e&&e.message))throw e;CONN.lastErr=ch+': '+String(e&&e.message||e).slice(0,80);if(i<tries.length-1)await zz(i?3000:400)}}
  CONN.fails++;throw last}
async function apiGet_(ac){const r=await fetch(API+'?key='+encodeURIComponent(KEY)+(CHILD?'&c='+encodeURIComponent(CHILD):'')+(WP()?'&w='+encodeURIComponent(WP()):'')+'&t='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');return j}
async function apiPost(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:KEY,c:CHILD||undefined,w:WP(),...body})});const j=await r.json();if(!j.ok)throw new Error(j.error||'שגיאה');return j}

/* outbox: latest version of each state doc, sent when online */
let outbox=LS.get('outbox',{});for(const k of Object.keys(outbox))if(/(^|:)math:state:/.test(k))delete outbox[k];let flushing=false,flushTimer=null;
function enqueue(id,body){body={c:CHILD||undefined,w:WP(),...body};id=NS()+id;outbox[id]=body;LS.set('outbox',outbox);setSync();clearTimeout(flushTimer);flushTimer=setTimeout(flush,1500)}
async function flush(){
  if(flushing||!KEY)return;flushing=true;
  try{
    for(const id of Object.keys(outbox)){
      const body=outbox[id];
      try{await apiPost(body);if(outbox[id]===body){delete outbox[id];LS.set('outbox',outbox)}}
      catch(e){console.warn('sync',e);
        if(/not allowed|bad state/.test(e.message)){delete outbox[id];LS.set('outbox',outbox);continue}
        if(/bad key/.test(e.message)){S.badKey=true}break}
    }
  }finally{flushing=false;setSync()}
}
setInterval(()=>{flush();flushUploads()},60000);
addEventListener('online',()=>{flush();flushUploads()});

/* upload queue in IndexedDB, so a recording is never lost */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('voyage',1);r.onupgradeneeded=()=>r.result.createObjectStore('up',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('up',mode);const st=t.objectStore('up');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
  put(o){return this.tx('readwrite',s=>s.put(o))},
  del(id){return this.tx('readwrite',s=>s.delete(id))},
  all(){return this.tx('readonly',s=>s.getAll())}
};
let upBusy=false;const upStatus={};
function blobToB64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)})}
async function queueUpload(item){item.meta={c:CHILD||undefined,w:WP(),...(item.meta||{})};try{await IDB.put(item)}catch(e){console.warn(e)}upStatus[item.id]='wait';flushUploads()}
async function flushUploads(){
  if(upBusy||!KEY)return;upBusy=true;
  try{
    let items=[];try{items=await IDB.all()}catch(e){}
    for(const it of items){
      upStatus[it.id]='up';refreshUploadUI();
      try{
        const b64=await blobToB64(it.blob);

function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function buildVocabQuiz(i,n=10){
  const words=i.words;const pool=[];allIslands().forEach(x=>pool.push(...x.words));
  const order=shuffle([...shuffle(words),...shuffle(words)]).slice(0,Math.min(n,words.length*2));
  return order.map((w,k)=>{
    const others=shuffle(words.filter(x=>x.en!==w.en));
    let guard=0;while(others.length<3&&guard++<50){const r=pool[Math.floor(Math.random()*pool.length)];if(r&&r.en!==w.en&&r.he!==w.he&&!others.some(o=>o.en===r.en))others.push(r)}
    const distract=others.slice(0,3);
    const form=w.form||w.en;
    const re=new RegExp('\\b'+reEsc(form)+'\\b','i');
    const canGap=w.ex&&re.test(w.ex);
    const types=['en2he','he2en','listen'];if(canGap)types.push('gap','gap');
    const t=types[(k+Math.floor(Math.random()*types.length))%types.length];
    if(t==='en2he') return {t,word:w.en,prompt:`מה הפירוש של <span class="en">${esc(w.en)}</span>?`,say:w.en,opts:shuffle([w,...distract]).map(x=>x.he),ans:w.he,en:false};
    if(t==='he2en') return {t,word:w.en,prompt:`איך אומרים ב${LANG()==='ar'?'ערבית':'אנגלית'}: <b>${esc(w.he)}</b>?`,opts:shuffle([w,...distract]).map(x=>x.en),ans:w.en,en:true};
    if(t==='listen') return {t,word:w.en,prompt:'הקשב ובחר את המילה ששמעת',say:w.en,autoSay:true,opts:shuffle([w,...distract]).map(x=>x.en),ans:w.en,en:true};
    return {t:'gap',word:w.en,prompt:'השלם את המשפט',gap:esc(w.ex).replace(new RegExp('\\b'+reEsc(esc(form))+'\\b','i'),'<u></u>'),say:w.ex,opts:shuffle([w,...distract]).map(x=>x.form||x.en),ans:form,en:true};
  });
}

function finishActivity(kind,title,correct,total,missed,extra){
  const i=islandById(S.screen.id);const id=i.id;const pct=total?Math.round(correct/total*100):100;
  _trk=null;const activeBefore=activeIds();
  const ratioBefore=islandRatio(i);
  S.session.activities.push({kind,island:id,islandName:i.name,title,correct,total,at:Date.now()});
  if(tasksOf(S.session)===GOAL_T()){setTimeout(()=>{sfx.win();toast(TW('done')+GOAL_T()+' משימות היום 🎉')},900)}
  if(missed&&missed.length)S.session.missed=[...new Set([...S.session.missed,...missed])].slice(-60);
  saveSession();
  const b=S.progress.best[id]||(S.progress.best[id]={});
  if(kind==='learn')b.learn=true;else if(kind==='story')b.story=true;else if(kind==='read')b.read=true;else if(kind!=='drill')b[kind]=Math.max(b[kind]||0,pct);
  if(missed&&missed.length)b.missed=[...new Set([...missed,...(b.missed||[])])].slice(0,24);
  if(i.kind==='daily'&&kind==='story'){const D=S.progress.daily||(S.progress.daily={});const cur=D[i.storyId]||{};if(cur.doneN==null||i.part>=cur.doneN)D[i.storyId]={n:i.part,doneN:i.part,doneOn:today()}}
  if(/^g\d+$/.test(kind)&&pct===100){const n=+kind.slice(1),cnt=gameRounds(i,n).length;if(cnt>1){const rs=roundState(id,n);rs.r=((rs.r||0)+1)%cnt;rs.fresh=1}}
  S.progress.touch=S.progress.touch||{};S.progress.touch[id]=today();
  if(kind==='readtext'&&extra){b.readHist=[...(b.readHist||[]),{pct,wpm:extra.wpm,d:today()}].slice(-6)}
  const ratioAfter=islandRatio(i);const hasScored=stationsOf(i).some(x=>x.scored);
  const islandDone=!hasScored?null:(ratioAfter>=1&&ratioBefore<1)?'full':(ratioAfter>=.5&&ratioBefore<.5)?'pass':null;
  _trk=null;const fresh=activeIds().filter(x=>!activeBefore.includes(x)).map(x=>islandById(x)).filter(Boolean);
  S.progress.xp+=correct*10+(kind==='learn'?20:0);
  let unlocked=fresh.length?fresh.map(x=>x.name).join(', '):null;const idx=ISLANDS.findIndex(x=>x.id===id);
  if(kind==='quiz'&&pct>=70&&idx>-1&&idx+1===S.progress.unlocked&&idx+1<ISLANDS.length){S.progress.unlocked++;unlocked=ISLANDS[idx+1].name}
  saveState('progress');
  const retry=kind==='learn'||kind==='drill'?null:kind==='read'?'readaloud':kind;
  S.screen={name:'result',id,kind,title,correct,total,missed,unlocked,retry,islandDone,extra};
  if(unlocked||islandDone){sfx.horn();setTimeout(()=>sfx.win(),700)}else if(pct>=70)sfx.win();
  render();scrollTo({top:0});
}

const isLatinOld=s=>/[A-Za-z]/.test(s)&&!/[֐-׿]/.test(s);
const isLatin=s=>LANG()==='ar'?/[\u0600-\u06FF]/.test(s):isLatinOld(s);
const enSpan=s=>WORLD==='math'?fx(s):isLatin(s)?`<span class="en">${esc(s)}</span>`:esc(s);
function fx(s){const fr=t=>t.replace(/(\d+)\s+(\d+)\/(\d+)|(\d+)\/(\d+)/g,(m,w,n1,d1,n2,d2)=>`<span class="mx">${w?`<b>${w}</b>`:''}<span class="fr"><i>${n1||n2}</i><i>${d1||d2}</i></span></span>`);return esc(s).replace(/\d[\d \u00f7\u00d7+=\/]*\d|\d/g,r=>/[\/\u00f7\u00d7+=]/.test(r)?`<span class="mrun" dir="ltr">${fr(r.trim())}</span>${/ $/.test(r)?' ':''}`:r)}
const tx=s=>WORLD==='math'?fx(s):esc(s);
function sentencesOf(text){return String(text).replace(/\s+/g,' ').split(/(?<=[.!?])\s+(?=[A-Z"])/).map(x=>x.trim()).filter(Boolean)}
function readItems(i){
  let out=[];
  if(i.text)i.text.paras.forEach(p=>sentencesOf(p.replace(/^[A-Z][a-z]+( [A-Z][a-z]+)?:\s+/,'').replace(/^(The Classroom|The Teacher|Books and Notebooks)\.\s+/,'')).forEach(s=>out.push(s)));
  (i.dialogues||[]).forEach(d=>d.forEach(l=>out.push(l.replace(/^[A-Za-z]+:\s*/,''))));
  (i.games||[]).forEach(g=>{if(g.kind==='order')g.items.forEach(it=>it.forEach(s=>out.push(s)))});
  (i.words||[]).forEach(w=>{if(w.ex)out.push(w.ex)});
  (i.mistakes||[]).forEach(m=>out.push(m.correct));
  return [...new Set(out)].filter(s=>{const n=s.split(' ').length;return n>=3&&n<=18});
}

// סבבים: אחרי 100% בתחנה, בפעם הבאה מגיע סבב חדש מאותו סוג (מ-g.more או מקובץ roundsFor)
function gameRounds(i,n){const g=i.games[n];if(!g)return [];const extra=[];(S.lessons||[]).forEach(l=>{if(l&&l.roundsFor===i.id&&l.games&&Array.isArray(l.games[n]))extra.push(...l.games[n])});
  return [g,...(g.more||[]),...extra].map((m,k)=>k?{...g,...m,more:undefined}:g)}
function roundState(id,n){const R=S.progress.rounds||(S.progress.rounds={});const r=R[id]||(R[id]={});return r[n]||(r[n]={r:0})}
function buildGame(i,n){
  const RR=gameRounds(i,n),rs=roundState(i.id,n),ri=(rs.r||0)%RR.length;if(rs.fresh){rs.fresh=0}
  const g={...RR[ri],title:(RR[0].title||'תרגיל')+(RR.length>1?` · סבב ${ri+1}`:'')};
  if(['mc','fill','odd','pic'].includes(g.kind)){
    let items;
    if(g.kind==='mc')items=g.items.map(it=>({q:it.q,o:it.o,a:Array.isArray(it.a)?it.a:[it.a],why:it.why,say:WORLD==='math'?null:it.q}));
    else if(g.kind==='fill')items=shuffle(g.items).map(it=>({q:it.t,gap:true,o:shuffle(it.o),a:null,ans:it.a,why:it.why,say:it.t.replace('___',it.a)}));
    else if(g.kind==='odd'){const tr={};[...(i.words||[]),...WORDS_ALL()].forEach(w=>{if(w&&w.en&&w.he&&!tr[w.en.toLowerCase()])tr[w.en.toLowerCase()]=w.he});
      items=shuffle(g.items).map(it=>({q:'איזו מילה לא שייכת?',o:shuffle(it.o),ans:it.a,why:it.why,odd:true,tr:it.o.map(w=>tr[String(w).toLowerCase()]?`${w} = ${tr[String(w).toLowerCase()]}`:'').filter(Boolean).join(' · ')}))}
    else{const all=g.items.map(x=>x[1]);items=shuffle(g.items).map(([e,w])=>({pic:e,q:'מה בתמונה?',o:shuffle([w,...shuffle(all.filter(x=>x!==w)).slice(0,3)]),ans:w,say:w}))}
    items.forEach(it=>{if(it.ans!=null)it.a=[it.o.indexOf(it.ans)]});
    return {name:'game',kind:'mc',id:i.id,n,title:g.title,items,idx:0,correct:0,picked:[],answered:false,missed:[]};
  }
  if(g.kind==='tf')return {name:'game',kind:'tf',id:i.id,n,title:g.title,items:g.items,idx:0,correct:0,answered:false,missed:[]};
  if(g.kind==='sort'){const words=[];g.groups.forEach((gr,gi)=>gr.words.forEach(w=>words.push({w,gi})));return {name:'game',kind:'sort',id:i.id,n,title:g.title,groups:g.groups,items:shuffle(words),idx:0,correct:0,answered:false,missed:[]}}
  if(g.kind==='pairs'){const cards=[];shuffle(g.pairs).slice(0,6).forEach((p,pi)=>{cards.push({t:p[0],p:pi});cards.push({t:p[1],p:pi})});return {name:'game',kind:'pairs',id:i.id,n,title:g.title,cards:shuffle(cards).map((c,k)=>({...c,k,open:false,done:false})),first:null,lock:false,mistakes:0,found:0,total:cards.length/2}}
  if(g.kind==='order')return {name:'game',kind:'order',id:i.id,n,title:g.title,items:g.items,idx:0,shuf:shuffle(g.items[0].map((s,k)=>({s,k}))),next:0,err:0,correct:0,missed:[]};
}

function hintPara(i,txt){if(!i||!i.text||!i.text.paras||!i.text.paras.length)return '';const norm=w=>w.replace(/[^\u0590-\u05FFA-Za-z0-9]/g,'').toLowerCase();

function dictOfText(i){const seen=new Set(),out=[];(i.text.paras||[]).join(' ').split(/\s+/).forEach(w=>{const k=w.replace(/[\u2018\u2019]/g,"'").replace(/^[^\w']+|[^\w']+$/g,'');const lk=k.toLowerCase();

let kTimer=null,kRun=0;
function kHighlight(n){document.querySelectorAll('.kara .w.hl').forEach(x=>x.classList.remove('hl'));const el=document.getElementById('kw'+n);if(el){el.classList.add('hl');el.scrollIntoView({block:'nearest',behavior:'smooth'})}}
function kPlay(){
  if(!('speechSynthesis' in window)){toast('הטלפון לא תומך בהקראה');return}
  const sc=S.screen;const i=islandById(sc.id);const paras=i.text.paras;
  hush();clearTimeout(kTimer);const run=++kRun;const rate=SPEEDS[S.speed].rate;
  let base=0;const offsets=paras.map(p=>{const o=base;base+=p.split(' ').length;return o});
  const playPara=pi=>{
    if(run!==kRun||pi>=paras.length){kHighlight(-1);return}
    if(SPEEDS[S.speed].wbw){sayPaced(paras[pi],k=>{if(run===kRun&&k>=0)kHighlight(offsets[pi]+k)},()=>{if(run===kRun)setTimeout(()=>playPara(pi+1),500)});return}
    const words=paras[pi].split(' ');const starts=[];let c=0;words.forEach(w=>{starts.push(c);c+=w.length+1});
    const u=new SpeechSynthesisUtterance(paras[pi]);u.lang=TTS_LANG();u.rate=rate;{const vv=vox();if(vv)u.voice=vv}
    let gotB=false,wk=0;
    u.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;clearTimeout(kTimer);let k=0;while(k+1<starts.length&&starts[k+1]<=e.charIndex)k++;kHighlight(offsets[pi]+k)};
    const step=()=>{if(gotB||run!==kRun)return;if(wk<words.length){kHighlight(offsets[pi]+wk);wk++;kTimer=setTimeout(step,(300+words[wk-1].length*55)/rate)}};
    u.onstart=()=>{kTimer=setTimeout(step,120)};
    u.onend=()=>{clearTimeout(kTimer);setTimeout(()=>playPara(pi+1),250)};
    speechSynthesis.speak(u);
  };
  playPara(0);
}

/* read aloud with speech recognition */
function buildRead2(i){return {name:'read2',id:i.id,items:shuffle(readItems(i)).slice(0,6),idx:0,correct:0,res:null,listening:false,missed:[]}}
const normW=w=>LANG()==='ar'?plainW(w).replace(/[إأآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي'):w.toLowerCase().replace(/[^a-z0-9']/g,'').replace(/'/g,'');
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,x)=>[x,...Array(n).fill(0)]);for(let y=1;y<=n;y++)d[0][y]=y;for(let x=1;x<=m;x++)for(let y=1;y<=n;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));return d[m][n]}
const NUMW={'1':'one','2':'two','3':'three','10':'ten','11':'eleven','12':'twelve','14':'fourteen','15':'fifteen','27':'twentyseven'};
function matchWords(target,heard){
  const T=target.split(' ').map(normW).filter(Boolean);const H=heard.split(/\s+/).map(normW).filter(Boolean).map(w=>NUMW[w]||w);
  // p = מקום בדיבור, lastT = המילה האחרונה בטקסט שזוהתה. לא קופצים יותר מ-3 מילים קדימה בטקסט,
  // כדי שמילה נפוצה (is, the) שנאמרה בהתחלה לא "תתפוס" מילה רחוקה ותצבע באדום את כל מה שביניהן.
  let p=0,lastT=-1;return T.map((t,j)=>{if(j-lastT>4)return false;for(let k=p;k<Math.min(H.length,p+4);k++){const h=H[k];if(h===t||(t.length>=4&&lev(h,t)<=1)||(t.length===3&&h.length>=2&&lev(h,t)<=1&&h[0]===t[0])||(NUMW[t]&&NUMW[t]===h)){p=k+1;lastT=j;return true}}return false});

let RT=null;

function coachQueue(para,res){const words=rtWords(para);const q=[];res.forEach((ok,k)=>{const w=words[k].replace(LETTER_RE(),'');if(!ok&&w.length>=2)q.push(k)});return q.slice(0,8)}
function rtGo(){
  const sc=S.screen;const i=islandById(sc.id);const pi=sc.pi;const para=i.text.paras[pi];

      if(m.every(Boolean)){stopReq=true;try{RT.stop()}catch(_){}}
    };
    RT.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){stopReq=true;toast('צריך לאשר גישה למיקרופון')}};
    RT.onend=()=>{

      sc.listening=false;

        const q=coachQueue(para,best);sc.coach={pi,q,i:0,ok:0,tries:0,msg:''};
        if(!q.length){sfx.win()}else sfx.tap();

  sc.listening=true;render();start();
}

const SMALLW=new Set(['a','an','the','is','are','i','to','of','and','in','on','at','it','he','she','we','they','you','my','his','her','for','with','but','so','be','was','do']);

const REC={stream:null,rec:null,chunks:[],part:0,recId:null,zoomId:null,start:0,segStart:0,tick:null,analyser:null,buf:null,wake:null,mime:'',saved:0,pending:0};
function pickMime(){const c=['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac'];for(const m of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''}

async function startRecording(zoomId){

  catch(e){toast('צריך לאשר גישה למיקרופון כדי להקליט');return}

function startSegment(){

/* ============ CAMERA ============ */
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const max=1800;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.85));
  }catch(e){return file}finally{URL.revokeObjectURL(url)}
}
const FILE_OK=/^(application\/(pdf|msword|rtf|vnd\.ms-powerpoint|vnd\.openxmlformats-officedocument\.presentationml\.(presentation|slideshow)|vnd\.oasis\.opendocument\.presentation|vnd\.openxmlformats-officedocument\.wordprocessingml\.document|vnd\.oasis\.opendocument\.text)|text\/(plain|html|rtf)|message\/rfc822)$/;
const FILE_EXT=/\.(pdf|docx?|odt|rtf|txt|html?|eml|pptx?|ppsx?|odp)$/i;
const MAX_FILE=10*1024*1024;
/* בלי כפילויות: כל קובץ/טקסט שכבר נשלח נשמר כחתימה, ולא נשלח שוב */
const UPK=()=>'upsig:'+((S.profile&&S.profile.child)||CHILD||'');
const upSigs=()=>new Set(LS.get(UPK(),[]));
function upRemember(sig){if(!sig)return;const a=LS.get(UPK(),[]);if(!a.includes(sig)){a.push(sig);LS.set(UPK(),a.slice(-400))}}
const fileSig=f=>'f:'+f.name+':'+f.size+':'+(f.lastModified||0);
function addFiles(files){
  let n=0;const imgs=[];const seen=upSigs();S.shots.forEach(x=>x.sig&&seen.add(x.sig));let dup=0;
  files=files.filter(f=>{const g=fileSig(f);if(seen.has(g)){dup++;return false}seen.add(g);f._sig=g;return true});
  if(dup)toast(dup===1?'את הקובץ הזה כבר העלית, אין צורך שוב 🙂':dup+' קבצים כבר הועלו קודם, דילגתי עליהם 🙂');
  for(const f of files){
    if(/^image\//.test(f.type)){imgs.push(f);continue}
    if(!FILE_OK.test(f.type)&&!FILE_EXT.test(f.name)){toast('סוג קובץ לא נתמך: '+f.name);continue}
    if(f.size>MAX_FILE){toast('הקובץ גדול מ־10MB: '+f.name);continue}
    S.shots.push({id:uid('f'),blob:f,name:f.name,file:true,status:'new',sig:f._sig});n++;
  }
  if(imgs.length)addShots(imgs);else if(n){sfx.tap();render()}
}
async function addShots(files){
  for(const f of files){
    if(!/^image\//.test(f.type))continue;
    const blob=await compress(f);
    S.shots.push({id:uid('p'),blob,url:URL.createObjectURL(blob),status:'new',sig:f._sig});
  }
  sfx.shutter();render();
}

function sessSummary(s){const acts=s.activities||[];const q=acts.filter(a=>a.total&&a.kind!=='read');const c=q.reduce((n,a)=>n+a.correct,0),t=q.reduce((n,a)=>n+a.total,0);return {acts,pct:t?Math.round(c/t*100):null}}

  if(pct!=null)lines.push(`הצלחה בתרגילים: ${pct}%`);
  if(s.readOk+s.readHelp)lines.push(`קריאה בקול: ${s.readOk} משפטים לבד, ${s.readHelp} עם עזרה`);
  if(acts.length){lines.push('','מה נעשה:');acts.forEach(a=>lines.push(`• ${a.islandName} · ${a.title}${a.total&&a.kind!=='read'?` · ${a.correct}/${a.total}`:''}`))}
  else lines.push('','עוד לא תרגלו היום.');
  if(s.missed.length)lines.push('',`מילים לחזרה: ${s.missed.slice(-12).join(', ')}`);
  const al=S.progress.alerts||[];if(al.length){lines.push('','תשומת לב:');al.forEach(a=>lines.push('• '+alertText(a)))}
  S.zoom.filter(z=>(z.recs||[]).length&&(Date.now()-new Date(z.date))/864e5<8).forEach(z=>{const isl=zoomIsland(z);const tr=(S.transcripts||[]).some(t=>t.includes(z.date));lines.push('',`שיעור זום ${fmtDate(z.date)}: הוקלטו כ־${z.recs.length*5} דק׳ · ${isl?'נפתח אי: '+isl.name:tr?'תומלל, האי בהכנה':'ממתין לעיבוד'}`)});
  return lines.join('\n');
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;const sc=S.screen;
  if(a!=='answer')sfx.tap();
  switch(a){
    case 'danceAll':S.danceModal={kind:'all'};render();break;
    case 'dancePush':(async()=>{try{await enablePush()}catch(e){}if(S.danceModal){S.danceModal.pushStep=1;S.danceModal.step=(S.danceModal.step||0)+1;render()}})();break;
    case 'danceStep':if(S.danceModal){S.danceModal.step=(S.danceModal.step||0)+1;render()}break;
    case 'danceGoCam':{S.danceModal=null;if(!isParent()){S.progress.danceIntro=1;saveState('progress')}stopAll();S.tab='camera';render();scrollTo({top:0});break;}
    case 'danceClose':{const m=S.danceModal;S.danceModal=null;if(m&&m.kind==='intro'&&!isParent()){S.progress.danceIntro=1;saveState('progress')}render();break;}
    case 'mall':S.mallModal={kind:'mall',tab:el.dataset.tab||'stores'};render();break;
    case 'mallStore':S.mallModal={kind:'mall',tab:'store',store:el.dataset.id};render();break;
    case 'mallBuy':{const r=mallBuy(el.dataset.id);if(r){S.mallModal={kind:'bought',item:el.dataset.id,cp:r.cp,store:S.mallModal&&S.mallModal.store};sfx.win()}render();break;}
    case 'mallClose':{const m=S.mallModal;S.mallModal=null;if(m&&m.kind==='intro'){mallP().intro=1;saveState('progress')}render();break;}
    case 'ymStage':S.tab='map';S.screen={name:'ymStage',id:el.dataset.id};render();scrollTo({top:0});break;
    case 'ymGo':ymStart(el.dataset.id);break;
    case 'ymFleet':S.ymModal={kind:'fleet'};render();break;
    case 'ymModalClose':{const m=S.ymModal;S.ymModal=null;if(m&&m.kind==='intro'){ymP().intro=1;saveState('progress')}render();break;}
    case 'ymLv':ymStart(el.dataset.id,{lv:+el.dataset.lv});break;
    case 'ymBack':{const sc2=S.screen;navTo(sc2.mode==='stage'?{act:'ymStage',id:sc2.id}:{act:'home'});break;}
    case 'ymKey':{const sc2=S.screen;if(!sc2||sc2.name!=='ym'||sc2.state==='ok'||sc2.state==='show')break;const k=el.dataset.k;if(k==='⌫')sc2.inp=sc2.inp.slice(0,-1);else if(k==='␣')sc2.inp+=' ';else if(k===MI)sc2.inp+='-';else if(sc2.inp.length<14)sc2.inp+=k;render();break;}
    case 'ymPick':{const sc2=S.screen;if(sc2.state==='ok'||sc2.state==='show')break;sc2.pickO=+el.dataset.k;render();break;}
    case 'ymCheck':ymCheck();break;
    case 'ymHint':S.screen.showHint=true;S.screen.hinted=true;render();break;
    case 'ymNext':ymAdvance();break;
    case 'ymLearnOk':S.screen.learn=false;render();scrollTo({top:0});break;
    case 'ymLearnShow':S.screen.learn=true;render();scrollTo({top:0});break;
    case 'sound':S.sound=!S.sound;LS.set('sound',S.sound);render();break;
    case 'bigfont':{const bf=!LS.get('bigfont',false);LS.set('bigfont',bf);render();toast(bf?'הגופן הוגדל ב־30%':'חזרה לגופן רגיל');break;}
    case 'relinkCancel':S.relink=false;render();break;
    case 'shelfTog':setTimeout(()=>{const d=document.querySelector('.shelf');if(d)LS.set('shelfOpen',d.open)},0);break;
    /* book games */
    case 'gAns':{if(sc.answered)break;const q=sc.items[sc.idx];const k=+el.dataset.k;
      if(q.a.length>1){if(sc.picked.includes(k)){sc.picked=sc.picked.filter(x=>x!==k);render();break}sc.picked.push(k);if(sc.picked.length<q.a.length){render();break}}
      else sc.picked=[k];
      sc.answered=true;sc.wasOk=q.a.every(x=>sc.picked.includes(x));
      if(sc.wasOk){sc.correct++;sfx.ok();if(q.gap&&q.say)setTimeout(()=>say(q.say),350)}else{sfx.bad();sc.missed.push(q.ans||q.o[q.a[0]])}
      render();break;}
    case 'gHint':{const i=islandById(sc.id),q=sc.items[sc.idx];const h=hintOf(i,q,sc.kind);if(!h)break;sc.hintAt=sc.idx;
      if(h.elim){const wrong=q.o.map((o,k)=>k).filter(k=>!q.a.includes(k));sc.elim=shuffle(wrong).slice(0,2)}sfx.tap&&sfx.tap();render();break;}
    case 'tfAns':{if(sc.answered)break;const q=sc.items[sc.idx];sc.pick=el.dataset.v==='1';sc.answered=true;sc.wasOk=sc.pick===q.t;
      if(sc.wasOk){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(q.s)}
      render();if(q.fix)setTimeout(()=>say(q.fix),400);break;}
    case 'sortAns':{if(sc.answered)break;const q=sc.items[sc.idx];sc.pick=+el.dataset.g;sc.answered=true;sc.wasOk=sc.pick===q.gi;
      if(sc.wasOk){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(q.w)}render();break;}
    case 'gNext':{sc.answered=false;sc.picked=[];sc.pick=null;
      const total=sc.items.length;if(sc.idx<total-1){sc.idx++;render()}else gameDone(sc,sc.correct,total,sc.missed);break;}
    case 'memo':{if(sc.lock)break;const c=sc.cards[+el.dataset.k];if(c.open||c.done)break;c.open=true;sfx.flip();say(c.t);
      if(sc.first==null){sc.first=c.k;render();break}
      const f=sc.cards[sc.first];sc.first=null;
      if(f.p===c.p){f.done=c.done=true;sc.found++;setTimeout(()=>sfx.ok(),250);render();
        if(sc.found===sc.total)setTimeout(()=>gameDone(sc,sc.total,sc.total,[]),900)}
      else{sc.mistakes++;sc.lock=true;render();setTimeout(()=>{f.open=c.open=false;sc.lock=false;if(S.screen===sc)render()},1000)}
      break;}
    case 'ordTap':{const k=+el.dataset.k;if(k===sc.next){sc.next++;sfx.ok();sc.flash=null}else{sc.err++;sfx.bad();sc.flash=k;setTimeout(()=>{if(S.screen===sc){sc.flash=null;render()}},600)}
      if(sc.next>=sc.shuf.length&&!sc.err)sc.correct++;
      render();break;}
    case 'ordNext':{if(sc.err)sc.missed.push(sc.items[sc.idx][0]);
      if(sc.idx<sc.items.length-1){sc.idx++;sc.shuf=shuffle(sc.items[sc.idx].map((s,k)=>({s,k})));sc.next=0;sc.err=0;render()}
      else gameDone(sc,sc.correct,sc.items.length,sc.missed);break;}
    case 'spTile':{const t=sc.tiles[+el.dataset.k];if(t.used)break;t.used=true;sc.built.push(t);sfx.tap();
      const w=sc.items[sc.idx];if(sc.built.length===plainW(w.en).length){sc.checked=true;sc.ok=sc.built.map(x=>x.ch).join('')===plainW(w.en);
        if(sc.ok){sc.correct++;sfx.ok()}else{sfx.bad();sc.missed.push(w.en)}say(w.en)}
      render();break;}
    case 'spBack':{const t=sc.built.pop();if(t)t.used=false;render();break;}
    case 'spNext':{if(sc.idx<sc.items.length-1){sc.idx++;Object.assign(sc,spellState(sc.items[sc.idx]));render();say(sc.items[sc.idx].en)}else finishActivity('spell','בונים מילה',sc.correct,sc.items.length,sc.missed);break;}
    case 'kPlay':kPlay();break;
    case 'kSpeed':sc.slow=!sc.slow;kRun++;hush();render();break;
    case 'kStop':kRun++;clearTimeout(kTimer);hush();kHighlight(-1);break;
    case 'kDone':{kRun++;hush();const i=islandById(sc.id);finishActivity('story','קוראים יחד: '+i.text.title,1,1,[]);break;}
    case 'srGo':srGo();break;
    case 'calDay':S.calDay=+el.dataset.k;S.editLesson=null;render();break;
    case 'lsEdit':if(isParent()){S.editLesson=+el.dataset.k;render()}break;
    case 'lsCancel':S.editLesson=null;render();break;
    case 'exDel':{if(!isParent())break;const c=editableSchedule();c.exams=c.exams.filter(e=>e.id!==el.dataset.id);saveSchedule();toast('המבחן נמחק');break;}
    case 'rtGo':rtGo();break;
    case 'rtHear':{const i=islandById(sc.id);const pi=sc.pi;sayPaced(i.text.paras[pi],k=>{document.querySelectorAll('.rt .w.hl').forEach(x=>x.classList.remove('hl'));const el=document.getElementById(`rw${pi}_${k}`);if(el)el.classList.add('hl')});break;}
    case 'coListen':sayPaced(el.dataset.w,null,null,'x');break;
    case 'coHear':say(el.dataset.w,.7);break;
    case 'coCtx':{const i=islandById(sc.id);const co=sc.coach;if(!co)break;const para=i.text.paras[co.pi];const w=el.dataset.w;const st=sentenceWith(para,w);sayPaced(st,null,null,S.speed==='x'?'s':S.speed);break;}
    case 'cfStay':S.confirm=null;render();break;
    case 'cfGo':{const t=S.confirm;S.confirm=null;if(t)navTo(t,true);break;}
    case 'coSay':coSay(el.dataset.w);break;

/* ============ MATH WORLD (גיל): fractions and mixed numbers ============ */
// עולם חשבון בצד הלקוח בלבד: הנתונים נשמרים יחד עם עולם האנגלית של גיל (מזהי איים שונים, בלי התנגשות)
const MATH_TRACKS=[{k:'fractions',t:'שברים',ic:'➗',flag:'#d7f23c'}];
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mixPool(){const out=[];for(let d=2;d<=9;d++)for(let w=1;w<=4;w++)for(let r=1;r<d;r++)out.push({w,r,d,n:w*d+r});return out}
const fS=(n,d)=>n+'/'+d, mS=(w,r,d)=>w+' '+r+'/'+d;
function pickDistinct(pool,k,key){const seen=new Set(),out=[];for(const x of shuffle(pool)){const kk=key(x);if(seen.has(kk))continue;seen.add(kk);out.push(x);if(out.length>=k)break}return out}
function optsWith(correct,cands){const o=[correct];for(const c of shuffle(cands))if(c&&!o.includes(c)&&o.length<4)o.push(c);const sh=shuffle(o);return {o:sh,a:sh.indexOf(correct)}}
function mathFixedIslands(){
  const P=mixPool();const byVal=x=>x.n+'/'+x.d;
  // G0: which fraction is bigger than 1
  const g0={kind:'mc',title:'איזה שבר גדול מ־1?',desc:'מכירים שבר שיש בו יותר משלם',items:pickDistinct(P,6,byVal).map(x=>{const props=[];while(props.length<3){const d=rnd(2,9),n=rnd(1,d-1),s=fS(n,d);if(!props.includes(s))props.push(s)}
    const {o,a}=optsWith(fS(x.n,x.d),props);return {q:'איזה שבר גדול מ־1?',o,a,why:`ב־${fS(x.n,x.d)} המונה (${x.n}) גדול מהמכנה (${x.d}), ולכן יש בו יותר משלם אחד.`}})};
  // G1: improper fraction -> mixed number
  const g1={kind:'mc',title:'משבר למספר מעורב',desc:'מחלקים מונה במכנה: שלמים ושארית',items:pickDistinct(P,8,byVal).map(x=>{const c=mS(x.w,x.r,x.d);
    const cands=[x.d-x.r!==x.r?mS(x.w,x.d-x.r,x.d):null,mS(x.w+1,x.r,x.d),x.w>1?mS(x.w-1,x.r,x.d):mS(x.w+2,x.r,x.d),x.r<x.d&&x.w<x.d&&x.w!==x.r?mS(x.r,x.w,x.d):null,mS(x.w,x.r,x.n)];
    const {o,a}=optsWith(c,cands);return {q:'הפכי למספר מעורב: '+fS(x.n,x.d),o,a,why:`${x.n}÷${x.d} = ${x.w} ושארית ${x.r}. ${x.w} שלמים, והשארית ${x.r} נשארת מעל המכנה ${x.d}: ${c}`}})};
  // G2: mixed number -> improper fraction
  const g2={kind:'mc',title:'ממספר מעורב לשבר',desc:'שלם כפול מכנה, ועוד המונה',items:pickDistinct(P,8,byVal).map(x=>{const c=fS(x.n,x.d);
    const cands=[fS(x.w+x.r,x.d),fS(x.w*x.r+x.d,x.d),x.w*x.d-x.r>0?fS(x.w*x.d-x.r,x.d):null,fS(x.n+1,x.d),fS(x.n,x.d+1)];
    const {o,a}=optsWith(c,cands);return {q:'הפכי לשבר: '+mS(x.w,x.r,x.d),o,a,why:`${x.w}×${x.d}+${x.r} = ${x.n}. המכנה נשאר ${x.d}, ולכן התשובה ${c}`}})};
  // G3: true / false (including whole numbers)
  const tfItems=pickDistinct(P,6,byVal).map((x,k)=>{const right=mS(x.w,x.r,x.d);const truth=k%2===0;
    const wrong=shuffle([mS(x.w+1,x.r,x.d),x.d-x.r!==x.r?mS(x.w,x.d-x.r,x.d):mS(x.w,x.r,x.d+1),x.w>1?mS(x.w-1,x.r,x.d):mS(x.w+2,x.r,x.d)])[0];
    return {s:fS(x.n,x.d)+' = '+(truth?right:wrong),t:truth,fix:truth?`${x.n}÷${x.d} = ${x.w} ושארית ${x.r}`:fS(x.n,x.d)+' = '+right}});
  [[rnd(2,5),rnd(2,4)],[rnd(2,5),rnd(2,4)]].forEach(([d,w],k)=>{const n=d*w;tfItems.push(k===0?{s:fS(n,d)+' = '+w,t:true,fix:`${n}÷${d} = ${w} בלי שארית, ולכן זה מספר שלם`}:{s:fS(n,d)+' = '+(w+1),t:false,fix:fS(n,d)+' = '+w})});
  const g3={kind:'tf',title:'נכון או לא נכון?',desc:'בודקים תרגיל ומוצאים טעויות',items:shuffle(tfItems)};
  // G4: memory pairs
  const g4={kind:'pairs',title:'זיכרון: שבר ומספר מעורב',desc:'מוצאים זוגות ששווים זה לזה',pairs:pickDistinct(P,6,x=>byVal(x)+'|'+x.w+' '+x.r).filter((x,k,a)=>a.findIndex(y=>y.w===x.w&&y.r===x.r&&y.d===x.d)===k).map(x=>[fS(x.n,x.d),mS(x.w,x.r,x.d)])};
  const howto=`<p><b>משבר למספר מעורב:</b> מחלקים את המונה במכנה. התוצאה היא מספר השלמים, והשארית נשארת מעל אותו מכנה.</p><p>דוגמה: ${fx('11/4 ← 11÷4 = 2 ושארית 3 ← 2 3/4')}</p>
    <p><b>ממספר מעורב לשבר:</b> כופלים את השלם במכנה ומוסיפים את המונה. המכנה לא משתנה.</p><p>דוגמה: ${fx('2 3/4 ← 2×4+3 = 11 ← 11/4')}</p>`;
  return [{id:'m-mixed',kind:'fixed',track:'fractions',name:'שבר ומספר מעורב',en:'',topic:'כיתה ה׳ · הופכים שבר למספר מעורב ובחזרה · תמיד פתוח, עם תרגילים חדשים בכל פעם',howto,
    words:[],games:[g0,g1,g2,g3,g4],mistakes:[],source:'',created:'0'}];
}

/* ============ YUVAL MATH: a guided path to the test (מבחן 18.11) ============ */
// עולם חשבון של יובל: מסלול שלבים, בכל שלב כרטיסייה אחת לתרגול עם רמות, רמזים, פתרון מלא וזיהוי סוג הטעות.
// הכול בצד הלקוח. ההתקדמות נשמרת ב-S.progress.ym (נשמר יחד עם עולם האנגלית שלה).
const isYM=()=>WORLD==='math'&&((S.profile&&S.profile.child)||CHILD)==='yuvik';
const YM_TEST={date:'2026-11-18',label:'רביעי 18.11'};
const MI='−';
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let x=0;while(!x)x=ri(a,b);return x};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcdN=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
function Q(n,d=1){if(d<0){n=-n;d=-d}if(n===0)return {n:0,d:1};const g=gcdN(n,d);return {n:n/g,d:d/g}}
const qI=n=>Q(n,1);
const qA=(x,y)=>Q(x.n*y.d+y.n*x.d,x.d*y.d),qS=(x,y)=>Q(x.n*y.d-y.n*x.d,x.d*y.d),qM=(x,y)=>Q(x.n*y.n,x.d*y.d),qD=(x,y)=>Q(x.n*y.d,x.d*y.n);
const qN=x=>Q(-x.n,x.d),qAbs=x=>Q(Math.abs(x.n),x.d),qEq=(x,y)=>!!x&&!!y&&x.n===y.n&&x.d===y.d,qV=x=>x.n/x.d;
// display: integer, fraction or mixed number; dec=true shows a decimal
function qt(x,dec){if(typeof x==='number')x=qI(x);const s=x.n<0?MI:'';const a=Math.abs(x.n);if(x.d===1)return s+a;
  if(dec)return s+String(+(a/x.d).toFixed(4));
  return a>x.d?s+Math.floor(a/x.d)+' '+(a%x.d)+'/'+x.d:s+a+'/'+x.d}
const qp=(x,dec)=>{if(typeof x==='number')x=qI(x);return '('+(x.n<0?MI:'+')+qt(qAbs(x),dec)+')'};   // (−5) / (+3)
const qf=(x,dec)=>{if(typeof x==='number')x=qI(x);return x.n<0?'('+qt(x,dec)+')':qt(x,dec)};       // (−5) / 3
const bd=s=>`<bdi dir="ltr">${s}</bdi>`;
function qParse(s){s=String(s||'').replace(/[−–]/g,'-').replace(/\s+/g,' ').trim();let m;
  const sg=(neg,v)=>neg==='-'?qN(v):v;
  if((m=s.match(/^([+-]?) ?(\d+) (\d+)\/(\d+)$/))){if(!+m[4])return null;return sg(m[1],Q(+m[2]*+m[4]+ +m[3],+m[4]))}
  if((m=s.match(/^([+-]?) ?(\d+)\/(\d+)$/))){if(!+m[3])return null;return sg(m[1],Q(+m[2],+m[3]))}
  if((m=s.match(/^([+-]?) ?(\d*)\.(\d+)$/))){const p=10**m[3].length;return sg(m[1],Q(+(m[2]||0)*p+ +m[3],p))}
  if((m=s.match(/^([+-]?) ?(\d+)$/)))return sg(m[1],qI(+m[2]));
  return null}

/* ---- ציורים: מערכת צירים וזוויות ---- */
function ymGrid(o){const R=6,c=22,W=(2*R+1)*c+20,ox=W/2,oy=W/2,X=x=>ox+x*c,Y=y=>oy-y*c;let g='';
  for(let k=-R;k<=R;k++){g+=`<line x1="${X(k)}" y1="${Y(-R)}" x2="${X(k)}" y2="${Y(R)}" stroke="#dfe7ee"/><line x1="${X(-R)}" y1="${Y(k)}" x2="${X(R)}" y2="${Y(k)}" stroke="#dfe7ee"/>`;
    if(k&&k%2===0)g+=`<text x="${X(k)}" y="${oy+14}" font-size="10" text-anchor="middle" fill="#6b7f8e">${k<0?MI+(-k):k}</text><text x="${ox-6}" y="${Y(k)+3}" font-size="10" text-anchor="end" fill="#6b7f8e">${k<0?MI+(-k):k}</text>`}
  g+=`<line x1="${X(-R)-6}" y1="${oy}" x2="${X(R)+8}" y2="${oy}" stroke="#334" stroke-width="1.6"/><line x1="${ox}" y1="${Y(-R)+6}" x2="${ox}" y2="${Y(R)-8}" stroke="#334" stroke-width="1.6"/><text x="${X(R)+6}" y="${oy-6}" font-size="12" font-style="italic">x</text><text x="${ox+6}" y="${Y(R)-2}" font-size="12" font-style="italic">y</text><text x="${ox-4}" y="${oy+12}" font-size="10" text-anchor="end" fill="#6b7f8e">0</text>`;
  (o.poly||[]).forEach(p=>{g+=`<polygon points="${p.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="rgba(31,143,179,.18)" stroke="#1f8fb3" stroke-width="2"/>`});
  (o.seg||[]).forEach(([a,b])=>{g+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="#1f8fb3" stroke-width="3"/>`});
  (o.pts||[]).forEach(p=>{g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="#e0395f"/><text x="${X(p.x)+6}" y="${Y(p.y)-6}" font-size="13" font-weight="800" fill="#c2213f">${p.l||''}</text>`});
  return `<svg class="ymfig" viewBox="0 0 ${W} ${W}" width="${W}" height="${W}" dir="ltr">${g}</svg>`}
function ymAngles(a,lab){// two lines; angle 1 = a (between ray 0° and ray a°), 2 = 180−a, 3 = a, 4 = 180−a
  const W=260,H=200,cx=130,cy=100,L=110,pt=(d,r)=>[cx+r*Math.cos(d*Math.PI/180),cy-r*Math.sin(d*Math.PI/180)];let g='';
  [[0,180],[a,a+180]].forEach(([d1,d2])=>{const p=pt(d1,L),q=pt(d2,L);g+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="#334" stroke-width="2.2"/>`});
  const mids=[a/2,a+(180-a)/2,180+a/2,180+a+(180-a)/2];
  mids.forEach((m,k)=>{const [x,y]=pt(m,k%2?34:40);g+=`<text x="${x}" y="${y+5}" font-size="${lab[k]?14:13}" font-weight="800" text-anchor="middle" fill="${lab[k]&&lab[k]!==String(k+1)?'#c2213f':'#1f6f8b'}">${lab[k]||k+1}</text>`});
  const arc=(s,e,r,col)=>{const [x1,y1]=pt(s,r),[x2,y2]=pt(e,r);return `<path d="M${x1} ${y1} A${r} ${r} 0 0 0 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="1.6"/>`};
  [[0,a],[a,180],[180,180+a],[180+a,360]].forEach(([s0,e0],k)=>{if(lab[k])g+=arc(s0,e0,k%2?18:24,lab[k]==='?'?'#e0a000':'#c2213f')});
  return `<svg class="ymfig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" dir="ltr">${g}</svg>`}
function ymTri(lab){const W=220,H=190;return `<svg class="ymfig" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" dir="ltr"><polygon points="110,18 200,170 20,170" fill="rgba(31,143,179,.14)" stroke="#334" stroke-width="2.2"/>
  <text x="44" y="92" font-size="14" font-weight="800" fill="#c2213f" text-anchor="middle">${lab[0]||''}</text><text x="178" y="92" font-size="14" font-weight="800" fill="#c2213f" text-anchor="middle">${lab[1]||''}</text><text x="110" y="188" font-size="14" font-weight="800" fill="#c2213f" text-anchor="middle">${lab[2]||''}</text></svg>`}

const yq=(o)=>o; // item: {he, m, a|o+ai, alt, tag, steps:[[he,math]], hint, fig, oTags}
const mcItem=(he,m,opts,correct,extra)=>{const o=shuffle(opts.filter((x,k,a)=>a.indexOf(x)===k));return {he,m,o,ai:o.indexOf(correct),...(extra||{})}};
const cmpSym=(x,y)=>qV(x)>qV(y)?'>':qV(x)<qV(y)?'<':'=';
const signOf=x=>x.n>0?'+':x.n<0?MI:'0';
function smallFrac(){const d=pick([2,3,4,5,6,8]);return Q(nz(-2*d+1,2*d-1),d)}

{id:'s5',ic:'✖️',t:'כפל מספרים מכוונים',pages:'עמ׳ 122–128',
 rule:`<p><b>שני מספרים:</b> סימנים זהים ← +. סימנים שונים ← −. ${bd('(−5) · (−9) = 45')}, ${bd('17 · (−1) = −17')}</p><p><b>הרבה גורמים:</b> סופרים כמה גורמים שליליים. זוגי ← +, אי־זוגי ← −. אם יש 0, המכפלה 0.</p><p><b>שברים:</b> קודם קובעים סימן, אחר כך מונה × מונה, מכנה × מכנה, ומצמצמים. מספר מעורב הופכים לשבר.</p>`.replace(/−/g,MI),
 ex:[['3 גורמים שליליים (אי־זוגי) ← התוצאה שלילית:',`${MI}2 · 5 · (${MI}3) · (${MI}1) = ${MI}30`],['שברים:',`2/5 · (${MI}15/8) = ${MI}(2·15)/(5·8) = ${MI}3/4`]],
 levels:[
  {n:'כפל שני מספרים',gen(){let a=nz(-12,12),b=nz(-12,12);if(a>0&&b>0)a=-a;return {he:'חשבי:',m:`${qf(a)} · ${qf(b)} =`,a:qI(a*b),tag:'mulsign',alt:[[qI(-a*b),'mulsign']],hint:'קודם הסימן: זהים ← +, שונים ← −.',steps:[[`${a<0===b<0?'סימנים זהים ← +':'סימנים שונים ← −'}`,''],['ואז בלי סימנים:',`${Math.abs(a)} · ${Math.abs(b)} = ${Math.abs(a*b)}`],['התוצאה:',qt(a*b)]]}}},
  {n:'מה הסימן של המכפלה?',gen(){const k=ri(4,7),v=[];for(let i=0;i<k;i++)v.push(nz(-12,12)*(Math.random()<.6?-1:1));const z=Math.random()<.18;if(z)v[ri(1,k-1)]=0;const neg=v.filter(x=>x<0).length;
    const c=z?'אפס':neg%2?'שלילית':'חיובית';return mcItem('מה הסימן של המכפלה? (בלי לחשב)',v.map((x,i)=>i?qf(x):qt(x)).join(' · '),['חיובית','שלילית','אפס'],c,{tag:z?'zero':'count',hint:'סופרים גורמים שליליים. ויש 0?',steps:[[z?'יש גורם 0 ← המכפלה 0':`יש ${neg} גורמים שליליים (${neg%2?'אי־זוגי':'זוגי'}):`,z?'0':`המכפלה ${c}`]]})}},
  {n:'כפל של כמה גורמים',gen(){const k=ri(3,4),v=[];for(let i=0;i<k;i++)v.push(nz(-6,6));const r=v.reduce((a,b)=>a*b,1),neg=v.filter(x=>x<0).length;
    return {he:'חשבי:',m:v.map((x,i)=>i?qf(x):qt(x)).join(' · ')+' =',a:qI(r),alt:[[qI(-r),'count']],tag:'count',hint:'קודם הסימן לפי מספר השליליים, אחר כך המכפלה.',steps:[[`${neg} גורמים שליליים ← ${neg%2?'−':'+'}`,''],['מכפלה בלי סימנים:',v.map(x=>Math.abs(x)).join(' · ')+' = '+Math.abs(r)],['התוצאה:',qt(r)]]}}},
  {n:'כפל שברים ומספרים מעורבים',gen(){let x,y;const t=ri(0,2);
    if(t===0){const d=pick([2,3,4,5]);x=Q(nz(-3,3)*d+pick([1,-1]),d);y=qI(nz(-6,6))}
    else if(t===1){x=Q(nz(-9,9),pick([3,4,5,7]));y=Q(nz(-15,15),pick([2,3,4,8,10]))}
    else{x=qI(nz(-40,40));y=Q(pick([1,1,2,3]),pick([2,3,4,5,10]));if(Math.random()<.5)y=qN(y)}
    const r=qM(x,y);return {he:'חשבי (אפשר לענות בשבר או במספר מעורב):',m:`${qf(x)} · ${qf(y)} =`,a:r,alt:[[qN(r),'sign']],tag:'frac',hint:'מספר מעורב הופכים לשבר. מצמצמים לפני שכופלים.',
      steps:[[`הסימן: ${(x.n<0)===(y.n<0)?'+':MI}`,''],['כשברים:',`${Math.abs(x.n)}/${x.d} · ${Math.abs(y.n)}/${y.d}`],['התוצאה:',qt(r)]]}}},
  {n:'מספר חסר בכפל',gen(){const a=nz(-12,12),b=nz(-12,12);const left=Math.random()<.5;return {he:'מהו המספר החסר?',m:left?`☐ · ${qf(b)} = ${qf(a*b)}`:`${qf(a)} · ☐ = ${qf(a*b)}`,a:qI(left?a:b),alt:[[qI(left?-a:-b),'mulsign']],tag:'missing',hint:'מחלקים את התוצאה במספר הידוע.',steps:[['☐ = התוצאה : המספר הידוע',`${qf(a*b)} : ${qf(left?b:a)} = ${qt(left?a:b)}`]]}}}]},
{id:'s6',ic:'➗',t:'חילוק, וכפל וחילוק ביחד',pages:'עמ׳ 130, 132–136',
 rule:`<p><b>חילוק:</b> אותו חוק סימנים כמו בכפל. ${bd('(−33) : (−11) = 3')}, ${bd('−21 : 7 = −3')}. <b>אסור לחלק ב־0.</b></p><p><b>חילוק בשבר:</b> כופלים בשבר ההפוך. ${bd('12 : (1/2) = 12 · 2 = 24')}</p><p><b>כפל וחילוק ביחד:</b> מחשבים משמאל לימין. קודם אפשר לקבוע את הסימן לפי מספר השליליים.</p>`.replace(/−/g,MI),
 ex:[['חילוק בשבר:',`3/8 : (${MI}2 1/4) = 3/8 : (${MI}9/4) = 3/8 · (${MI}4/9) = ${MI}1/6`],['משמאל לימין:',`${MI}18 : (${MI}9) · 3 = 2 · 3 = 6`]],
 levels:[
  {n:'חילוק מספרים שלמים',gen(){const q=nz(-12,12);let b=nz(-12,12);while(Math.abs(b)<2)b=nz(-12,12);const a=q*b;return {he:'חשבי:',m:`${qt(a)} : ${qf(b)} =`,a:qI(q),alt:[[qI(-q),'mulsign'],[qI(a*b),'muldiv']],tag:'mulsign',hint:'סימן קודם, ואז חילוק.',steps:[[`${(a<0)===(b<0)?'סימנים זהים ← +':'סימנים שונים ← −'}`,''],['בלי סימנים:',`${Math.abs(a)} : ${Math.abs(b)} = ${Math.abs(q)}`],['התוצאה:',qt(q)]]}}},
  {n:'חילוק בשבר',gen(){const a=qI(nz(-15,15));const fd=pick([2,3,4,5]);let fn=pick([1,1,2,3]);while(fn>=fd||gcdN(fn,fd)>1)fn=pick([1,1,2,3]);let f=Q(fn*pick([1,-1]),fd);const r=qD(a,f);return {he:'חשבי:',m:`${qt(a)} : ${qf(f)} =`,a:r,alt:[[qM(a,f),'recip'],[qN(r),'sign']],tag:'recip',hint:'חילוק בשבר = כפל בהפוך שלו.',steps:[['הופכים לכפל בשבר ההפוך:',`${qt(a)} · ${qf(Q(f.d,f.n))}`],['התוצאה:',qt(r)]]}}},
  {n:'חילוק שברים ומספרים מעורבים',gen(){const x=Q(nz(-9,9),pick([2,3,4,5,8]));let y=Math.random()<.5?Q(nz(-9,9),pick([2,3,4,5,6,25])):Q(pick([1,-1])*(ri(1,2)*4+pick([1,3])),4);while(y.d===1)y=Q(nz(-9,9),pick([2,3,4,5,6]));const r=qD(x,y);
    return {he:'חשבי (אפשר לענות בשבר או במספר מעורב):',m:`${qf(x)} : ${qf(y)} =`,a:r,alt:[[qM(x,y),'recip'],[qN(r),'sign']],tag:'recip',hint:'מעורב ← שבר. ואז כפל בהפוך.',steps:[['חילוק ← כפל בשבר ההפוך:',`${qf(x)} · ${qf(Q(y.d,y.n))}`],['התוצאה:',qt(r)]]}}},
  {n:'מספר חסר בחילוק',gen(){const q=nz(-10,10);let b=nz(-10,10);while(Math.abs(b)<2)b=nz(-10,10);const a=q*b,t=ri(0,1);
    if(t===0)return {he:'מהו המספר החסר?',m:`${qt(a)} : ☐ = ${qf(q)}`,a:qI(b),alt:[[qI(-b),'mulsign']],tag:'missing',hint:'במה צריך לחלק את '+bd(qt(a))+' כדי לקבל '+bd(qt(q))+'?',steps:[['☐ = '+qt(a)+' : '+qf(q),`= ${qt(b)}`]]};
    return {he:'מהו המספר החסר?',m:`☐ : ${qf(b)} = ${qf(q)}`,a:qI(a),alt:[[qI(-a),'mulsign'],[qD(qI(q),qI(b)),'muldiv']],tag:'missing',hint:'☐ = התוצאה × המחלק.',steps:[['☐ = '+qf(q)+' · '+qf(b),`= ${qt(a)}`]]}}},
  {n:'כפל וחילוק משמאל לימין',gen(){let v=nz(-9,9),m=qt(v),r=qI(v);const ops=[],vals=[];const k=ri(2,3);
    for(let i=0;i<k;i++){const cur=r.n;const divs=[];for(let d=2;d<=12;d++)if(cur%d===0)divs.push(d);let op=divs.length&&Math.random()<.55?':':'·';let x=op===':'?pick(divs)*pick([1,-1]):nz(-6,6);if(op==='·'&&Math.abs(x)<2)x=pick([2,-2,3,-3]);ops.push(op);vals.push(x);r=op===':'?qD(r,qI(x)):qM(r,qI(x));m+=` ${op} ${qf(x)}`}
    let w=qI(vals[vals.length-1]);for(let i=vals.length-2;i>=0;i--)w=ops[i+1]===':'?qD(qI(vals[i]),w):qM(qI(vals[i]),w);const rl=ops[0]===':'?qD(qI(v),w):qM(qI(v),w);
    let run=qI(v);const st=[];ops.forEach((o,i)=>{const nx=o===':'?qD(run,qI(vals[i])):qM(run,qI(vals[i]));st.push(['שלב '+(i+1)+':',`${qf(run)} ${o} ${qf(vals[i])} = ${qt(nx)}`]);run=nx});
    return {he:'חשבי (משמאל לימין):',m:m+' =',a:r,alt:qEq(rl,r)?[]:[[rl,'order']],tag:'order',hint:'מתחילים מהשמאלי ומתקדמים לפי הסדר.',steps:st}}}]},
{id:'s7',ic:'📐',t:'זוויות צמודות וזוויות קודקודיות',pages:'עמ׳ 274–290',
 rule:`<p><b>זוויות צמודות</b> נמצאות זו ליד זו על ישר אחד, וסכומן <b>180°</b>.</p><p><b>זוויות קודקודיות</b> נמצאות זו מול זו כששני ישרים נחתכים, והן <b>שוות</b>.</p><p>בחיתוך של שני ישרים: ${bd('∠1 = ∠3')}, ${bd('∠2 = ∠4')}, ${bd('∠1 + ∠2 = 180°')}.</p>`,

 levels:[
  {n:'זווית צמודה',gen(){const a=pick([...Array(29)].map((_,k)=>20+k*5).filter(v=>v!==90));return {he:`${bd('∠1 = '+a+'°')}. כמה מעלות ${bd('∠2')}?`,m:'∠2 = ?°',a:qI(180-a),alt:[[qI(a),'vertadj'],[qI(90-a),'adj180'],[qI(360-a),'adj180']],tag:'adj180',fig:ymAngles(a,[a+'°','?','','']),hint:'∠1 ו־∠2 צמודות: יחד 180°.',steps:[['צמודות משלימות ל־180°:',`∠2 = 180° ${MI} ${a}° = ${180-a}°`]]}}},
  {n:'זווית קודקודית',gen(){const a=pick([...Array(29)].map((_,k)=>20+k*5).filter(v=>v!==90));return {he:`${bd('∠1 = '+a+'°')}. כמה מעלות ${bd('∠3')}?`,m:'∠3 = ?°',a:qI(a),alt:[[qI(180-a),'vertadj']],tag:'vertadj',fig:ymAngles(a,[a+'°','','?','']),hint:'∠1 ו־∠3 נמצאות זו מול זו.',steps:[['קודקודיות שוות:',`∠3 = ∠1 = ${a}°`]]}}},
  {n:'כל הזוויות בחיתוך',gen(){const a=pick([...Array(29)].map((_,k)=>20+k*5).filter(v=>v!==90)),vals=[a,180-a,a,180-a];const g=ri(0,3);let w=ri(0,3);while(w===g)w=ri(0,3);const lab=['','','',''];lab[g]=vals[g]+'°';lab[w]='?';
    const adj=Math.abs(g-w)%2===1;return {he:`${bd('∠'+(g+1)+' = '+vals[g]+'°')}. כמה מעלות ${bd('∠'+(w+1))}?`,m:`∠${w+1} = ?°`,a:qI(vals[w]),alt:[[qI(adj?vals[g]:180-vals[g]),'vertadj']],tag:'vertadj',fig:ymAngles(a,lab),hint:'צמודות (זו ליד זו) או קודקודיות (זו מול זו)?',steps:[[adj?'צמודות ← 180° פחות:':'קודקודיות ← שוות:',adj?`180° ${MI} ${vals[g]}° = ${vals[w]}°`:`∠${w+1} = ${vals[w]}°`]]}}},
  {n:'משוואה עם x',gen(){const t=ri(0,2);
    if(t===0){const x=ri(35,80),d=180-2*x;return {he:`${bd('∠1')} ו־${bd('∠2')} צמודות. ${bd('∠1 = x')}, ${bd('∠2 = x + '+d)}. מצאי את x.`,m:'x = ?',a:qI(x),alt:[[qI(180-d),'equation'],[qI(x+d),'equation']],tag:'equation',fig:ymAngles(Math.min(170,Math.max(10,x)),['x','x+'+d,'','']),hint:'צמודות: ∠1 + ∠2 = 180.',steps:[['צמודות:',`x + x + ${d} = 180`],['',`2x = ${180-d}`],['',`x = ${x}`]]}}
    if(t===1){const pr=pick([[1,2],[1,3],[2,3],[1,5],[4,5],[1,4],[3,6],[2,7]]),x=180/(pr[0]+pr[1]);const L=k=>k===1?'x':k+'x';return {he:`${bd('∠1')} ו־${bd('∠2')} צמודות. ${bd('∠1 = '+L(pr[0]))}, ${bd('∠2 = '+L(pr[1]))}. מצאי את x.`,m:'x = ?',a:qI(x),alt:[[qI(180),'equation'],[qI(90),'equation']],tag:'equation',fig:ymAngles(Math.min(170,Math.max(10,pr[0]*x)),[L(pr[0]),L(pr[1]),'','']),hint:'צמודות: הסכום 180.',steps:[['צמודות:',`${L(pr[0])} + ${L(pr[1])} = 180`],['',`${pr[0]+pr[1]}x = 180`],['',`x = ${x}`]]}}
    const x=ri(10,40),k=ri(2,4);let b=ri(0,20);if(k*x-b<15)b=0;const c=(k-1)*x-b;if(c<=0||k*x-b>165)return this.gen();
    return {he:`${bd('∠1')} ו־${bd('∠3')} קודקודיות. ${bd('∠1 = '+k+'x'+(b?' '+MI+' '+b:''))}, ${bd('∠3 = x + '+c)}. מצאי את x.`,m:'x = ?',a:qI(x),alt:[[qI((180-c+b)/(k+1)),'vertadj']],tag:'equation',fig:ymAngles(k*x-b,[`${k}x${b?MI+b:''}`,'',`x+${c}`,'']),hint:'קודקודיות שוות: כותבים ∠1 = ∠3.',steps:[['קודקודיות שוות:',`${k}x ${b?MI+' '+b:''} = x + ${c}`],['',`${k-1}x = ${c+b}`],['',`x = ${x}`]]}}},
  {n:'נכון או לא נכון?',gen(){const S=[['זוויות צמודות משלימות זו את זו ל־180°.',1],['זוויות קודקודיות שוות זו לזו.',1],['זוויות קודקודיות משלימות ל־180°.',0],['שתי זוויות צמודות יכולות להיות שתיהן חדות.',0],['אם זווית אחת היא 90°, גם הצמודה לה היא 90°.',1],['זווית קהה והזווית הצמודה לה: הצמודה תמיד חדה.',1],['בחיתוך של שני ישרים יש שני זוגות של זוויות קודקודיות.',1],['שתי זוויות שסכומן 180° הן תמיד צמודות.',0]];const s=pick(S);
    return mcItem(s[0],'',['נכון','לא נכון'],s[1]?'נכון':'לא נכון',{tag:'concept',steps:[[s[1]?'נכון.':'לא נכון.','']],hint:'חשבי על הציור של שני ישרים נחתכים.'})}}]},
{id:'s8',ic:'🔺',t:'משולש שווה צלעות',pages:'עמ׳ 293–296',
 rule:`<p>במשולש <b>שווה צלעות</b> שלוש הצלעות שוות, ושלוש הזוויות שוות: כל אחת <b>60°</b> (כי ${bd('180 : 3 = 60')}).</p><p><b>היקף</b> = 3 × צלע. צלע = היקף : 3.</p><p>הזווית הצמודה לזווית של המשולש היא ${bd('180° − 60° = 120°')}.</p>`.replace(/−/g,MI),
 ex:[['צלע 7 ס״מ:','היקף = 3 · 7 = 21 ס״מ'],['צלעות x + 3 ו־9 שוות:','x + 3 = 9 ← x = 6']],
 levels:[
  {n:'זוויות במשולש שווה צלעות',gen(){const t=ri(0,2);const Qs=[['כמה מעלות כל זווית במשולש שווה צלעות?',60,'180 : 3 = 60'],['כמה מעלות הזווית הצמודה לזווית של משולש שווה צלעות?',120,`180 ${MI} 60 = 120`],['מה סכום הזוויות במשולש שווה צלעות?',180,'60 + 60 + 60 = 180']][t];
    return {he:Qs[0],m:'? °',a:qI(Qs[1]),alt:[[qI(t===1?60:t===0?180:60),'equi']],tag:'equi',fig:ymTri(t===0?['','','']:['','','']),hint:'שלוש זוויות שוות, וביחד 180°.',steps:[['',Qs[2]]]}}},
  {n:'היקף וצלע',gen(){const s=ri(3,25);if(Math.random()<.5)return {he:`צלע של משולש שווה צלעות היא ${s} ס״מ. מה ההיקף?`,m:'? ס״מ',a:qI(3*s),alt:[[qI(4*s),'equi'],[qI(2*s),'equi']],tag:'equi',fig:ymTri([s,s,s]),hint:'שלוש צלעות שוות.',steps:[['היקף = 3 × צלע:',`3 · ${s} = ${3*s}`]]};
    return {he:`ההיקף של משולש שווה צלעות הוא ${3*s} ס״מ. מה אורך הצלע?`,m:'? ס״מ',a:qI(s),alt:[[Q(3*s,4),'equi'],[Q(3*s,2),'equi']],tag:'equi',fig:ymTri(['?','?','?']),hint:'מחלקים את ההיקף ל־3.',steps:[['צלע = היקף : 3:',`${3*s} : 3 = ${s}`]]}}},
  {n:'צלעות עם x',gen(){const x=ri(2,12),a=ri(1,9),s=x+a,k=ri(2,4),b=k*x-s;const e2=b>0?`${k}x ${MI} ${b}`:b<0?`${k}x + ${-b}`:`${k}x`;const askP=Math.random()<.35;

/* ============ NAVIGATION: back button, exit confirmation ============ */
function stopAll(){kRun++;clearTimeout(kTimer);hush();const sc=S.screen;try{sc&&sc.stop&&sc.stop()}catch(e){}try{SR&&SR.stop()}catch(e){}try{CO_R&&CO_R.stop()}catch(e){}}
function inProgress(sc){if(!sc||S.tab!=='map')return false;switch(sc.name){
  case 'game':return sc.idx>0||!!sc.answered||sc.found>0||sc.mistakes>0||sc.next>0;
  case 'spell':return sc.idx>0||sc.built.length>0;
  case 'quiz':case 'sounds':case 'fix':return sc.idx>0||!!sc.answered;
  case 'read2':return sc.idx>0||!!sc.res;
  case 'readtext':return sc.res.some(Boolean)||!!sc.listening;
  case 'unseen':return sc.answers.some(x=>x!=null);
  case 'ym':return (sc.n>0||sc.tries>0||!!sc.inp)&&sc.n<sc.total;
  case 'readaloud':return sc.idx>0;}return false}
function navTo(t,force){
  if(!force&&inProgress(S.screen)){S.confirm=t;render();return}
  S.confirm=null;stopAll();
  if(t.act==='home'){S.screen={name:'map'};S.tab='map'}
  else if(t.act==='ymStage'||t.act==='island'&&isYM()){S.tab='map';S.screen=t.act==='ymStage'&&t.id&&ymStage(t.id)?{name:'ymStage',id:t.id}:{name:'map'}}
  else if(t.act==='island'){const id=t.id||S.screen.id;S.tab='map';S.screen=id?{name:'island',id}:{name:'map'};markSeen(id)}
  render();scrollTo({top:0});
}

function goBack(){
  if(S.confirm){S.confirm=null;render();return true}
  if(S.relink&&KEY){S.relink=false;render();return true}
  if(S.tab!=='map'){stopAll();S.tab='map';render();scrollTo({top:0});return true}
  const sc=S.screen;if(!sc||sc.name==='map')return false;
  if(sc.name==='ym'){navTo(sc.mode==='stage'?{act:'ymStage',id:sc.id}:{act:'home'});return true}
  if(sc.name==='ymStage'||sc.name==='ymEnd'){navTo({act:'home'});return true}
  if(sc.name==='island')navTo({act:'home'});else navTo({act:'island',id:sc.id});
  return true;
}

addEventListener('popstate',()=>{if(!goBack())return;armBack()});
/* 5 לחיצות מהירות על האייקון שבכותרת: החלפת קישור (למשל מעבר לקישור הורה) */
let logoTaps=[];document.querySelector('.brand img').addEventListener('click',()=>{const t=Date.now();logoTaps=logoTaps.filter(x=>t-x<2500);logoTaps.push(t);if(logoTaps.length>=5){logoTaps=[];S.relink=true;render()}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('isl')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{if(e.target.id==='calTT'||e.target.id==='calEX'){const f=e.target.files[0];const note=e.target.dataset.note;e.target.value='';if(f)calPhoto(f,note);return}
  if(e.target.id==='fileIn'){const files=[...e.target.files];e.target.value='';if(files.length)addFiles(files);return}
  if(e.target.id==='camIn'||e.target.id==='galIn'){const files=[...e.target.files];e.target.value='';if(files.length)addFiles(files)}});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  if(f.dataset.form==='key'){
    const k=keyFromText($('#keyIn').value);if(!k){toast('הקישור לא נראה נכון. העתיקי את כולו, כולל הסוף אחרי #k=');return}
    KEY=k;LS.set('key',KEY);S.badKey=false;S.relink=false;outbox={};LS.set('outbox',outbox);
    render();loadAll();return;
  }
  if(f.dataset.form==='exam'){
    const date=$('#exD').value,subject=$('#exS').value.trim(),note=$('#exN').value.trim();if(!date||!subject)return;
    const c=editableSchedule();c.exams=c.exams||[];c.exams.push({id:uid('e'),date,subject,note});saveSchedule();sfx.ok();toast('המבחן נוסף');return;
  }
  if(f.dataset.form==='lesson'){
    const k=+f.dataset.k;const c=editableSchedule();const di=S.calDay!=null?S.calDay:(new Date().getDay()<=4?new Date().getDay():0);
    while(c.days.length<=di)c.days.push({d:DAY_NAMES[c.days.length],l:[]});
    const subj=$('#lsS').value.trim();c.days[di].l[k]=subj?{s:subj,t:$('#lsT').value.trim(),r:$('#lsR').value.trim()}:null;
    S.editLesson=null;saveSchedule();toast('השיעור עודכן');return;
  }
  if(f.dataset.form==='word'){
    const en=$('#wEn').value.trim(),he=$('#wHe').value.trim(),ex=$('#wEx').value.trim();if(!en||!he)return;
    S.classWords.push({id:uid('w'),en,he,ex,added:Date.now()});saveState('classwords');sfx.ok();toast('המילה נוספה');render();
  }else if(f.dataset.form==='zoom'){
    const z={id:uid('z'),date:$('#zDate').value,time:$('#zTime').value,teacher:$('#zTeacher').value.trim(),link:$('#zLink').value.trim(),done:false,notes:'',recs:[]};
    if(!z.date)return;S.zoom.push(z);saveState('zoom');sfx.ok();toast('השיעור נשמר');render();
  }else if(f.dataset.form==='znotes'){
    const z=S.zoom.find(x=>x.id===f.dataset.id);if(!z)return;z.notes=(f.querySelector('input').value||'').trim();if(!z.notes)return;saveState('zoom');toast('נשמר');render();
  }else if(f.dataset.form==='paste'){
    const t=($('#pasteIn').value||'').trim();if(!t){toast('אין מה לשלוח');return}const zm=zoomMeta('pasteZoom');if(!zm){toast('בחרי למה זה שייך');return}
    const tsig='t:'+t.slice(0,300);if(upSigs().has(tsig)){toast('את זה כבר שלחת, אין צורך שוב 🙂');$('#pasteIn').value='';return}upRemember(tsig);
    const blob=new Blob([t],{type:'text/plain'});const id=uid('f');
    S.shots.push({id,blob,name:'טקסט שהודבק.txt',file:true,status:'wait'});queueUpload({id,kind:'file',blob,meta:{note:'טקסט שהודבק',name:'טקסט שהודבק.txt',...zm}});
    sfx.ok();if(/(drive|docs)\.google\.com/.test(t))S.confirm=null,setTimeout(()=>alert('נשלח! שימי לב: זה קישור לקובץ בדרייב שלך, ואנחנו לא יכולים לפתוח אותו.\nכדי שזה יעבוד: בדרייב לוחצים על הקובץ ← ⋮ ← "שיתוף" ← "כל מי שיש לו את הקישור".\nאו פשוט: מורידים את הקובץ לטלפון ומצרפים אותו ב"צרף קובץ" 📎'),50);else toast('נשלח לדרייב');render();
  }else if(f.dataset.form==='shots'){
    const note=($('#shotNote')?.value||'').trim();const zm=zoomMeta('shotZoom');if(!zm){toast('בחרי למה זה שייך');return}
    S.shots.filter(s=>s.status==='new').forEach(s=>{s.status='wait';upRemember(s.sig);queueUpload({id:s.id,kind:s.file?'file':'photo',blob:s.blob,meta:s.file?{note,name:s.name,...zm}:{note,...zm}})});
    sfx.ok();toast('הצילומים נשלחים לדרייב');render();
  }
});

/* ============ START ============ */
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
checkStatus();
render();
loadAll();
</script>
</body>
</html>
